    domains: [gall.dcinside.com/mgallery/board, m.dcinside.com/board/wutheringwaves]

updates:
  - id: wuthering-waves-news
    collection: news
    sources: [kuro-official, official-x-kr, press-kr]
    frequency: 12h
    instructions: >-
      공식 홈페이지 뉴스와 한국 공식 X에서 버전 업데이트·픽업·점검 공지를 찾아 news 레코드로 추가한다.
      게시일을 확인할 수 없으면 publishedAt: null.
  - id: wuthering-waves-versions
    collection: versions
    sources: [kuro-official, official-x-kr]
    frequency: patch
    instructions: >-
      새 버전 미리보기·업데이트 안내가 나오면 versions 레코드(v<major>-<minor>)를 추가한다. start는 업데이트 점검 시작 시각,
      end는 다음 버전 점검 시작 시각(미공개면 null). highlights는 공지의 신규 캐릭터·무기·지역·에코·스토리·도전 콘텐츠·점검 보상을 한 줄씩.
  - id: wuthering-waves-resonators
    collection: resonators
    sources: [kuro-official, encore-db, press-kr, press-en]
    frequency: patch
    instructions: >-
      신규 공명자 공개 시 레코드를 추가하고, 복각·조정이 있으면 해당 공명자의 history에 항목을 추가한다.
      속성/무기/등급을 출처에서 확인하지 못하면 null로 둔다. 한국어 공식 명칭이 불확실하면 aliases에 후보를 넣는다.
      topics(stats/skills/chain)는 encore-db(api.encore.moe/ko/character/<id>)의 한국어 인게임 문구를 1~3문장으로 요약하고
      핵심 수치(쿨타임·에너지·Lv.10 배율 등)만 values에 넣는다. 툴팁 전문을 옮기지 않는다. 체인 효과의 "딜 증가율" 같은 계산값은 넣지 않는다(analysis 영역).
  - id: wuthering-waves-weapons
    collection: weapons
    sources: [kuro-official, encore-db]
    frequency: patch
    instructions: >-
      신규 5성 무기(전용 무기)를 추가한다. stats 토픽에 Lv.90 기본 공격력·서브 스탯, passive 토픽에 패시브 요약과 재련 1~5 수치.
      획득 경로·픽업 기간은 history(release)에 공식 픽업 공지를 근거로.
  - id: wuthering-waves-events
    collection: events
    sources: [kuro-official]
    frequency: 1d
    instructions: >-
      공식 버전 안내·픽업 공지의 이벤트와 픽업(banner) 기간을 events 레코드로 추가한다. 한국어 공지의 시각은 KST(+09:00),
      영어 공지의 "server time"은 아시아 서버 UTC+8(+08:00)로 쓰고 endNote에 원문 표기를 남긴다. 주요 보상은 rewards에 짧게.
  - id: wuthering-waves-codes
    collection: codes
    sources: [kuro-official, official-x-kr, game8]
    frequency: 1d
    instructions: >-
      리딤 코드를 codes 레코드로 추가한다(id = 코드 소문자). 공식 출처가 없고 공략 사이트만 있으면 certainty: reported.
      만료된 코드는 삭제하지 않는다(end 날짜로 자동으로 "지난 코드"가 된다). 방송 코드는 해당 버전을 version에.
  - id: wuthering-waves-analysis
    collection: analysis
    sources: [kuro-official, encore-db, prydwen, game8]
    frequency: patch
    instructions: >-
      공식 수치로 계산하거나 통계를 낸 결과만 analysis 레코드로 쓴다. method(계산 방법)와 assumptions(조건)는 필수이며,
      results는 "이 조건에서 약 …" 같은 조건부 문장으로 쓴다. 출처 없는 딜 수치를 옮기지 않는다. 패치로 전제가 바뀌면 status: outdated.
  - id: wuthering-waves-community
    collection: community
    sources: [dc-wuwa, arca-wuwa, reddit, youtube, prydwen, inven-board]
    frequency: 7d
    instructions: >-
      국내(디시·아카라이브)와 해외(Reddit)·YouTube를 함께 본다. 캐릭터마다 evaluation 레코드에 verdicts(티어, 파티 순위, 전용 무기 의존도,
      파티 의존도, 돌파 가치 등)를 두고, investment 레코드에 "1돌 vs 명전" 같은 투자 결론을 둔다.
      커뮤니티 글(본문+댓글)을 직접 열어 반복해서 보이는 의견만 요약한다. AI가 평가를 만들지 않는다. 의견마다 근거 글을 sources에 남기고,
      한 커뮤니티만 봤다면 요약문에 그 커뮤니티를 밝힌다. 새 레코드보다 같은 주제 레코드 갱신을 우선하고, 여론이 바뀌면 summary를 고치고 updatedAt을 갱신한다.
