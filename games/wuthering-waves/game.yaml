# Wuthering Waves — reference game #2: news + a database module with game-specific fields.
# Schema: src/core/schema.ts (GameConfig). Docs: docs/game-configuration.md
id: wuthering-waves
name: 명조:워더링 웨이브
names: { en: Wuthering Waves }
description: 쿠로 게임즈의 오픈월드 액션 RPG. 공명자를 수집·육성해 파티를 구성한다.
genre: 수집형 액션 RPG
publisher: Kuro Games
region: 글로벌 (한국어)
locale: ko
theme:
  accent: "#3f6e8c"
  icon: /games/wuthering-waves/img/icon.webp     # 공식 홈페이지 한국어 로고
  cover: /games/wuthering-waves/img/cover.webp   # 공식 3.7 업데이트 키비주얼 (news/detail/5476)

# Tabs, in reading order. Layers come from module types (docs/information-layers.md):
#   official = version, database, schedule, codes, news · analysis = analysis · community = community
modules:
  - type: version
    id: versions
    label: 버전
    collection: versions
  - type: database
    id: resonators
    label: 공명자
    itemLabel: 공명자
    collection: resonators
    fields:
      - key: rarity
        label: 등급
        filter: true
        values: { "5": "★5", "4": "★4" }
      - key: element
        label: 속성
        filter: true
        values: { glacio: 응결, fusion: 용융, electro: 전도, aero: 기류, spectro: 회절, havoc: 인멸 }
      - key: weapon
        label: 무기
        filter: true
        values: { broadblade: 대검, sword: 직검, pistols: 권총, gauntlets: 권갑, rectifier: 증폭기 }
      - key: version
        label: 출시 버전
    # Official sub-items on the resonator page. Keep each topic a short digest, not the full tooltip.
    sections:
      - { key: stats, label: 기본 능력치 }
      - { key: skills, label: 스킬 }
      - { key: chain, label: 공명 체인 }
    glance: [캐릭터 티어, 파티 순위, 역할, 전용 무기 의존도, "analysis:breakpoint=1돌 / 명전", 조작 난이도]
  - type: database
    id: weapons
    label: 무기
    itemLabel: 무기
    collection: weapons
    fields:
      - key: rarity
        label: 등급
        filter: true
        values: { "5": "★5", "4": "★4", "3": "★3" }
      - key: type
        label: 종류
        filter: true
        values: { broadblade: 대검, sword: 직검, pistols: 권총, gauntlets: 권갑, rectifier: 증폭기 }
      - key: version
        label: 출시 버전
    sections:
      - { key: stats, label: 기본 능력치 }
      - { key: passive, label: 패시브 · 재련 }
    imageFit: contain
    glance: [전용 무기 의존도, "analysis:breakpoint=1돌 / 명전"]
  - type: schedule
    id: events
    label: 이벤트·픽업
    collection: events
  - type: codes
    id: codes
    label: 리딤 코드
    collection: codes
  - type: news
    label: 뉴스·공지
    collection: news
  - type: analysis
    id: analysis
    label: 계산·통계
    collection: analysis
  - type: community
    id: community
    label: 커뮤니티
    collection: community

