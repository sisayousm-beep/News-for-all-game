id: version-3-7-announcement
title: 3.7 버전 「거울에 잠긴 허상, 마음이 비추는 인간 세상」 9월 30일 업데이트
category: announcement
publishedAt: 2026-09-19
summary: >-
  3.7 버전이 9월 30일 업데이트된다(점검 9월 30일 05:00~12:00, 한국 시간). 신규 지역 「몽추천라」가 개방되고,
  신규 5성 전도 공명자 여우의 별자리(전반부)와 쇄명(후반부)이 픽업으로 등장한다.
  전반부에는 치사·유노, 후반부에는 린네·루실라가 복각되는 것으로 보도됐다.
tags: ["3.7", 여우의 별자리, 쇄명, 몽추천라]
