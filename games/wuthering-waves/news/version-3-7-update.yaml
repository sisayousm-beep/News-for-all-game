title: 「거울에 잠긴 허상, 마음이 비추는 인간 세상」 3.7 버전 업데이트 내용 안내
category: update
publishedAt: 2026-09-30
summary: >-
  9월 30일 3.7 버전 업데이트. 신규 5성 여우의 별자리(전도·증폭기)·쇄명(전도·직검), 신규 무기 「옥궐에 피는 꽃」·「적막한 어둠」,
  신규 지역 「몽추천라」와 조수 임무 4장 4막이 추가됐다. 미강화 에코 중첩 보관 등 편의 개선이 함께 들어갔다.
