title: 튜닝 상세정보 — 5성 확률·천장·픽업 보장 규칙
category: notice
publishedAt: 2024-05-22
summary: >-
  이벤트 튜닝 5성 확률은 기본 0.8%·종합 1.8%, 80회 천장. 캐릭터는 50% 픽업이고 실패하면 다음 5성은 픽업 확정,
  무기는 5성이 항상 픽업. 천장 횟수는 같은 종류 튜닝끼리 이어진다.
tags: [튜닝, 확률, 천장]
