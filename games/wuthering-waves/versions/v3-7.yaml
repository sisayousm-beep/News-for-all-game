id: v3-7
title: 「거울에 잠긴 허상, 마음이 비추는 인간 세상」
aliases: ["Prism's Illusion, Heart's Illumination"]
version: "3.7"
start: 2026-09-30T05:00:00+09:00
end: null
summary: >-
  2026년 9월 30일 업데이트(점검 05:00~12:00). 신규 5성 공명자 여우의 별자리(전반부)·쇄명(후반부), 신규 지역 「몽추천라」,
  조수 임무 제4장 제4막과 새 임무 유형 「기담 임무」가 추가됐다. 버전 기간은 11월 12일 점검 전까지(영문 공지 기준).
highlights:
  - "신규 5성 공명자: 여우의 별자리(전도·증폭기, 전반부), 쇄명(전도·직검, 후반부)"
  - "신규 5성 무기: 옥궐에 피는 꽃(증폭기), 적막한 어둠(직검)"
  - "신규 지역: 「몽추천라」 · 신규 에코 5종 + COST 4 1종 · 신규 화음 3종"
  - "신규 스토리: 조수 임무 제4장 · 제4막 「몽주의 궤적, 마음이 그리는 대로」, 기담 임무 「달빛에 빌어보는 선정의 그리움」"
  - "편의: 미강화 에코 중첩 보관(슬롯당 999), 파티 관리, 3D 파티 편성, 촬영 모드 개선, 일부 조수 임무 다시 보기"
  - "점검 보상 별의 소리 ×300·결정 용제 ×2, 문제 수정 보상 별의 소리 ×300"
