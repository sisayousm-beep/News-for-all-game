title: 「신기루 속 등불 그림자, 속세에 깃든 검의 결심」
version: "3.6"
start: 2026-08-20T05:00:00+09:00
end: 2026-09-30T05:00:00+09:00
summary: >-
  2026년 8월 20일 업데이트(점검 05:00~12:00). 신규 5성 공명자 청초·경연과 신규 지역 「현원경」,
  조수 임무 제4장 제3막이 추가됐다. 3.7 업데이트 점검(9월 30일 05:00)까지 진행된다.
highlights:
  - "신규 5성 공명자: 청초(기류·직검), 경연(용융·대검)"
  - "신규 5성 무기: 옥빛 구름(직검), 수많은 인도(대검)"
  - "신규 지역: 「현원경」 · 신규 에코: 「하늘의 기관 인형 · 겁살」"
  - "신규 스토리: 조수 임무 제4장 · 제3막 「연운이 아득하니 심검이 우네」"
  - "신규 도전: 「홀로그램 전략 · 연무」 「만와뢰 · 잔해」"
  - "점검 보상 별의 소리 ×300·결정 용제 ×2, 문제 수정 보상 별의 소리 ×300 (다음 버전 점검 전까지 수령)"
