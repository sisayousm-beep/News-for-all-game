id: cheongcho-feel
title: 청초 — 조작감과 실전 사용감
kind: feel
version: "3.6"
consensus: moderate
summary: >-
  조작이 쉽고 보스전 사이클이 간편하다는 평가가 많고, 선인 모드의 이동도 편하다는 반응이 있다.
  반면 다수전은 불편하다는 의견과, 같은 사이클인데 해방 피해가 들쑥날쑥하다는 질문이 보인다. 디시인사이드 명조 갤러리 기준이다.
positive:
  - 보스전 사이클이 간편하고 조작이 쉽다는 평가가 반복된다("꾹 누르고 살면 된다", "사이클은 역대급으로 간편").
  - 공격을 피하기보다 벗어나 버리는 움직임과 중간중간 무적 구간 덕분에 생존이 편하다는 의견이 있다.
  - 선인 모드에서 카메라 거리가 넓어지고 어검으로 짧은 거리를 빠르게 이동해 필드 이동이 편하다는 반응이 있다.
negative:
  - 군락·다수전은 보스전보다 불편하다는 의견이 있다.
  - 필드 전투에서 다른 캐릭터로 교대하면 강화 효과가 바로 사라지고, 강공격 준비에 시간이 걸린다는 지적이 있다.
  - 같은 조건인데도 공명 해방 피해가 들쑥날쑥하다는 질문이 있었고, 댓글에서도 원인은 결론 나지 않았다.
subjects: [resonators/cheongcho, resonators/cheongcho#forte]
