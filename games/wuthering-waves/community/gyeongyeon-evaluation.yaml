id: gyeongyeon-evaluation
title: "경연 — 커뮤니티 종합 평가"
kind: evaluation
version: "3.6"
consensus: moderate
verdicts:
  - { label: "캐릭터 티어", value: "T0 (역경의 탑) · 다수전 T1" }
  - { label: "파티 순위", value: "보스전 최상위 — 양양·현령·청초와 같은 급" }
  - { label: "전용 무기 의존도", value: "매우 높음 — 게임 내 최상위급" }
  - { label: "조작 난이도", value: "보통 — 궁극기 직후 강공격 순서 고정, 퀵스왑 어려움" }
  - { label: "파티 의존도", value: "낮음 — 레베카·모르테피 무과금 파티 가능" }
  - { label: "돌파 가치", value: "높음 — 2돌·6돌" }
  - { label: "육성 난이도", value: "높음 — HP 5만 세팅 필요" }
summary: "보스전 최상위 딜러이자 파티 구성이 쉬운 편이지만, 전용 무기 의존도가 게임 내 최상위급이라는 평가가 지배적이다."
positive:
  - "최신 딜러 중 가장 접근성 좋은 편 — 전용 무기만 있으면 강하다."
  - "광역 분산 딜로 다수 웨이브에도 무난하다."
negative:
  - "전용 무기 없으면 딜 손실이 매우 크다 — \"필수\" 의견 다수."
  - "스킬 추적이 나빠 다수전(폐허)에서 약하다."
  - "HP 계수라 에코 세팅·육성이 까다롭다."
