  parts:
    - { label: "1장 1~6막 (금주)", value: 2.66 }
flow: "기억을 잃은 방랑자가 금주에서 깨어나 양양과 금주 사람들을 만나고, 비명 재해와 잔성회의 위협에 맞서는 1장 1~6막."
