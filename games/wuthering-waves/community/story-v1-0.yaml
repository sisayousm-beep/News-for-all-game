summary: "역대 스토리 중 최저점(2.66)이다. 설정 설명이 부족하고 등장인물 소개가 매끄럽지 않아 \"첫인상이 나쁘다\"는 평가가 국내외 공통이다."
regions:
  - region: domestic
    summary: "채널 설문 최저점. 연무처럼 소개 없이 동료처럼 등장하는 인물 등 구성 문제가 자주 지적된다."
    negative:
