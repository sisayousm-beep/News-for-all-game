kind: evaluation
version: "3.6"
consensus: strong
verdicts:
  - { label: "캐릭터 티어", value: "T0 (역경의 탑·다수전 모두)" }
  - { label: "파티 순위", value: "최상위 — 루실라·수수 조합이 현 최강권" }
  - { label: "전용 무기 의존도", value: "중간 — 약 18~20% 차이" }
  - { label: "조작 난이도", value: "보통 — 저가 파티는 로테이션 설계 필요" }
  - { label: "파티 의존도", value: "중간 — 루실라·치사·수수 중 조합, 저가 파티도 가능" }
  - { label: "돌파 가치", value: "2~3돌이 멈춤 지점" }
  - { label: "국내 성능 만족도", value: "9.39/10 (3.3 채널 설문)" }
summary: "보스전·다수전 모두 최상위인 올라운더 딜러로 평가된다. 국내 재미 점수도 역대 최고 수준이다."
positive:
  - "광역 딜과 몰이로 다수전에 강하고, 로테이션을 짧게도 길게도 운용할 수 있다."
  - "긴 모션 중 무적·시간 정지가 많아 안전하다."
  - "국내 재미 점수 4.77/5로 역대 최고."
negative:
  - "저가 파티에서는 로테이션을 더 신경 써야 한다."
  - "전용 무기는 필수는 아니지만 메인 딜러 중 가장 좋은 업그레이드라는 의견."
