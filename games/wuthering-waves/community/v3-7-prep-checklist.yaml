id: v3-7-prep-checklist
title: 3.7 직전 체크리스트 — 주간 보스는 아껴라
kind: tip
scope: ingame
happenedAt: 2026-09-26
version: "3.6"
background: "버전 마지막 주(9/26~9/29)에 무엇을 하고 무엇을 미룰지에 대한 채널 공지."
consensus: moderate
summary: "매트릭스·폐허는 이번 주 안에 끝내고, 주간 보스·주간 합성은 3.7 신캐 스킬 재료용으로 다음 주로 미루라는 팁이 많은 공감을 받았다."
tips:
  - { text: "매트릭스·폐허 보상은 이번 주에 받기", when: 3.7 업데이트 전 }
  - { text: "다음 주 주간 보스·주간 합성 10회는 3.7 신규 공명자(여우의 별자리) 스킬 재료용으로 남겨두기", when: 3.7 업데이트 직후 }
  - { text: "군성 공진 이벤트 — 얕은 꿈은 혼자, 깊은 꿈은 멀티로. 한 번 깨두면 이후 보상은 수령만 하면 된다" }
  - { text: "캐릭터 체험을 돌려 별의 소리 60 받기" }
divided:
  - position: 그래도 지금 돌아야 한다
    reasons:
      - 튜너 파밍 때문에 주간 콘텐츠를 미룰 수 없다
      - 3.x에서 보라 상자를 많이 풀어 재료를 아낄 필요가 적다
