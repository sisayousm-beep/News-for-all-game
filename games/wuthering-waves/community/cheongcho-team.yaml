id: cheongcho-team
title: 청초 — 파티 조합과 모니에 의존도
kind: team
version: "3.6"
consensus: strong
verdicts:
  - { label: 최적 조합, value: "청초 · 데니아 · 모니에" }
  - { label: 대체 조합, value: "청초 · 린네 · 모니에/샤콘/파수인" }
  - { label: 모니에 1돌, value: "선택 — 청데모에선 체감 크지만 필수는 아님" }
summary: 청초·데니아·모니에가 정답 조합이라는 데 이견이 거의 없다. 데니아가 없으면 린네 조합이 대안이지만 일부 콘텐츠에서 약해진다.
positive:
  - 데니아+모니에 조합은 출시 시점 최적이고 앞으로도 유지될 조합으로 평가된다.
  - 린네 조합은 모니에 대신 샤콘·파수인을 써도 손실이 적다.
negative:
  - 데니아를 쓰면서 모니에가 빠지면 파티 딜이 크게 떨어져 대안이 없다.
  - 린네는 적을 흩어 놓아 다수 웨이브 콘텐츠에서 청초와 궁합이 나쁘다는 지적.
  - 청초와 루크가 같은 파츠를 써서 둘 중 하나만 최적 파티를 가질 수 있다.
divided:
  - position: 모니에 1돌 체감이 크다
    reasons:
      - 명함 모니에 버프는 8초라 조화도 파괴 타이밍을 맞춰야 하지만 1돌은 20초로 여유가 생긴다
  - position: 명함 모니에로 충분하다
    reasons:
      - 321 순서로 돌리면 사이클에 문제가 없고, 청데모에선 모니에 1돌보다 청초 1돌 딜 상승이 크다는 댓글
tips:
  - text: 모니에가 명함이면 조화도 파괴는 청초의 극딜 차례에 맞춰 터뜨린다.
    when: 모니에 명함
