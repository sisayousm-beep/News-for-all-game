summary: "라하이 로이 최종장(4.89)과 데니아 에필로그(4.71) 모두 최상위권이다. \"지금까지 최고의 아크\"라는 평이 많고, 아쉬움은 미스터리가 쉽게 풀렸다는 정도다."
