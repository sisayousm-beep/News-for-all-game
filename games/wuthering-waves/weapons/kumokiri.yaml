    text: "공격력이 12~24% 증가된다. 변주 스킬 발동 혹은 「이상 효과」 추가 시, 자신의 공명 해방 피해 보너스가 8~16% 증가되고 최대 3스택까지 중첩이 가능하며 15초간 지속된다. 해당 효과가 스택 최대치까지 중첩될 경우, 파티 내 캐릭터가 「이상 효과」 추가 시 해당 캐릭터의 전체 속성 피해 보너스가 24~48% 증가되고, 15초간 지속된다. 같은 이름의 효과는 중첩이 불가하다"
