    text: "공격력이 12~24% 증가된다. 변주 스킬 혹은 공명 스킬 발동 시, 강공격 피해가 20~40% 증가되고 15초간 지속된다. 자신이 실드를 획득할 시 강공격 피해는 목표의 7.2~12% 방어력을 무시한다. 해당 효과는 0.5초마다 1회만 적용하며, 최대 5스택 중첩이 가능하고 7초간 지속된다"
