    name: "패시브 「굳건한 의지」 (재련 1~5)"
    text: "공격력이 12~24% 증가된다. 변주 스킬 혹은 일반 공격 발동 후 10초 내에, 에코 어빌리티 발동 시 「파죽(破竹)」 효과를 1스택 획득하고, 강공격 피해 보너스가 30~60% 증가된다. 같은 이름의 에코는 1회만 적용되고, 최대 2스택 중첩이 가능하며, 12초간 지속된다. 2스택까지 중첩 후 에코 어빌리티를 발동하면 지속 시간이 리셋되지 않는다. 해당 효과는 10초 내에 최대 1회 적용 가능하고, 다른 캐릭터로 전환하면 즉시 종료된다."
