id: whispers-of-sirens
title: "바다의 속삭임"
aliases: ["Whispers of Sirens"]
summary: "5성 증폭기. 2.2 버전 튜닝 공지에서 처음 확인된다(한국어 공지 목록 기준)."
attributes:
  rarity: 5
  type: rectifier
  version: "2.2"
topics:
  - id: stats
    section: stats
    name: Lv.90 능력치
    values: { 공격력: "500", 크리티컬 피해: "72%" }
  - id: passive
    section: passive
    name: "패시브 「바닷속에서」 (재련 1~5)"
    text: "공격력이 12~24% 증가된다. 변주 스킬 혹은 일반 공격 발동 후 10초 내에, 에코 어빌리티 발동 시, 「부드러운 꿈」 1스택을 획득한다. 같은 이름의 에코는 1회만 발동이 가능하고, 최대 2스택 중첩이 가능하며, 10초간 지속된다. 2스택까지 중첩 후, 에코 어빌리티를 발동할 경우, 지속시간이 리셋되지 않는다. 해당 효과는 10초 내에 최대 1회 발생할 수 있으며, 다른 캐릭터로 전환하면 효과가 즉시 종료된다. 1스택: 일반 공격 피해 보너스가 40~80% 증가된다."
