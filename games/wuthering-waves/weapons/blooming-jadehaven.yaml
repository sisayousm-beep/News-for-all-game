    text: "전체 속성 피해 보너스가 12~24% 증가된다. 전자 효과 추가 후 혹은 합일 대응 시, 공명 스킬 피해가 36~72% 부스트되고, 공명 스킬 피해는 목표의 10~24% 전도 피해 저항을 무시하며, 자신이 파티 내 등장 캐릭터일 경우, 일정 범위 내의 목표가 받는 전자 효과 피해가 30~60% 부스트되고, 30초간 지속되며, 0.1초마다 1회 발생할 수 있다. 같은 이름의 효과는 더 높은 수치의 효과가 적용된다"
