    name: "패시브 「뇌우 감옥」 (재련 1~5)"
    text: "공격력이 12~24% 증가된다. 합일 획득 시 전도 피해가 30~60% 증가되고, 30초간 지속된다. 합일 획득 시, 파티 내 캐릭터는 「못다 한 그리움」 효과를 획득하고 「애틋한 그리움」이 제거되며, 전도 피해 보너스가 24~48% 증가되고, 30초간 지속된다. 같은 이름의 효과는 중첩이 불가하다. 자신의 협주 에너지가 소모될 시, 「애틋한 그리움」 효과를 획득하고 파티 내 캐릭터의 「못다 한 그리움」이 제거되며, 자신의 전도 피해가 추가로 40~80% 증가되고, 14초간 지속된다."
