    name: 패시브 (재련 1~5)
    text: >-
      공격력 증가. 「조화 밀집 · 이탈」을 부여하면 기류 피해 보너스가 2초간 증가하며 최대 5스택(0.5초에 1회).
      5스택에 도달하면 지속 시간이 30초로 늘고, 그동안 기류 피해가 적의 방어력 일부를 무시한다.
