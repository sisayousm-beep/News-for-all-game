    text: "공격력이 12~24% 증가된다. 일반 공격 피해를 입힐 시, 자신의 일반 공격 피해 보너스가 10~20% 증가되고, 14초간 지속되며, 1초마다 1회 발생할 수 있고, 최대 3스택 중첩이 가능하다. 자신의 협주 에너지 소모 시, 자신의 일반 공격 피해 보너스가 40~80% 증가되며, 10초간 지속된다. 1초마다 1회 발생할 수 있다. 다른 캐릭터로 전환하면 효과가 즉시 종료된다"
