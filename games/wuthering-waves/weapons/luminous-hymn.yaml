    name: "패시브 「단결자의 찬가」 (재련 1~5)"
    text: "공격력이 12~24% 증가된다. 「광학 효과」가 있는 목표에게 피해를 입힐 시, 자신의 일반 공격, 강공격 피해 보너스가 14~28% 증가되고, 최대 3스택 중첩이 가능하며, 6초간 지속된다. 반주 스킬 발동 시, 파티 내 등장 캐릭터 주변의 목표에게 주는 「광학 효과」 피해가 30~60% 부스트되고, 30초간 지속된다. 같은 이름의 효과는 중첩이 불가하다"
