    text: "공격력이 12~24% 증가한다. 피해를 입힐 시 「빛나는 깃털」 1스택을 획득하며, 0.5초마다 1스택을 획득할 수 있다. 공명 스킬을 발동 시 추가로 5스택을 획득한다. 스택당 「빛나는 깃털」은 공명 스킬 피해 보너스를 4~8% 증가시키고, 최대 14스택까지 중첩이 가능하다. 「빛나는 깃털」이 14스택에 도달한 12초 후, 모든 스택이 리셋된다"
