id: v3-7-astrite-total
title: 3.7 버전 별의 소리 총량 — 이벤트·신규 지역·반복 콘텐츠 포함
kind: currency
version: "3.7"
answer: 무과금 한정 약 76뽑
results:
  - "3.7(9월 30일~11월 12일, 43일) 동안 공식 공지로 수량이 확인되는 것만 더해도 무과금 약 9,820 별의 소리 + 금빛 파도의 무늬 15장, 한정 뽑기로 약 76회다."
  - "이벤트가 3,680으로 가장 크고(신규 지역 몽추천라 관련 이벤트 1,080 포함), 일일 활동 2,580, 역경의 탑·폐허 1,600, 수많은 문의 환상 960, 점검 보상 600, 매트릭스 400 순이다."
  - "월정액(약 3,870)과 패스(680)를 더하면 약 14,370 + 무늬 15장, 한정 뽑기 약 105회."
  - "3.6(약 66뽑)보다 많다. 몽추천라 보물상자·탐사도 보상과 메인 퀘스트 보상은 공지에 수량이 없어 빠져 있어, 실제로는 더 많다."
