    - [꿈속에서 메아리가 울린다면 (멀티 전투 이벤트), 600, 공식 3.6 콘텐츠 안내]
    - [세컨드 솔라리스 · 사라진 그림자의 행방, 400, 공식 3.6 콘텐츠 안내]
