method: "Game Hub 자체 계산. 공식 3.6 콘텐츠 안내 이미지(이벤트별 보상)와 업데이트 안내(점검·문제 수정 보상), 리딤 코드 레코드의 수량을 더하고, 반복 콘텐츠는 Game8의 주기당 보상에 3.6 기간(2026-08-20~09-30, 41일)을 곱했다."
assumptions:
  - 모든 이벤트를 100% 완료, 일일 활동 매일 완료
  - 역경의 탑·폐허는 주기당 합계 800, 버전당 2주기로 가정
  - 수많은 문의 환상 주간 보상 6회(주간 초기화 6번)
  - 메인 퀘스트(4장 3막·간주), 업적, 데이터 뱅크, 상시 탐사 보상은 수량 미확인으로 제외
