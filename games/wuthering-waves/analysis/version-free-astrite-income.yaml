id: version-free-astrite-income
title: 3.6 버전 별의 소리 총량 — 이벤트·반복 콘텐츠·보상 포함
kind: currency
version: "3.6"
answer: 무과금 한정 약 66뽑
results:
  - "3.6(41일) 동안 공식 공지로 수량이 확인되는 것만 더해도 무과금 약 9,720 별의 소리 + 빛나는 조수 5장, 한정 뽑기로 약 66회다."
  - "이벤트가 3,400으로 가장 크고, 일일 활동 2,460, 역경의 탑·폐허 1,600, 수많은 문의 환상 960, 점검 보상·방송 코드 900, 매트릭스 400 순이다."
  - "월정액(약 3,690)과 패스(680)를 더하면 약 14,090 + 조수 5장, 한정 뽑기 약 93회."
  - "메인 퀘스트·업적·상시 탐사처럼 공지에 수량이 없는 보상은 빠져 있어 실제 획득량은 이보다 많다. 3.6은 신규 지역이 없었다."
