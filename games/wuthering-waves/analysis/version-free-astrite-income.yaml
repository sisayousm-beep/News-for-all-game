    - ["역경의 탑·폐허 800 × 2주기", 1600, Game8 + 가정]
    - [수많은 문의 환상 160 × 6주, 960, Game8 + 계산]
    - [매트릭스, 400, Game8]
    - [무과금 합계, 9720, "≈ 60.8뽑 + 빛나는 조수 5 (연운의 선물 출석)"]
