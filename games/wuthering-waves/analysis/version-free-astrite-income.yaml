method: "Game Hub 자체 계산. Game8의 획득처별 보상(일일 60, 수많은 문의 환상 주 160, 매트릭스 버전당 400, 월정액 일 90, 패스 680)에 버전 길이 42일(6주)을 곱해 합산. 버전 전체 뽑기 수는 아카라이브 명조 채널 정리 글의 수치를 옮김."
assumptions:
  - 버전 길이 42일(3.6은 8월 20일~9월 30일, 41일)
  - 일일 활동 100pt를 매일 채움, 수많은 문의 환상 매주 완료, 매트릭스 보상 전부 획득
  - 월정액은 버전 내내 유지(30일 단위 구매)
  - 이벤트·탐사·스토리 보상은 버전마다 달라 확정 합계에서 제외
