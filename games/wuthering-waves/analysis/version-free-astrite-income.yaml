id: version-free-astrite-income
title: 버전 하나(약 6주) 동안 모이는 별의 소리 — 반복 콘텐츠 기준
kind: currency
version: "3.6"
answer: 반복 콘텐츠만 약 24뽑
results:
  - "이 조건에서 일일 활동·수많은 문의 환상·매트릭스만으로 버전당 약 3,880 별의 소리(약 24뽑)가 확정으로 들어온다. 월정액을 더하면 약 7,660(약 48뽑)."
  - "이벤트·스토리·탐사·방송 코드·점검 보상까지 합친 버전 전체는 월정액·패스 기준 최소 120뽑 이상(보통 150뽑 안팎)이라는 계산이 채널에서 쓰인다."
  - "1.2 / 2.5 / 3.7 패키지를 모두 사면 버전당 약 80뽑이 추가된다(채널 정리)."
chart:
