method: >-
  Prydwen 계산(3.6, 1타겟, 레베카·모니에 버프 포함)의 돌파별 딜 비율과 무기별 딜 비율(스펙트럴 트리거 100%, 얽혀진 빛과 그림자 88.4%, 태양 불꽃 74.4%)을
  곱해 조합별 딜을 추정했다(Game Hub 계산). 평균 뽑기는 공식 확률 기준 기대값(analysis/convene-expected-pulls).
assumptions:
  - "레베카·모니에 파티, 1타겟, Prydwen 표준 로테이션·에코 세팅"
  - 돌파 효과와 무기 효과를 서로 독립으로 보고 곱한 근사치
  - 대체 무기는 재련 1, 4성은 재련 5 기준
