answer: 명전 추천
results:
  - "상시 무기(격동의 조력)를 낀 1돌이 명전의 약 100%로 비슷하다. 평균 뽑기가 명전(약 139회)이 1돌(약 167회)보다 적어 명전이 낫다."
  - "전용 무기(불빛의 심판)는 대체 5성 대비 +7%, 1돌은 명함 대비 +21.7%."
  - "돌파 중 상승 폭이 가장 큰 단계는 6돌(직전 대비 +22%)."
