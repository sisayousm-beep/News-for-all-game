id: lucilla-s1-vs-signature
title: "루실라 1돌 vs 명전(명함+전용 무기) — 뭐가 더 좋나"
kind: breakpoint
version: "3.6"
results:
  - "개인 딜 기준으로 보유 무기에 따라 다르다. 잊혀진 피안의 슬픈 악장이(가) 있으면 1돌(105%)이 명전보다 조금 높고, 4성 무기면 73%로 명전이 낫다."
  - "전용 무기(프리즈 프레임)는 대체 5성 대비 +1%, 1돌은 명함 대비 +6.1%."
  - "돌파 중 상승 폭이 가장 큰 단계는 6돌(직전 대비 +47%)."
