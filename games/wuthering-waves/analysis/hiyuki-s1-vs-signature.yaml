id: hiyuki-s1-vs-signature
title: "히유키 1돌 vs 명전(명함+전용 무기) — 뭐가 더 좋나"
kind: breakpoint
version: "3.6"
results:
  - "명전이 더 좋다. 전용 무기 없는 1돌은 명전 딜의 약 89~94%이고, 평균 뽑기도 명전(약 139회)이 1돌(약 167회)보다 적다."
  - "전용 무기(서린 불꽃)는 대체 5성 대비 +20%, 1돌은 명함 대비 +13.5%."
  - "돌파 중 상승 폭이 가장 큰 단계는 3돌(직전 대비 +32%)."
