id: v3-7-spending-event-min-cost
title: 3.7 누적 충전 이벤트 — 구간별 최소 결제 금액
kind: event
version: "3.7"
answer: 980 구간 약 17.9만 원
results:
  - "정가 기준으로 980 토큰(공명자 선택 보상 구간)은 약 17.9만 원, 1600은 약 29.3만 원, 2200(전 보상)은 약 40.4만 원이 최소 결제 금액이다."
  - "구글 플레이 25% 할인과 충전 이벤트를 겹치면 2200 토큰을 약 32만 원(약 20% 할인)에 맞출 수 있다는 계산도 있다."
  - "최소 금액 조합은 월정액·한정 패키지(1만 2천 원)를 먼저 채우고 나머지를 6,480 상품으로 메우는 방식이다."
chart:
  title: 구간별 최소 결제 금액 (정가)
  unit: 만원
  points:
    - { label: 980 토큰, value: 17.88 }
    - { label: 1600 토큰, value: 29.31 }
    - { label: 2200 토큰, value: 40.36 }
table:
  columns: [목표 토큰, 최소 금액, 조합]
  rows:
    - [980, "178,800원", "월정액 2 + 1만 2천 원 패키지 4 + 6,480 상품 1"]
    - [1600, "293,100원", "월정액 1 + 1만 2천 원 패키지 4 + 60 상품 1 + 6,480 상품 2"]
    - [2200, "403,600원", "월정액 1 + 1만 2천 원 패키지 3 + 4,700원 패키지 1 + 6,480 상품 3"]
  note: 할인 미적용 정가. 1만 2천 원 패키지는 버전 한정 상품(심월 보물집 등).
method: "아카라이브 명조 채널 유저가 누적 충전 대상 상품(가격·토큰·구매 제한)을 넣고 한정 상품은 0-1 배낭 문제, 무제한 충전은 무한 배낭 문제(DP)로 푼 결과를 옮김. 할인 적용 금액은 별도 글의 계산."
assumptions:
  - 2026년 9월 20일 글 작성 시점의 3.7 누적 충전 대상 상품 목록·가격
  - 할인(구글 플레이·갤럭시 스토어 쿠폰) 미적용 정가
  - 목표는 토큰 달성 최소 금액이며, 별의 소리 효율 최대화와는 다르다
