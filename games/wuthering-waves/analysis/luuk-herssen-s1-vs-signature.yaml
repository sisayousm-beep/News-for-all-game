kind: breakpoint
version: "3.6"
results:
  - "명전이 더 좋지만 차이는 작다. 상시 5성 격동의 조력을 낀 1돌이 명전의 약 97%라, 전무 없이 상시 무기로도 충분하다."
  - "전용 무기(한낮의 의지)는 대체 5성 대비 +17%, 1돌은 명함 대비 +13.5%."
  - "돌파 중 상승 폭이 가장 큰 단계는 6돌(직전 대비 +43%)."
