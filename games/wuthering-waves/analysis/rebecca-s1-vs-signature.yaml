results:
  - "개인 딜 기준 명전이 약간 낫지만 차이는 작다(대체 5성이면 1돌이 약 95%). 레베카는 무료 캐릭터라 돌파는 이벤트·산호로 얻는 경우가 많다."
  - "전용 무기(스컬 스래셔)는 대체 5성 대비 +8%, 1돌은 명함 대비 +2.0%."
  - "돌파 중 상승 폭이 가장 큰 단계는 6돌(직전 대비 +26%)."
