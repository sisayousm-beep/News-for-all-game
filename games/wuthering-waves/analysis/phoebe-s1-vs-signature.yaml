answer: 명전 추천
results:
  - "다른 한정 무기(잊혀진 피안의 슬픈 악장)가 있으면 1돌(103%)이 더 세지만, 상시·4성 무기로는 약 95~95%라 명전이 낫다."
  - "전용 무기(광휘의 찬송가)는 대체 5성 대비 +7%, 1돌은 명함 대비 +10.6%."
  - "돌파 중 상승 폭이 가장 큰 단계는 3돌(직전 대비 +25%)."
