results:
  - "개인 딜 기준, 다른 한정 무기(바다의 속삭임)가 있으면 1돌(102%)이 더 세지만, 상시·4성 무기로는 약 86~90%라 명전이 낫다."
  - "전용 무기(옥수 비단)는 대체 5성 대비 +4%, 1돌은 명함 대비 +6.6%."
  - "돌파 중 상승 폭이 가장 큰 단계는 6돌(직전 대비 +23%)."
