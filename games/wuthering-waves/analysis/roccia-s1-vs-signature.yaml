results:
  - "개인 딜 기준, 전용 무기 없는 1돌은 명전 딜의 약 71~87%이고, 평균 뽑기도 명전(약 139회)이 1돌(약 167회)보다 적다."
  - "전용 무기(희비극)는 대체 5성 대비 +11%, 1돌은 명함 대비 +-2.8%."
  - "돌파 중 상승 폭이 가장 큰 단계는 3돌(직전 대비 +19%)."
