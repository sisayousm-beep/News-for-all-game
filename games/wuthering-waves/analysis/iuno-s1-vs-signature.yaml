method: >-
  Prydwen 계산(1타겟, 린네·샤콘 버프 포함)의 돌파별 딜 비율과 무기별 딜 비율(세상 만물의 진리 100%, 팔방의 천추 84.1%, 거침없는 비상 69.4%)을
  곱해 조합별 딜을 추정했다(Game Hub 계산). 평균 뽑기는 공식 확률 기준 기대값(analysis/convene-expected-pulls).
assumptions:
  - "린네·샤콘 파티, 1타겟, Prydwen 표준 로테이션·에코 세팅"
  - 돌파 효과와 무기 효과를 서로 독립으로 보고 곱한 근사치
  - 대체 무기는 재련 1, 4성은 재련 5 기준
