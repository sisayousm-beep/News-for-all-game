id: convene-expected-pulls
title: 목표별 평균 기대 튜닝 횟수 (픽업 캐릭터·전용 무기)
kind: gacha
version: "3.6"
method: >-
  Game Hub 자체 계산. 공식 「튜닝 상세정보」의 5성 종합 확률 1.8%를 5성 1개당 평균 튜닝 수(1 ÷ 0.018 ≈ 55.6회)로 보고,
  캐릭터는 50% 픽업·실패 시 다음 5성 확정 규칙으로 픽업 1장당 평균 5성 1.5개(≈ 83.3회), 무기는 5성이 항상 픽업이므로 1개당 55.6회로 더했다.
  최악은 천장(80회) 기준: 캐릭터 1장 160회, 무기 1개 80회.
assumptions:
  - 천장 카운트 0회, 픽업 확정 상태 아님에서 시작
  - 공식 종합 확률 1.8%를 장기 평균으로 사용 (개인 기록과 다를 수 있음)
  - 여파의 산호로 교환하는 울림 주파수 대역(돌파 재료)·중복 보상은 반영하지 않음
  - 「돌」은 픽업 캐릭터를 추가로 얻은 수 (1돌 = 2장)
results:
  - 이 조건에서 픽업 캐릭터 명함은 평균 약 83회, 최악 160회가 든다.
  - 이 조건에서 명함 + 전용 무기는 평균 약 139회, 1돌은 평균 약 167회로, 평균 기준으로는 전용 무기가 1돌보다 약 28회 적게 든다.
  - 최악 기준으로는 전용 무기 240회(명함 포함), 1돌 320회다.
table:
  columns: [목표, 평균 기대 (회), 최악 (회)]
  rows:
    - ["명함", "83", "160"]
    - ["명함 + 전용 무기", "139", "240"]
    - ["1돌", "167", "320"]
    - ["1돌 + 전용 무기", "222", "400"]
    - ["2돌", "250", "480"]
    - ["3돌 + 전용 무기", "389", "720"]
    - ["6돌(풀돌) + 전용 무기", "639", "1200"]
  note: 평균은 반올림. 1회 = 금빛 파도의 무늬(캐릭터) 또는 울린 조수의 무늬(무기) 1개.
