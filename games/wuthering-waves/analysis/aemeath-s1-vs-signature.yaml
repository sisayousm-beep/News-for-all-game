method: >-
  Prydwen 계산(3.6, 1타겟, 린네·모니에 버프 포함)의 돌파별 딜 비율과 무기별 딜 비율(영원한 샛별 100%, 천년의 회류 85.5%, 예리한 날개깃 80.8%)을
  곱해 조합별 딜을 추정했다(Game Hub 계산). 평균 뽑기는 공식 확률 기준 기대값(analysis/convene-expected-pulls).
assumptions:
  - "린네·모니에 파티, 1타겟, Prydwen 표준 로테이션·에코 세팅"
  - 돌파 효과와 무기 효과를 서로 독립으로 보고 곱한 근사치
  - 대체 무기는 재련 1, 4성은 재련 5 기준
