results:
  - "다른 한정 무기(불길)가 있으면 1돌(105%)이 더 세지만, 상시·4성 무기로는 약 83~95%라 명전이 낫다."
  - "전용 무기(쿠모키리(曇斬))는 대체 5성 대비 +13%, 1돌은 명함 대비 +18.4%."
  - "돌파 중 상승 폭이 가장 큰 단계는 2돌(직전 대비 +35%)."
