method: >-
  Prydwen 계산(1타겟, 브렌트·루파 버프 포함)의 돌파별 딜 비율과 무기별 딜 비율(솟아오르는 화염 100%, 천년의 회류 91.1%, 마음의 닻 81.4%)을
  곱해 조합별 딜을 추정했다(Game Hub 계산). 평균 뽑기는 공식 확률 기준 기대값(analysis/convene-expected-pulls).
assumptions:
  - "브렌트·루파 파티, 1타겟, Prydwen 표준 로테이션·에코 세팅"
  - 돌파 효과와 무기 효과를 서로 독립으로 보고 곱한 근사치
  - 대체 무기는 재련 1, 4성은 재련 5 기준
  - "장리 자신의 딜만 계산 — 파티원 버프 증가분은 반영되지 않음"
