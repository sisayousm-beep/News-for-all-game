results:
  - "개인 딜 기준, 상시 무기(파도의 기록)를 낀 1돌이 명전의 약 98%로 비슷하다. 평균 뽑기가 명전(약 139회)이 1돌(약 167회)보다 적어 명전이 낫다."
  - "전용 무기(바다의 속삭임)는 대체 5성 대비 +15%, 1돌은 명함 대비 +18.3%."
  - "돌파 중 상승 폭이 가장 큰 단계는 2돌(직전 대비 +32%)."
