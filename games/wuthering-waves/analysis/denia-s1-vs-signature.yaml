method: >-
  Prydwen 계산(3.6, 1타겟, 에이메스·치사 버프 포함)의 돌파별 딜 비율과 무기별 딜 비율(위조된 작은별 100%, 꼭두각시의 손 85.68%, 청음 71.12%)을
  곱해 조합별 딜을 추정했다(Game Hub 계산). 평균 뽑기는 공식 확률 기준 기대값(analysis/convene-expected-pulls).
assumptions:
  - "에이메스·치사 파티, 1타겟, Prydwen 표준 로테이션·에코 세팅"
  - 돌파 효과와 무기 효과를 서로 독립으로 보고 곱한 근사치
  - 대체 무기는 재련 1, 4성은 재련 5 기준
  - "데니아 자신의 딜만 계산 — 파티원에게 주는 버프 증가분은 반영되지 않음"
