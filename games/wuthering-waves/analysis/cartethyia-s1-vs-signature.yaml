method: >-
  Prydwen 계산(1타겟, 샤콘 버프 포함)의 돌파별 딜 비율과 무기별 딜 비율(숙명에 맞서는 관 100%, 날카로운 봄 79.5%, 예리한 날개깃 76.3%)을
