id: cartethyia-s1-vs-signature
title: "카르티시아 1돌 vs 명전(명함+전용 무기) — 뭐가 더 좋나"
kind: breakpoint
version: "3.6"
answer: 명전 추천
results:
  - "전용 무기 없는 1돌은 명전 딜의 약 87~91%이고, 평균 뽑기도 명전(약 139회)이 1돌(약 167회)보다 적다."
  - "전용 무기(숙명에 맞서는 관)는 대체 5성 대비 +26%, 1돌은 명함 대비 +14.1%."
  - "돌파 중 상승 폭이 가장 큰 단계는 2돌(직전 대비 +31%)."
