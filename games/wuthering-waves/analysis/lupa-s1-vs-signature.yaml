results:
  - "다른 한정 무기(태평성대)가 있으면 1돌(101%)이 더 세지만, 상시·4성 무기로는 약 86~93%라 명전이 낫다."
  - "전용 무기(불길)는 대체 5성 대비 +14%, 1돌은 명함 대비 +15.2%."
  - "돌파 중 상승 폭이 가장 큰 단계는 3돌(직전 대비 +28%)."
