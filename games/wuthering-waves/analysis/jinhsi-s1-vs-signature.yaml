id: jinhsi-s1-vs-signature
title: "금희 1돌 vs 명전(명함+전용 무기) — 뭐가 더 좋나"
kind: breakpoint
version: "3.6"
answer: 명전 추천
results:
  - "상시 무기(에너지 절단)를 낀 1돌이 명전의 약 100%로 비슷하다. 평균 뽑기가 명전(약 139회)이 1돌(약 167회)보다 적어 명전이 낫다."
  - "전용 무기(태평성대)는 대체 5성 대비 +14%, 1돌은 명함 대비 +16.0%."
  - "돌파 중 상승 폭이 가장 큰 단계는 6돌(직전 대비 +26%)."
