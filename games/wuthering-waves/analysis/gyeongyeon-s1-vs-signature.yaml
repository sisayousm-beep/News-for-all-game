results:
  - "명전이 더 좋다. 전용 무기 없는 1돌은 명전 딜의 약 79~91%이고, 평균 뽑기도 명전(약 139회)이 1돌(약 167회)보다 적다."
  - "전용 무기(수많은 인도)는 대체 5성 대비 +18%, 1돌은 명함 대비 +7.4%."
  - "돌파 중 상승 폭이 가장 큰 단계는 6돌(직전 대비 +60%)."
