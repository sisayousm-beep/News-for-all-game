  - "상시 무기(천년의 회류)를 낀 1돌이 명전의 약 99%로 비슷하다. 평균 뽑기가 명전(약 139회)이 1돌(약 167회)보다 적어 명전이 낫다."
  - "전용 무기(날카로운 봄)는 대체 5성 대비 +11%, 1돌은 명함 대비 +10.9%."
  - "돌파 중 상승 폭이 가장 큰 단계는 6돌(직전 대비 +29%)."
