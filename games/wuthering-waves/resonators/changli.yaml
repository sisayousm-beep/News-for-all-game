    section: chain
    name: "4체인 「언어의 미학」"
    text: "변주 스킬 발동 후, 파티 내 캐릭터 공격력이 20% 증가하며, 30초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「해탈의 성취」"
    text: "강공격 이화의 화신 배율이 50% 상승하고, 입히는 피해가 50% 증가한다"
  - id: chain-6
    section: chain
    name: "6체인 「치밀한 계획」"
    text: "공명 스킬 불멸의 깃털, 강공격 이화의 화신, 공명 해방 이화의 충성심으로 피해를 입힐 때 추가로 목표의 40% 방어력을 무시한다"
