id: jinhsi
title: 금희
aliases: ["Jinhsi"]
summary: "금주 영윤 금희, 하늘의 빛이 여러 갈래의 빛으로 퍼지며 사람들의 소망을 밝혀준다. 운명은 그녀에게 신의 방향을 제시하지만, 그녀의 발걸음은 늘 인간의 미래를 향해 나아간다"
attributes:
  rarity: 5
  element: spectro
  weapon: broadblade
  version: "1.1"
