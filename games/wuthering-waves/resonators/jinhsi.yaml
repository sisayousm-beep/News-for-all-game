    name: 스킬 트리 능력치 보너스 (노드 합계)
    values: {크리티컬: "+8%", 공격력: "+12%"}
  - id: skill
    section: skills
    name: "공명 스킬 「달빛의 석양」"
    values: {쿨타임: "3초"}
  - id: liberation
    section: skills
    name: "공명 해방 「만물의 정화」"
    values: {쿨타임: "24초", 공명 에너지: "150"}
  - id: chain-1
    section: chain
    name: "1체인 「승천하는 물결」"
    text: "금희가 일반 공격 하늘로 향해 · 일반 공격, 공명 스킬 달을 품은 용녀 발동 시, 경칩 1스택을 획득하고, 4스택 중첩이 가능하며, 6초간 지속된다. 공명 스킬 승천하는 용 발동 시, 경칩의 모든 스택을 소진하며, 1스택씩 소모할 때마다 공명 스킬 승천하는 용이 입힌 피해가 20% 증가한다"
  - id: chain-2
    section: chain
    name: "2체인 「그치는 눈송이」"
    text: "금희의 비전투 상태 지속 시간이 4초를 초과할 경우, 「봄의 빛」 50pt를 회복하며, 4초마다 1회만 적용한다"
  - id: chain-3
    section: chain
    name: "3체인 「운명적인 사도」"
    text: "금희가 변주 스킬 반룡의 빛 발동 후, 「적선」 효과를 1스택 획득하며, 스택마다 공격력이 25% 증가한다. 2스택까지 중첩이 가능하며 20초간 지속된다"
  - id: chain-4
    section: chain
    name: "4체인 「인간 세상의 수호자」"
    text: "금희가 공명 해방 만물의 정화 또는 공명 스킬 승천하는 용 발동 시, 근처에 있는 파티 내 모든 캐릭터의 전체 속성 피해 보너스가 20% 증가하며, 20초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「눈을 녹이는 햇살」"
    text: "공명 해방 만물의 정화 피해 배율이 120% 상승한다"
  - id: chain-6
    section: chain
    name: "6체인 「엄동설한 끝에 비추는 봄」"
    text: "공명 스킬 승천하는 용 피해 배율이 45% 상승되며, 「봄의 빛」 소모 시 얻는 배율 증가 효과가 추가로 45% 상승된다"
