    values: {쿨타임: "12초"}
  - id: liberation
    section: skills
    name: "공명 해방 「파천의 뇌격」"
    values: {쿨타임: "16초", 공명 에너지: "125"}
  - id: chain-1
    section: chain
    name: "1체인 「양난의 선택」"
    text: "공명 스킬 자기장의 포효와 천둥의 폭발의 피해가 70% 증가한다"
  - id: chain-2
    section: chain
    name: "2체인 「뒤얽힌 포로」"
    text: "공명 스킬 자기장의 폭발로 목표 명중 시 추가로 5pt의 「심판 게이지」및 5pt의 공명 에너지를 회복한다"
  - id: chain-3
    section: chain
    name: "3체인 「냉정한 판결」"
    text: "공명 회로 심판의 뇌전의 피해 배율이 55% 상승한다"
  - id: chain-4
    section: chain
    name: "4체인 「전진의 격려」"
    text: "공명 회로 심판의 뇌전 명중 시, 파티 내 캐릭터의 공격력이 20% 증가하며, 12초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「결의의 울림」"
    text: "공명 해방 파천의 뇌격이 공명 회로 죄악의 표식, 징벌의 인장을 가진 목표를 명중 시, 피해 100% 증가한다"
  - id: chain-6
    section: chain
    name: "6체인 「정의의 이행」"
    text: "공명 해방 파천의 뇌격을 발동 후 30초 이내, 음림의 일반 공격이 목표를 명중 시, 추가로 불길 같은 분노가 발동되며 음림 공격력 419.59%에 해당하는 전도 피해를 가한다. 매단 일반 공격 1회 발동 가능, 최대 4회 발동되며 해당 피해는 공명 스킬 피해로 적용된다"
