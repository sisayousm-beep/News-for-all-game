id: yinlin
title: 음림
aliases: ["Yinlin"]
summary: "음림은 선천형 공명자이자 보안서의 훌륭한 순찰관이었다. 그러나 지금은 한 사건으로 순찰관 신분을 말소하고 은밀한 곳에서 홀로 숨어 있는 죄악을 조사하고 있다"
