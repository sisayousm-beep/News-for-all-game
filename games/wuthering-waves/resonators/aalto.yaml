id: aalto
title: 알토
aliases: ["Aalto"]
summary: "알토는 마치 변덕스러운 안개처럼 종잡을 수 없다. 평소에 그는 웃는 얼굴로 손님을 맞이하는 정보 상인이지만, 사실 검은 해안과 긴밀히 연결되어 있다. 후하게 값을 지불하여 그와 거래하면 원하는 정보를 살 수 있다고 한다"
attributes:
  rarity: 4
  element: aero
  weapon: pistols
  version: "1.0"
topics:
  - id: stats-lv90
    section: stats
    name: Lv.90 기본 능력치
    values: {HP: "9,850", 공격력: "262.5", 방어력: "1,075.6", 크리티컬: "5%", 크리티컬 피해: "150%"}
  - id: stat-bonus
    section: stats
    name: 스킬 트리 능력치 보너스 (노드 합계)
    values: {기류 피해 보너스: "+12%", 공격력: "+12%"}
  - id: skill
    section: skills
    name: "공명 스킬 「순간이동」"
    values: {쿨타임: "10초"}
  - id: liberation
    section: skills
    name: "공명 해방 「안개속의 꽃구경」"
    values: {공명 에너지: "150", 쿨타임: "20초"}
  - id: chain-1
    section: chain
    name: "1체인 「장난의 시작」"
    text: "공명 스킬 순간이동의 쿨타임이 4초 감소한다"
  - id: chain-2
    section: chain
    name: "2체인 「안개 매직 쇼타임」"
    text: "「안개 분신」이 계승한 HP 100% 증가, 알토가 분신에 의해 도발당한 목표를 공격할 경우 공격력이 15% 증가한다"
  - id: chain-3
    section: chain
    name: "3체인 「안개의 마법」"
    text: "알토의 일반 공격 또는 공중 공격이 「안개」를 통과할 때 2개의 총알이 추가로 생성되어 총 일반 공격 또는 공중 공격 피해량의 50%에 해당하는 피해를 입힌다"
  - id: chain-4
    section: chain
    name: "4체인 「종막의 검은 꽃」"
    text: "공명 스킬 안개탄의 피해가 30% 증가하며, 공명 회로 안개의 잠복 상태 하에 알토가 받은 피해가 30% 감소한다"
  - id: chain-5
    section: chain
    name: "5체인 「미로의 갈채」"
    text: "공명 회로 안개의 잠복 상태에 있을 시, 알토의 기류 피해 보너스가 25% 증가하며, 6초간 지속된다"
  - id: chain-6
    section: chain
    name: "6체인 「엘리트 상인」"
    text: "공명 해방 안개속의 꽃구경의 효과로 크리티컬이 추가로 8% 증가되며 알토의 강공격이 「허공의 문」을 통과할 시 피해가 추가로 50% 증가된다"
