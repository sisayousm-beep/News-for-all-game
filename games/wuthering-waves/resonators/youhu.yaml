id: youhu
title: 유호
aliases: ["Youhu"]
summary: "뛰어난 말주변을 가진 재간둥이 보물 감정사. 즉석에서 시를 지을 수 있을 뿐만 아니라 보물 감정 결론을 매우 흥미진진하면서도 조리 있게 말할 수 있는 특기가 있다. 골동품을 아끼는 사람들에게 골동품이 흘러들어가도록 길거리에서 가게를 열어 보물들을 감정하고 있다"
attributes:
  rarity: 4
  element: glacio
  weapon: gauntlets
  version: "1.3"
