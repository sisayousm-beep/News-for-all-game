    section: stats
    name: Lv.90 기본 능력치
    values: {HP: "9,975", 공격력: "262.5", 방어력: "1,051.1", 크리티컬: "5%", 크리티컬 피해: "150%"}
  - id: stat-bonus
    section: stats
    name: 스킬 트리 능력치 보너스 (노드 합계)
    values: {크리티컬: "+8%", 공격력: "+12%"}
  - id: skill
    section: skills
    name: "공명 스킬 「상자 속 축복」"
    values: {쿨타임: "15초"}
  - id: liberation
    section: skills
    name: "공명 해방 「여의점」"
    values: {쿨타임: "25초", 공명 에너지: "100"}
  - id: chain-1
    section: chain
    name: "1체인 「항구에서의 휴식」"
    text: "행운의 징조 발동 시, 유호는 10%의 확률로 피해와 공격에 면역되며 5초간 지속된다. 다른 캐릭터로 전환하면 효과는 즉시 종료된다"
  - id: chain-2
    section: chain
    name: "2체인 「편안한 숙면」"
    text: "대우(對偶), 연주(聯珠), 합설(合說)은 공명 회로 시의 형상화의 피해 증가 효과를 추가로 1회 발생시킨다"
  - id: chain-3
    section: chain
    name: "3체인 「화염의 악몽」"
    text: "유호의 공격력이 20% 증가한다"
  - id: chain-4
    section: chain
    name: "4체인 「설야의 꿈나라」"
    text: "공명 스킬 상자 속 축복을 발동할 때마다 20%의 확률로 쿨타임에 진입하지 않는다"
  - id: chain-5
    section: chain
    name: "5체인 「만리의 수면」"
    text: "변주 스킬 마음의 상자 발동 시 유호의 크리티컬이 15% 증가하고 14초간 지속된다"
  - id: chain-6
    section: chain
    name: "6체인 「천년의 단잠」"
    text: "공명 스킬 보물의 은혜 발동 시 1스택의 맑은 푸른빛 효과를 획득하고 최대 4스택 중첩이 가능하며 7초간 지속된다. 매 스택의 맑은 푸른빛은 유호의 크리티컬 피해를 15% 증가시킨다"
