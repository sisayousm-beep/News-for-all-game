id: iuno
title: 유노
aliases: ["Iuno"]
summary: "그녀는 어떤 이유로 운명의 총애를 받았고, 그만큼 운명에게 휘말렸다. 하지만 그녀는 한 번도 무너지지 않았고, 결코 물러서지 않았다. 그러니 지켜보라... 운명을 거역한 예언자가 어째서 뒤돌아보지 않는지, 수천 갈래의 인과 속에서 그녀가 어떻게 자신을 유일한 해답으로 내세웠는지..."
attributes:
  rarity: 5
  element: aero
  weapon: gauntlets
  version: "2.6"
topics:
