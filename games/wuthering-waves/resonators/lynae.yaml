    section: chain
    name: "6체인 「「나」라는 이름으로 그려진 진정한 빛」"
    text: "찬란한 도약·공중 강공격마다 「마음의 색」(최대 3스택) — 스택당 적이 받는 레인보우 스플래시·시각적 충격 피해 +30%."
