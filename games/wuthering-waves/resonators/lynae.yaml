    text: "시각적 충격·레인보우 스플래시 배율 +90%. 「흐르는 빛」 120pt 이상이면 컬러 프리믹싱(최대 25스택)으로 색 더하기 회절 피해 보너스 증가."
    values: {배율: "+90%"}
