    name: Lv.90 기본 능력치
    values: {HP: "11,400", 공격력: "375", 방어력: "1,368.9", 크리티컬: "5%", 크리티컬 피해: "150%"}
  - id: stat-bonus
    section: stats
    name: 스킬 트리 능력치 보너스 (노드 합계)
    values: {회절 피해 보너스: "+12%", 공격력: "+12%"}
