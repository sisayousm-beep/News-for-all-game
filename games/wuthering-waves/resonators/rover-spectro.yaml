    section: skills
    name: "공명 스킬 「공명 참격」"
    values: {쿨타임: "6초"}
  - id: liberation
    section: skills
    name: "공명 해방 「울림의 연주」"
    values: {쿨타임: "20초", 공명 에너지: "125"}
  - id: chain-1
    section: chain
    name: "1체인 「시초의 기행」"
    text: "공명 스킬 공명 참격 또는 공명 스킬 공명 참격·선음 발동 시, 방랑자의 크리티컬이 15% 증가하며, 7초간 지속된다"
  - id: chain-2
    section: chain
    name: "2체인 「작은 속삭임」"
    text: "방랑자의 회절 피해 보너스가 추가로 20% 증가한다"
  - id: chain-3
    section: chain
    name: "3체인 「만물의 소리」"
    text: "방랑자의 공명 효율이 20% 증가한다"
  - id: chain-4
    section: chain
    name: "4체인 「현을 이어주는 음률」"
    text: "공명 해방 울림의 연주 발동 시, 파티 내 모든 캐릭터에게 초당 자신의 공격력의 20%에 해당하는 HP 지속 회복 효과를 부여하며, 5초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「울림의 흐름」"
    text: "공명 해방 피해 보너스가 40% 증가한다"
  - id: chain-6
    section: chain
    name: "6체인 「먼길의 결말」"
    text: "공명 스킬 공명 참격 혹은 공명 참격·선음이 목표에 명중 시, 목표의 회절 피해 저항이 10% 감소하며, 20초간 지속된다"
