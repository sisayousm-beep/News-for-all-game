id: rover-spectro
title: 방랑자 · 회절
aliases: ["Rover: Spectro"]
summary: "정체불명의 공명자, 모든 소리를 흡수할 수 있는 힘을 가지고 있다. 기억을 되찾기 위해 여행을 떠난다"
attributes:
  rarity: 5
  element: spectro
  weapon: sword
  version: "1.0"
