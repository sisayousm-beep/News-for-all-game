  - id: skill
    section: skills
    name: "공명 스킬 「불꽃 양」"
    values: {쿨타임: "10초"}
  - id: liberation
    section: skills
    name: "공명 해방 「그늘이의 대폭주」"
    values: {쿨타임: "4초", 공명 에너지: "125"}
  - id: chain-1
    section: chain
    name: "1체인 「그늘이와 구름이의 동화책」"
    text: "일반 공격이 목표에 명중 시 용융 피해 보너스가 추가로 3% 증가되고, 4스택 중첩이 가능하며, 6초간 지속된다"
  - id: chain-2
    section: chain
    name: "2체인 「양세기 수면곡」"
    text: "일반 공격 메에메에 혹은 공명 스킬 열렬한 환영식 발동 시 추가로 공명 에너지 10pt를 회복하며, 10초마다 1회 발동된다"
  - id: chain-3
    section: chain
    name: "3체인 「안개? 검은해안!」"
    text: "강공격 구름이 · 제어불가의 화염 및 강공격 그늘이 · 폭주하는 화염의 피해 배율이 40% 상승한다"
  - id: chain-4
    section: chain
    name: "4체인 「모험? 재밌어!」"
    text: "강공격 그늘이·폭주하는 화염 발동 시, 파티 내의 캐릭터 용융 피해가 추가로 20% 증가하며, 30초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「주목주목, 용사 등장!」"
    text: "공명 스킬 피해 보너스가 35% 증가한다"
  - id: chain-6
    section: chain
    name: "6체인 「그늘이와 구름이가 세계를 구한다!」"
    text: "공명 해방 그늘이의 대폭주 기간 동안 입히는 피해마다 자신에게 1스택의 「길 잃은 새끼양」을 중첩하며 매 스택의 공격력이 5% 증가하며 최대 5스택까지 중첩이 가능하며, 10초간 지속된다"
