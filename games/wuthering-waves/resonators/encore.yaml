id: encore
title: 앙코
aliases: ["Encore"]
summary: "앙코의 곁에는 항상 그늘이와 구름이, 두 개의 양 인형이 함께 한다. 검은 해안의 멤버인 앙코는 캔디, 동화, 환상을 잔뜩 넣어 해피엔딩 이야기를 만드는 걸 좋아한다"
attributes:
  rarity: 5
  element: fusion
  weapon: rectifier
  version: "1.0"
