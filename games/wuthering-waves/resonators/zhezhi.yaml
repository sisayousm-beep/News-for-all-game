  - id: chain-1
    section: chain
    name: "1체인 「골법용필(骨法用筆)」"
    text: "절지가 공명 스킬 궁극 · 천재의 붓놀림을 발동할 시 공명 에너지 15pt가 회복되고, 자신의 크리티컬이 10% 증가되며, 27초간 지속된다"
  - id: chain-2
    section: chain
    name: "2체인 「기운생동(氣韻生動)」"
    text: "공명 해방 상상과 현실로 재두루미 소환 가능한 수량을 6마리 증가시킨다"
  - id: chain-3
    section: chain
    name: "3체인 「응물상형(應物象形)」"
    text: "절지가 공명 스킬 무형의 형상화, 공명 스킬 천재의 붓놀림 혹은 공명 스킬 궁극 · 천재의 붓놀림을 발동할 시 공격력이 15% 증가되고, 최대 3스택 중첩이 가능하며, 27초간 지속된다"
  - id: chain-4
    section: chain
    name: "4체인 「수류부채(隨類賦彩)」"
    text: "절지가 공명 해방 상상과 현실을 발동할 시 파티 내 캐릭터의 공격력이 20% 증가되며, 30초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「경영위치(經營位置)」"
    text: "공명 해방 상상과 현실이 지속되는 동안, 재두루미 3마리를 소환할 때마다 재두루미 1마리를 추가로 소환하여 협동 공격을 가하고 재두루미 피해량의 140%에 해당하는 피해를 입힐 수 있다. 해당 피해는 일반 공격 피해로 적용되고, 재두루미 소환 효과를 발생시키지 않는다"
  - id: chain-6
    section: chain
    name: "6체인 「전이모사(傳移模寫)」"
    text: "공명 스킬 천재의 붓놀림 혹은 공명 스킬 궁극 · 천재의 붓놀림을 발동할 시 흰두루미 1마리를 추가로 소환하여 공명 스킬 천재의 붓놀림 피해량의 120%에 해당하는 피해를 입힐 수 있으며, 해당 피해는 일반 공격 피해로 적용된다"
