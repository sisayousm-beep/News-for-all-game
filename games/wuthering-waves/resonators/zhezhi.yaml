id: zhezhi
title: 절지
aliases: ["Zhezhi"]
summary: "의뢰를 받아 생계를 유지하는 화가이다. 걱정이 많고 예민하며, 표현이 서투르다. 자신의 생각과 느낌을 그림에 오롯이 담아내곤 한다. 그녀의 붓끝을 통해 그려진 만물은 생동감이 넘쳐 마치 그림 밖으로 금방이라도 뛰쳐나올 것만 같다"
