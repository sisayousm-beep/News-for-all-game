id: cheongcho
title: 청초
aliases: [Qingxiao]
summary: 현방성 진현사기를 맡은 은거 검술 고수로 '검선'이라 불린다. 금(琴)과 검술 모두에 뛰어나다.
attributes:
  rarity: 5
  element: aero
  weapon: sword
  version: "3.6"
topics:
  # 기본 능력치 — encore-db 원값(게임 내 표시는 반올림될 수 있음)
  - id: stats-lv90
    section: stats
    name: Lv.90 기본 능력치
    values: { HP: "10300", 공격력: "462.5", 방어력: "1112.2", 크리티컬: 5%, 크리티컬 피해: 150% }
  - id: stat-bonus
    section: stats
    name: 스킬 트리 능력치 보너스 (노드 합계)
    text: 스킬 트리의 능력치 노드를 모두 활성화했을 때의 합계.
    values: { 크리티컬 피해: +16%, 공격력: +12% }
  # 스킬 — 인게임 설명의 요약. 배율은 스킬 Lv.10 기준
  - id: basic
    section: skills
    name: 기본 공격 「현으로 이은 검」
    text: >-
      최대 4단 일반 공격으로 기류 피해. 공격하며 「금심」·「검운」을 모으고, 둘 다 가득 차면 강공격 · 현검으로
      「선인의 몸」 상태에 들어간다. 공중에서는 회피가 어검 질주로 바뀐다.
  - id: skill
    section: skills
    name: 공명 스킬 「찰나의 울림」
    text: 찰나의 울림 · 단죄는 기류 피해를 주고 「금심」 45pt를 얻는다. 일반 공격 2·3단 중에는 찰나의 울림 · 비상으로 바뀐다.
    values: { 쿨타임: 20초, 단죄 배율: "20.88%×2+97.42%" }
  - id: liberation
    section: skills
    name: 공명 해방 「빛과 구름에 일렁이는 푸른 물결」
    text: 기류 피해. 낮은 공중에서도 발동할 수 있다.
    values: { 공명 에너지: "125", 쿨타임: 25초, 배율: "33.41%×10+1336.01%", 협주 에너지 회복: "20" }
  - id: forte
    section: skills
    name: 공명 회로 「무형의 심검」
    text: >-
      「선인의 몸」 상태에서 강화된 일반 공격·회피 반격을 쓰고, 「심검의」가 가득 차면 강공격 · 하늘의 정화로 마무리한다.
      적에게 쌓인 「올곧은 심지」(최대 15스택) 1스택당 청초의 주요 스킬 피해가 2%(1~7스택은 추가 5%) 증가한다.
      강공격 · 현검은 올곧은 심지 3스택을 부여하고 다음 하늘의 정화 배율을 100% 올린다(다른 캐릭터로 교대하면 사라짐).
  - id: intro
    section: skills
    name: 변주 스킬 「선율 전환」
    text: 기류 피해를 주고 「검운」 30pt를 얻는다. 다음 찰나의 울림 · 단죄 때 「금심」 30pt를 추가로 얻는다.
    values: { 배율: "39.79%+46.42%×2" }
  - id: outro
    section: skills
    name: 반주 스킬 「끝없는 선율」
    text: 청초 공격력의 800%에 해당하는 기류 피해.
  - id: inherent
    section: skills
    name: 고유 스킬 「아득한 바다, 무수한 존재」 · 「만물의 통찰, 가려낸 악의」
    text: >-
      「신심 집중」으로 격파한 적의 올곧은 심지 스택을 이어받아 다음 적에게 부여한다(최대 15스택, 30초).
      노도급·해일급 적에게 조화 밀집 · 간섭이 추가되면 올곧은 심지 1스택을 더 부여한다.
  - id: tune-break
    section: skills
    name: 조화도 파괴 「만법을 깨는 검」
    text: >-
      스킬 피해 후 적에게 「조화 밀집 · 이탈」을 부여한다. 「조화 밀집 · 간섭」 1스택마다 조화도 파괴 증폭 1pt당
      최종 피해 0.12% 증가. 파티에 있으면 적의 간섭 최대 스택이 1 늘어난다.
  # 공명 체인 — 공식 효과 요약만. 딜 증가율 같은 계산값은 analysis 레코드에.
  - id: chain-1
    section: chain
    name: 1체인 「흐르는 구름이 모였다 흩어지듯」
    text: >-
      크리티컬 16% 증가. 호신검광 최대 2스택. 전투 진입 시 「악을 씻어내는 검결」 25스택을 얻어,
      일반 공격 계열이 적중할 때마다 스택을 소모해 공격력 400%의 추가 기류 피해(일반 공격 피해, 1초에 1회)를 준다.
    values: { 크리티컬: +16%, 추가 피해: 공격력 400% }
  - id: chain-2
    section: chain
    name: 2체인 「새하얀 꽃잎이 고요히 떨어지듯」
    text: 강공격 · 현검 배율 40% 상승. 올곧은 심지·신심 집중 최대 25스택. 강공격 · 현검이 부여하는 올곧은 심지 6스택으로 증가.
    values: { 강공격 · 현검 배율: +40% }
  - id: chain-3
    section: chain
    name: 3체인 「긴 꿈은 흩어져 검영만 남아있네」
    text: >-
      공명 해방 크리티컬 피해 100% 증가. 강공격 · 현검 동안 적의 올곧은 심지 스택만큼 「만물공명」을 얻어
      스택당 하늘의 정화 배율 3% 상승. 신심 집중의 간섭 부여가 2스택으로 증가.
    values: { 공명 해방 크리티컬 피해: +100% }
  - id: chain-4
    section: chain
    name: 4체인 「아득한 속세와 나란히 나아가니」
    text: 파티원이 「조화 밀집 · 이탈」을 부여하면 그 캐릭터의 공격력이 20% 증가한다(8초).
    values: { 공격력: +20% (8초) }
  - id: chain-5
    section: chain
    name: 5체인 「서늘한 검광에 흰눈이 녹아내려」
    text: 찰나의 울림 · 단죄 배율 100% 상승. 어검비행의 「어검의 기운」 소모 30% 감소.
  - id: chain-6
    section: chain
    name: 6체인 「혼탁한 세월을 깨끗이 씻어내네」
    text: >-
      강공격 · 현검, 하늘의 정화, 공명 해방, 1체인 추가 피해로 적이 받는 피해 40% 증가. 1체인 추가 피해에도
      올곧은 심지 보너스가 적용되고, 조화 밀집 · 간섭 대응 효과가 20% 증가한다.
