    text: "주요 스킬 경직 저항. 변주 스킬 후 공격력 +20%(14초). 스푸핑 프로그램 대상 격파 시 효과 기록."
    values: {공격력: "+20%"}
  - id: chain-2
    section: chain
    name: "2체인 「블랙월, 과거 그리고 도망」"
    text: "공명 해방 시 기본 램 32pt. 펄스 교란 후 450% 추가 피해(강공격)와 스푸핑 프로그램 추가."
  - id: chain-3
    section: chain
    name: "3체인 「사이버펑크」"
    text: "공명 해방 오버라이드 배율 +50%·크리티컬 피해 +100%, 기타 해킹 피해 배율 +65%."
  - id: chain-4
    section: chain
    name: "4체인 「나이트 시티에 살아있는 전설은 없다」"
    text: "해킹 · 이탈 부여 시 파티 전체 속성 피해 +20%(20초)."
    values: {파티 속성 피해: "+20%"}
  - id: chain-5
    section: chain
    name: "5체인 「끊어진 지옥으로 향하는 길」"
    text: "옵티컬 일루전 최대 2스택, 저체력 피격 시 실드."
  - id: chain-6
    section: chain
    name: "6체인 「I Really Want to Stay At Your House」"
    text: "해킹 대상이 받는 강공격 피해 +40%, 해킹 피해 +60%."
