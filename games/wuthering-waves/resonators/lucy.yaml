summary: "나이트 시티에서 온 엣지러너. 크루에서 넷러너를 맡고 있다. 마음속 깊이 비밀을 묻어둔 채, 그녀는 다른 사람들과 깊게 얽히려 하지 않는다. 루시 곁에 있는 사람들조차도 그녀의 과거에 대해서는 아는 게 거의 없다"
