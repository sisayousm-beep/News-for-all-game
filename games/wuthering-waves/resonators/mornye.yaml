id: mornye
title: 모니에
aliases: ["Mornye"]
summary: "스페이스트렉 콜렉티브 연구소의 엔지니어 모니에는 스타토치 아카데미 엑소스트라이더 공학부에서 교수로 재직 중이다. 그녀는 인공 다리로 대지에 발을 디디고, 마음속에는 찬란한 뭇별을 품고 있다"
