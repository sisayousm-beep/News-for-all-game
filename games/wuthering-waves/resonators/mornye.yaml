  - id: chain-1
    section: chain
    name: "1체인 「침묵의 관측자」"
    text: "간섭 표기 지속 +150%, 피해 증가 효과가 조화 파동·밀집 간섭 조건 없이 적용된다. 관측 표기와 동시에 간섭 표기를 부여하고, 광역 관측 모드 중 경직 저항."
    values: {간섭 표기 지속: "+150%"}
  - id: chain-2
    section: chain
    name: "2체인 「엔트로피의 샛별」"
    text: "간섭 표기 대상에게 파티 크리티컬 피해 증가(초과 공명 효율 1%당 0.2%, 최대 32%). 공진 필드 부조화 누적 효율 +20%."
    values: {크리티컬 피해: "최대 +32%"}
  - id: chain-3
    section: chain
    name: "3체인 「돌아온 청사진」"
    text: "분산 배열 시 협주 에너지 25pt·상대 운동 에너지 100pt 회복(25초에 1회)."
  - id: chain-4
    section: chain
    name: "4체인 「우주의 숨은 변수」"
    text: "강력 공진 필드 치료량 +30%."
  - id: chain-5
    section: chain
    name: "5체인 「느리게 흐르는 시간」"
    text: "공명 해방 배율 +40%, 입자 분사 배율 +160%."
  - id: chain-6
    section: chain
    name: "6체인 「뭇별의 끝에 닿을 때까지」"
    text: "공명 해방 피해 +400%. 비전투 상태에서 공명 에너지 빠르게 회복."
