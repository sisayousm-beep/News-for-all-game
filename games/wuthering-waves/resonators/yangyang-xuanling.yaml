summary: "명정 음악 명문가의 둘째 아가씨. 부드럽고 강인하며, 순수하고 낭만적인 데다, 검을 들고 의를 행한다. 바람의 숨결과 소통할 수 있는 「소리의 수호자」. 원래 금주 야귀군 행정 부대 소속이지만, 현재는 임시로 현방성 후현 기사 직책을 맡고 있다."
