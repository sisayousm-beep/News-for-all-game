    text: "크리티컬 피해 +30%, 주요 스킬 경직 저항. 전투 진입 시 「엔트로피 변이 강화」 획득."
    values: {크리티컬 피해: "+30%"}
  - id: chain-2
    section: chain
    name: "2체인 「이 세계에 추락한 조수 하나」"
    text: "불꽃 모드에서 불꽃 효과를 부여한 캐릭터의 용융 피해 +50%(15초), 스택당 용융 저항 1% 무시(최대 10)."
    values: {용융 피해: "+50%"}
  - id: chain-3
    section: chain
    name: "3체인 「밤바람을 가르는 붉은 버들」"
    text: "공명 해방(환멸) 배율 +80%. 「어둠의 핵심」 최대 5개·획득 간격 단축."
    values: {배율: "+80%"}
  - id: chain-4
    section: chain
    name: "4체인 「먼 곳에서, 먼 곳으로」"
    text: "침식 영역 공격 간격 3초로 단축."
  - id: chain-5
    section: chain
    name: "5체인 「거짓말로 심장을 꿰맬 수 있다면」"
    text: "공명 해방(연극) 피해 +100%."
  - id: chain-6
    section: chain
    name: "6체인 「침묵 속에서 태양을 얻기를」"
    text: "엔트로피 변이 강화 중 공격력·용융 피해 +60%. 침식 영역이 불꽃 효과를 강하게 폭발."
    values: {공격력·용융 피해: "+60%"}
