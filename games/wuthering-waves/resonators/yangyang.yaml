  - id: stat-bonus
    section: stats
    name: 스킬 트리 능력치 보너스 (노드 합계)
    values: {공격력: "+12%", 기류 피해 보너스: "+12%"}
  - id: skill
    section: skills
    name: "공명 스킬 「바람의 영역」"
    values: {쿨타임: "10초"}
  - id: liberation
    section: skills
    name: "공명 해방 「북풍의 소용돌이」"
    values: {쿨타임: "16초", 공명 에너지: "100"}
  - id: chain-1
    section: chain
    name: "1체인 「다크 블루의 세례」"
    text: "변주 스킬 다크 블루의 찬송 발동 후, 양양의 기류 피해보너스를 추가로 15%만큼 증가하며, 8초간 지속된다"
  - id: chain-2
    section: chain
    name: "2체인 「종달새의 여행」"
    text: "강공격이 목표에 명중 시, 양양은 추가로 10pt의 공명 에너지를 회복하며, 20초마다 1회 발동된다"
  - id: chain-3
    section: chain
    name: "3체인 「끊이지 않는 바람의 숨결」"
    text: "공명 스킬 피해 보너스가 40% 증가하고, 바람 필드의 주변 목표에 대한 견인효과 증대하며, 견인 범위가 33% 증가한다"
  - id: chain-4
    section: chain
    name: "4체인 「귀를 기울이면」"
    text: "공중 공격 날개의 뜻 피해가 95% 증가한다"
  - id: chain-5
    section: chain
    name: "5체인 「울려 퍼지는 바람」"
    text: "공명 해방 북풍의 소용돌이로 인한 피해가 85% 증가한다"
  - id: chain-6
    section: chain
    name: "6체인 「아름다움에게 바치는 찬가」"
    text: "공중 공격 날개의 뜻 발동 후, 파티 내의 모든 캐릭터의 공격력이 20% 증가하며, 20초간 지속된다"
