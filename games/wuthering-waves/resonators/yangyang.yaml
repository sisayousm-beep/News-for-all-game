id: yangyang
title: 양양
aliases: ["Yangyang"]
summary: "양양은 「야귀」에 속한 임시 조사원이다. 가족의 울타리에서 온실의 화초처럼 자라던 소녀는 종달새가 바람을 뚫고 자신의 길을 향해 날아가듯, 이제는 자신의 힘으로 남을 지키려 노력하고 있다"
attributes:
  rarity: 4
  element: aero
  weapon: sword
  version: "1.0"
