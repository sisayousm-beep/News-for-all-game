id: lupa
title: 루파
aliases: ["Lupa"]
summary: "일곱 언덕의 검투사, 주목받는 스타 선수. 열정적이고 직설적이며 외로운 늑대처럼 야성적인 소녀. 대결의 순수한 즐거움을 계속 누릴 수 있다면, 루파는 이 경기장에서 타올라 사라지게 되더라도 두려워하지 않을 것이다"
attributes:
  rarity: 5
  element: fusion
  weapon: broadblade
  version: "2.4"
