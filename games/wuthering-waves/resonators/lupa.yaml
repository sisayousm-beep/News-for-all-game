    section: stats
    name: Lv.90 기본 능력치
    values: {HP: "11,912.5", 공격력: "387.5", 방어력: "1,185.6", 크리티컬: "5%", 크리티컬 피해: "150%"}
  - id: stat-bonus
    section: stats
    name: 스킬 트리 능력치 보너스 (노드 합계)
    values: {크리티컬: "+8%", 공격력: "+12%"}
  - id: skill
    section: skills
    name: "공명 스킬 「포위 사냥」"
    values: {쿨타임: "12초"}
  - id: liberation
    section: skills
    name: "공명 해방 「영광이 그려내는 불꽃의 단꿈」"
    values: {쿨타임: "20초", 공명 에너지: "125"}
  - id: chain-1
    section: chain
    name: "1체인 「이름 없는 자여」"
    text: "공명 해방 영광이 그려내는 불꽃의 단꿈 발동 시, 루파는 추가로 10pt의 협주 에너지를 회복하며, 크리티컬이 20% 증가되고 10초간 지속된다. 늑대의 춤에 비롯된 결심 · 극은 적의 공격에 의해 중단되지 않는다"
  - id: chain-2
    section: chain
    name: "2체인 「발 딛는 곳마다 사냥터」"
    text: "공명 해방 영광이 그려내는 불꽃의 단꿈, 강공격 · 늑대의 송곳니, 강공격 · 예리한 발톱, 공중 공격 · 불의 습격 발동 시 파티 내 캐릭터의 용융 피해 보너스가 20% 증가되고 30초간 지속되며, 최대 2스택 중첩이 가능하다"
  - id: chain-3
    section: chain
    name: "3체인 「이글거리는 늑대의 포효」"
    text: "· 변주 스킬 넌 도망칠 수 없어!의 피해 배율이 100% 상승된다. · 파티 내 용융 속성 캐릭터가 3명 미만이어도 공명 해방 추적 사냥의 추가 효과를 획득할 수 있다. · 공명 해방 영광 효과가 다음과 같은 효과로 대체된다. 공명 해방 영광이 그려내는 불꽃의 단꿈 발동 시 추가로 35초 동안 지속되는 영광 효과를 획득한다: 파티 내 캐릭터가 공격을 가할 시 15%의 용융 저항을 무시한다"
  - id: chain-4
    section: chain
    name: "4체인 「높고 뜨겁게 휘날리는 깃발」"
    text: "늑대의 춤에 비롯된 결심 · 극의 피해 배율이 125% 상승된다"
  - id: chain-5
    section: chain
    name: "5체인 「승리가 부른 박수갈채」"
    text: "변주 스킬 한 눈 팔지마! 혹은 넌 도망칠 수 없어! 발동 시 공명 해방 피해 보너스가 15% 증가되고 10초간 지속된다"
  - id: chain-6
    section: chain
    name: "6체인 「가장 눈부신 별에게」"
    text: "· 공명 회로 늑대의 춤에 비롯된 결심 · 극, 공명 해방 영광이 그려내는 불꽃의 단꿈, 변주 스킬 넌 도망칠 수 없어!로 공격하여 피해를 입힐 시 목표의 30% 방어력을 무시한다. · 공명 스킬 흉악한 포식으로 목표 명중 시 100pt의 「늑대의 불」을 회복하고, 20초마다 1회 발생할 수 있다."
