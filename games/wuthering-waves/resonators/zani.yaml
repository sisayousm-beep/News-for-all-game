id: zani
title: 젠니
aliases: ["Zani"]
summary: "아베라르도 금고 방위과 직원이자, 모범 직원 최다 선정자. 자신의 여가 시간을 위해 수많은 계획을 짜 두었지만, 일이 이 지경이 된 이상, 일단 정시에 퇴근할 방법부터 찾아야 한다"
