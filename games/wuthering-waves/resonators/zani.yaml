    values: {쿨타임: "5초"}
  - id: liberation
    section: skills
    name: "공명 해방 「명암 경계선이 바뀔 무렵」"
    values: {쿨타임: "25초", 공명 에너지: "125"}
  - id: chain-1
    section: chain
    name: "1체인 「아침 알람이 울릴 때」"
    text: "집중 압박 혹은 습격 반격 발동 시, 회절 피해 보너스가 50% 증가되고, 14초간 지속된다. 중참 · 온밤은 적의 공격에 의해 중단되지 않는다"
  - id: chain-2
    section: chain
    name: "2체인 「차가운 빵과 음료」"
    text: "크리티컬이 20% 증가한다. 집중 압박, 습격 반격의 배율이 80% 상승된다"
  - id: chain-3
    section: chain
    name: "3체인 「매일 반복되는 통근」"
    text: "화염 형태에 있을 경우, 1pt의 「불빛」을 소모할 때마다 이번 공명 해방 최후의 순간의 마지막 1단 배율이 8% 상승하며, 최대 1200% 상승된다"
  - id: chain-4
    section: chain
    name: "4체인 「고효율 에너지 절약 주의자」"
    text: "변주 스킬 즉시 집행 발동 시, 파티 내 캐릭터의 공격력이 20% 증가하며, 30초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「모든 일은 제때 처리」"
    text: "공명 해방 재연소 배율이 120% 상승된다"
  - id: chain-6
    section: chain
    name: "6체인 「급한 일? 퇴근!」"
    text: "중참 · 파효, 중참 · 해오름, 중참 · 온밤, 중참 · 섬광의 배율이 40% 상승된다. 중참 · 온밤으로 목표 명중 시 소모된 「불빛」 1pt마다 추가로 배율 상승 효과를 40% 증가시킨다. 화염 형태일 경우 다음과 같은 효과를 획득한다. · 「불빛」이 70pt 이하 시 즉시 70pt를 회복하며, 화염 형태 기간 동안 1회 발생할 수 있다."
