id: galbrena
title: 갈브레나
aliases: ["Galbrena"]
summary: "차가운 인상과 아무렇지 않게 살육을 저지르는 무자비함을 가진, 솔라리스 곳곳을 유랑하며 사냥하는 「데빌 헌터」. 사람들에게는 「영원한 불꽃의 악마」라고도 불린다. 현재 그녀는 검은 해안의 초청 멤버로서 세계 각지에서 활약하고 있다"
attributes:
  rarity: 5
  element: fusion
  weapon: pistols
  version: "2.7"
