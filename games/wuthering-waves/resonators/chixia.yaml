summary: "금주 순찰관 치샤. 그녀는 끝없이 샘솟는 열정처럼, 넘쳐흐르는 에너지로 금주의 거리를 활보한다. 그녀는 이 열정을 손끝으로 끌어내어 총알로 변환하며, 적에게 끝없는 총알을 쏘아낸다"
