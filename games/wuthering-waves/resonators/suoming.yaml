id: suoming
title: 쇄명
aliases: ["Suoming"]
summary: "몽주 화정 사람. 고향에 닥친 재앙 ｢악장｣을 해결하기 위해 금쇄십계를 만들고 계주가 되었다. 이후 ｢수호신｣의 명을 받들어 주감의 자리에 올라, 제천감을 관장하며 몽주를 수호하고 있다"
attributes:
  rarity: 5
  element: electro
  weapon: sword
  version: "3.7"
