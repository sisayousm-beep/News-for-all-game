    values: {크리티컬: "+8%", 공격력: "+12%"}
  - id: skill
    section: skills
    name: "공명 스킬 「접은 우산 형태 · 허점 파괴」"
    values: {쿨타임: "8초"}
  - id: liberation
    section: skills
    name: "공명 해방 「어두운 우산 형태 · 속박의 장기」"
    values: {쿨타임: "25초", 공명 에너지: "125"}
  - id: chain-1
    section: chain
    name: "1체인 「스산한 빗속에 몸을 던지고」"
    text: "공명 스킬 · 펼친 우산 형태 · 불굴의 염원은 적의 공격에 의해 중단되지 않는다. 변주 스킬 · 접은 우산 형태 · 섬광 파열, 변주 스킬 · 펼친 우산 형태 · 낙뢰 분쇄, 변주 스킬 · 접은 우산 형태 · 망념의 자물쇠 · 합일, 변주 스킬 · 펼친 우산 형태 · 회전 뇌격 · 합일의 피해 배율이 60% 상승된다"
  - id: chain-2
    section: chain
    name: "2체인 「벼락을 가르고 악을 베어내」"
    text: "크리티컬 피해가 40% 증가된다. 반주 스킬 발동 시, 다음 등장 캐릭터의 크리티컬 피해가 10% 증가되고, 「합일 버프」 1스택을 보유할 때마다 크리티컬 피해가 추가로 6% 증가되며, 최대 24%까지 추가로 증가되고, 30초간 지속된다. 다른 캐릭터로 전환하면 해당 효과는 즉시 종료된다"
  - id: chain-3
    section: chain
    name: "3체인 「고독한 우산과 홀로 내디뎌」"
    text: "변주 스킬 · 접은 우산 형태 · 섬광 파열 혹은 변주 스킬 · 펼친 우산 형태 · 낙뢰 분쇄 발동 시, 1스택의 「합일 버프」를 획득하고, 30초간 지속되며, 해당 효과는 25초마다 1회 적용된다. · 쇄명이 이미 「합일 버프」를 제공했었고 「합일 버프」 지속 기간에 있을 경우, 지속 시간만 리셋된다. 공명 해방 발동 시, 쇄명 자신의 일반 공격 피해가 30% 부스트되고, 25초간 지속된다"
  - id: chain-4
    section: chain
    name: "4체인 「받들은 인장을 품에 감싸고」"
    text: "쇄명의 공격력이 20% 증가된다"
  - id: chain-5
    section: chain
    name: "5체인 「무거운 약속을 잊지 않으니」"
    text: "공명 해방 · 어두운 우산 형태 · 속박의 장기의 피해 배율이 40% 상승된다"
  - id: chain-6
    section: chain
    name: "6체인 「아홉개 그림자 함께 따르리」"
    text: "파티 내 캐릭터의 「합일 버프」 1스택 당 효과가 50% 증가되고, 최대 4스택의 「합일 버프」에 적용된다. 일반 공격 · 어두운 우산 형태 · 새겨진 염원의 피해 배율이 50% 상승된다. 금쇄계주 효과 보유 시, 쇄명의 크리티컬 피해가 추가로 200% 증가된다"
