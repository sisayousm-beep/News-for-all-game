    values: {공명 에너지: "125", 쿨타임: "25초"}
  - id: chain-1
    section: chain
    name: "1체인 「잿빛 속에 타오르는 금빛」"
    text: "공중 공격 피해 보너스 +150%, 「햇살의 비호」 최대 스택 +1."
    values: {공중 공격 피해: "+150%"}
  - id: chain-2
    section: chain
    name: "2체인 「끊이지 않고 펼쳐지는 눈사태」"
    text: "공명 해방 배율 +60%. 조화 밀집 · 간섭 대상 피해 부스트가 최대 60%까지 강화."
  - id: chain-3
    section: chain
    name: "3체인 「그대의 의지를 일깨우는 금비」"
    text: "황금의 재량 상태 햇무리 참살과 후속 공격 배율 +136%."
    values: {배율: "+136%"}
  - id: chain-4
    section: chain
    name: "4체인 「얼어붙은 땅 아래에도, 새 생명은 움트니」"
    text: "조화도 파괴 후 파티 피해 +20%(20초)."
    values: {파티 피해: "+20%"}
  - id: chain-5
    section: chain
    name: "5체인 「눈보라가 만든 침묵의 장을 지나」"
    text: "변주·반주 피해 +80%. 되살아난 금빛의 흐름 배율 +50%·쿨타임 -2초·사용 횟수 +1."
  - id: chain-6
    section: chain
    name: "6체인 「빙원 위, 끝없이 펼쳐진 새벽빛」"
    text: "조화도 파괴 시 적이 받는 주요 스킬 피해 +30%, 공명 해방 피해 보너스 최대 +120%."
