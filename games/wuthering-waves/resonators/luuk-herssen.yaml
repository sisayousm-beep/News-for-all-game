id: luuk-herssen
title: 루크 · 헤르센
aliases: ["Luuk Herssen"]
summary: "스타토치 아카데미 공명 보건실의 담당 의사. 똑똑하고 진중하며, 누구도 그가 흐트러진 모습을 본 적이 없다. 그는 타인의 말에 귀를 기울이고, 사람의 마음속 그림자들을 능숙하게 해부해 낸다. 영원히 낫지 않을 상처에서 흐르는 황금피는, 오차 없는 칼날이기도 하다"
attributes:
