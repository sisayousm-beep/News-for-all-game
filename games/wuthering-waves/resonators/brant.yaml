id: brant
title: 브렌트
aliases: ["Brant"]
summary: "브렌트는 리나시타 우인 극단의 단장으로 극단의 기둥이자 리더이다. 또한 소탈하고 자유분방한 성격이 특징인 그는 언제나 낭만을 추구한다. 무대 위에서의 그는 이야기와 연극의 내용에 따라 가면이나 표정을 바꾸지만, 무대 아래에서의 그는 사람을 대할 때 진심으로 대한다"
attributes:
  rarity: 5
  element: fusion
  weapon: sword
  version: "2.1"
topics:
  - id: stats-lv90
    section: stats
    name: Lv.90 기본 능력치
    values: {HP: "11,675", 공격력: "375", 방어력: "1,307.8", 크리티컬: "5%", 크리티컬 피해: "150%"}
  - id: stat-bonus
    section: stats
    name: 스킬 트리 능력치 보너스 (노드 합계)
    values: {크리티컬: "+8%", 공격력: "+12%"}
  - id: skill
    section: skills
    name: "공명 스킬 「닻을 올려라!」"
    values: {쿨타임: "4초"}
  - id: liberation
    section: skills
    name: "공명 해방 「세상 끝까지」"
    values: {쿨타임: "24초", 공명 에너지: "175"}
  - id: chain-1
    section: chain
    name: "1체인 「해류와 바람을 따라서」"
    text: "화염 귀멸의 서곡 발동 기간 주변의 목표를 잠시 정체시킬 수 있으며, 이 기간에 다른 캐릭터로 전환하면 정체 효과가 즉시 종료된다. 변주 스킬 나를 위하여! 발동 후, 혹은 매번 공중 공격 공중 돌기 시, 브렌트가 입히는 피해가 20% 증가되고, 5초간 지속되며, 최대 3스택 중첩이 가능하다"
  - id: chain-2
    section: chain
    name: "2체인 「환호와 미소를 위하여」"
    text: "공중 공격과 화염 귀멸의 서곡 발동 시 크리티컬이 30% 증가된다. 브렌트의 반주 스킬 항로 확정!이 20초 내에 다음과 같은 추가 효과를 획득한다."
  - id: chain-3
    section: chain
    name: "3체인 「폭풍과 파도를 헤치며」"
    text: "화염 귀멸의 서곡 피해 배율이 42% 상승된다"
  - id: chain-4
    section: chain
    name: "4체인 「마음껏 노래하리라」"
    text: "화염 귀멸의 서곡으로 획득한 실드량이 20% 증가된다. 브렌트가 화염 귀멸의 서곡 발동 시, 근처 파티 내 모든 캐릭터의 HP를 회복시킨다(공명 효율 1% 당 6.60pt의 HP를 회복시킨다)"
  - id: chain-5
    section: chain
    name: "5체인 「배우 왈, 「인생이 곧 무대다!」」"
    text: "일반 공격 피해를 입힐 시, 일반 공격 피해 보너스가 15% 증가되고, 10초간 지속된다"
  - id: chain-6
    section: chain
    name: "6체인 「선장 왈, 「카니발이 곧 세계다!」」"
    text: "공중 공격 배율이 30% 상승된다. 화염 귀멸의 서곡 발동 후, 그 자리에서 재연을 1회 발생시켜 화염 귀멸의 서곡 피해량의 30%에 해당하는 용융 피해를 입히며, 해당 피해는 일반 공격 피해로 적용된다"
