id: rover-aero
title: 방랑자 · 기류
aliases: ["Rover: Aero"]
summary: "정체불명의 공명자, 모든 소리를 흡수할 수 있는 힘을 가지고 있다. 기억을 되찾기 위해 여행을 떠난다"
attributes:
  rarity: 5
  element: aero
  weapon: sword
  version: "2.2"
