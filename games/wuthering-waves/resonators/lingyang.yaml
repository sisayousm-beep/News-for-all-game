    name: "공명 해방 「돌진·사자의 질주」"
    values: {쿨타임: "20초", 공명 에너지: "125"}
  - id: chain-1
    section: chain
    name: "1체인 「늘 평안하시길」"
    text: "공명 해방 사자의 질주 지속 기간 동안, 능양 자신의 경직 저항력이 증가한다"
  - id: chain-2
    section: chain
    name: "2체인 「위풍당당한 걸음걸이」"
    text: "변주 스킬 출동 · 사자의 기상 발동 시, 능양이 추가로 10pt의 공명 에너지를 회복하며, 20초마다 1회 발동된다"
  - id: chain-3
    section: chain
    name: "3체인 「모두의 축제」"
    text: "공명 해방 사자의 질주 지속 기간 동안, 능양의 일반 공격 피해 보너스가 20% 증가하며, 공명 스킬 피해 보너스가 10% 증가한다"
  - id: chain-4
    section: chain
    name: "4체인 「열정적인 춤사위」"
    text: "능양이 반주 스킬 흔적 · 의지의 발자취를 발동할 시, 파티 내 캐릭터의 응결 피해 보너스가 20% 증가하며, 30초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「울려퍼지는 칠성북」"
    text: "공명 해방 돌진 · 사자의 질주 발동 시 추가로 능양의 200% 응결 피해를 가한다"
  - id: chain-6
    section: chain
    name: "6체인 「사자의 위엄」"
    text: "공명 회로 사자의 길 상태 시, 능양이 매번 공명 스킬 질주 · 초원을 향해 발동 후 3초 내 다음 1회의 일반 공격 피해 보너스가 100% 증가된다"
