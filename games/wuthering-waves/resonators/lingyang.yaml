id: lingyang
title: 능양
aliases: ["Lingyang"]
summary: "금주 사자춤 공연단 멤버, 착하고 열정적인 야수 족 이방인이다. 열정적이고 밝고, 용감하고 정직하며, 사람들에게 강한 흥미를 갖고 있다. 매우 강한 체력과 힘을 가지고 있으며, 항상 자신의 방식으로 「사자춤」의 의미를 해석하고 있다"
