id: calcharo
title: 카카루
aliases: ["Calcharo"]
summary: "다국적 독립 용병 조직인 「유령사냥단」의 단장은 마음이 모질고 손속이 매서우며, 특수 잔상을 소환해 협동 공격을 펼친다. 그를 고용하려면 그에 상응하는 대가를 치를 각오가 있어야 한다"
attributes:
  rarity: 5
  element: electro
  weapon: broadblade
  version: "1.0"
