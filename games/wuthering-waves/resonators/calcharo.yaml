    section: stats
    name: Lv.90 기본 능력치
    values: {HP: "10,500", 공격력: "437.5", 방어력: "1,185.6", 크리티컬: "5%", 크리티컬 피해: "150%"}
  - id: stat-bonus
    section: stats
    name: 스킬 트리 능력치 보너스 (노드 합계)
    values: {공격력: "+12%", 크리티컬 피해: "+16%"}
  - id: skill
    section: skills
    name: "공명 스킬 「척살 명령」"
    values: {쿨타임: "10초"}
  - id: liberation
    section: skills
    name: "공명 해방 「환영의 각인」"
    values: {쿨타임: "20초", 공명 에너지: "125"}
  - id: chain-1
    section: chain
    name: "1체인 「은밀한 담판」"
    text: "공명 스킬 척살 명령이 목표에 명중 시, 추가로 10pt의 공명 에너지를 회복하며, 20초마다 1회 발동된다"
  - id: chain-2
    section: chain
    name: "2체인 「제로섬 게임」"
    text: "변주 스킬 전역 수배 또는 변주 스킬 「필요한 수단」 발동 후, 공명 스킬 피해 보너스가 30% 증가하며, 15초간 지속된다"
  - id: chain-3
    section: chain
    name: "3체인 「강권 외교」"
    text: "공명 해방 살육의 무장 상태가 지속되는 동안, 카카루의 전도 피해 보너스가 25% 증가한다"
  - id: chain-4
    section: chain
    name: "4체인 「무리의 위협」"
    text: "반주 스킬 그림자의 기습 발동 시, 파티 내의 캐릭터의 전도 피해 보너스가 20% 증가하며, 30초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「위탁 협상」"
    text: "변주 스킬 전역 수배 및 변주 스킬 「필요한 수단」의 피해가 50% 증가한다"
  - id: chain-6
    section: chain
    name: "6체인 「마지막 기회」"
    text: "강공격 「사형 선고」 발동 시, 카카루는 2개의 사냥의 그림자를 소환하여 협동 공격을 진행한다. 사냥의 그림자마다 카카루 100.00% 공격의 전도 피해를 주며, 이번 피해는 공명 해방 피해로 적용된다"
