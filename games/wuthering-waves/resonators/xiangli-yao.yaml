    values: {쿨타임: "5초"}
  - id: liberation
    section: skills
    name: "공명 해방 「사고의 배열」"
    values: {쿨타임: "25초", 공명 에너지: "125"}
  - id: chain-1
    section: chain
    name: "1체인 「청출어람」"
    text: "공명 스킬 만물의 법칙 발동 시, 추가로 6개의 회선 매트릭스를 생성하여 목표를 공격하고, 피해 배율은 공명 스킬 만물의 법칙의 8%에 해당하며, 해당 피해는 공명 해방 피해로 적용된다"
  - id: chain-2
    section: chain
    name: "2체인 「선구자의 발자취」"
    text: "공명 스킬 혹은 공명 해방 사고의 배열 발동 시, 자신의 크리티컬 피해가 30% 증가되며, 8초간 지속된다"
  - id: chain-3
    section: chain
    name: "3체인 「고대 유적지」"
    text: "공명 해방 사고의 배열 발동 후, 다음 효과를 얻을 수 있다. 공명 스킬 해답, 공명 스킬 기본 추론, 공명 스킬 하나의 이치 혹은 공명 스킬 만물의 법칙의 피해가 63% 증가되며, 24초간 지속되고, 최대 5회 발생할 수 있다"
  - id: chain-4
    section: chain
    name: "4체인 「육체 재구성」"
    text: "공명 해방 사고의 배열 발동 시, 파티 내 캐릭터의 공명 해방 피해 보너스가 25% 증가되며, 30초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「뭇별의 가장자리」"
    text: "반주 스킬 연쇄 법칙 피해 배율이 222% 증가되며, 공명 해방 사고의 배열 피해 배율이 100% 상승된다"
  - id: chain-6
    section: chain
    name: "6체인 「도시의 연기」"
    text: "공명 해방 사고의 배열 발동 시 획득한 판타지 큐브를 강화하고, 공명 스킬 만물의 법칙 피해 배율을 76% 상승시킨다"
