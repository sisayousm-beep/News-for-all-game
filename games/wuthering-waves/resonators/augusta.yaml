id: augusta
title: 아우구스타
aliases: ["Augusta"]
summary: "일곱 언덕의 현임 장관. 영원히 비추는 태양이자 영원히 휘날리는 깃발이다. 그녀가 왔고, 보았고, 정복하였다. 예리한 칼날을 높이든 그녀는 다음 도전자, 그리고 저항할 수 없는 운명을 기다린다"
attributes:
  rarity: 5
  element: electro
  weapon: broadblade
  version: "2.6"
