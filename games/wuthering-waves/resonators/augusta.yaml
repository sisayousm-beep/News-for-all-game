    values: {쿨타임: "25초"}
  - id: chain-1
    section: chain
    name: "1체인 「검게 탄 흙 속 먼지에 뒤덮혀」"
    text: "· 「만민의 염원, 영광의 왕관」 각 스택마다 크리티컬 피해를 추가로 15% 증가시킨다. · 「만민의 염원, 영광의 왕관」의 최대 스택이 2스택까지 증가된다. · 아우구스타가 변주 스킬 · 불타는 황금빛 여정 발동 시에도 「만민의 염원, 영광의 왕관」 1스택을 획득할 수 있다."
  - id: chain-2
    section: chain
    name: "2체인 「살육 속에서 먼지를 씻어내」"
    text: "· 「만민의 염원, 영광의 왕관」은 다음과 같은 추가 효과를 획득한다. 각 스택마다 크리티컬을 20% 증가시킨다. · 아우구스타의 크리티컬이 100%를 초과할 경우, 초과한 크리티컬 1% 당, 아우구스타의 크리티컬 피해를 2% 증가시키고, 최대 100%까지 증가시킬 수 있다"
  - id: chain-3
    section: chain
    name: "3체인 「부패한 세상 속에서 연마된 뼈」"
    text: "다음 스킬의 피해 배율이 25% 상승된다. · 강공격 · 섬뢰 · 후퇴, 회피 반격 · 섬뢰 · 후퇴, 강공격 · 섬뢰 · 회전 베기, 강공격 · 섬뢰 · 올려치기 · 공명 스킬 · 영원한 불패의 태양 · 습격 · 공명 해방 · 뜨거운 태양의 강림 · 뜨거운 태양, 공명 해방 · 뜨거운 태양의 강림 · 불멸자의 보우"
  - id: chain-4
    section: chain
    name: "4체인 「영광 속에서 나 홀로」"
    text: "변주 스킬 · 불타는 황금빛 여정 발동 시, 파티 내 캐릭터의 공격력이 20% 증가되고, 30초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「성난 조수 속에 우뚝 서서」"
    text: "고유 스킬 · 영예의 가호로 획득한 실드량이 50% 증가된다"
  - id: chain-6
    section: chain
    name: "6체인 「찬란한 빛 속에 새긴 이름」"
    text: "· 「만민의 염원, 영광의 왕관」의 최대 스택이 4스택까지 증가된다. · 아우구스타의 크리티컬이 150%를 초과할 경우, 초과한 크리티컬 1% 당, 아우구스타의 크리티컬 피해가 2% 증가되고, 최대 50%까지 증가시킬 수 있다. · 아우구스타가 강공격 · 섬뢰 · 회전 베기, 강공격 · 섬뢰 · 올려치기 발동 시, 「만민의 염원, 영광의 왕관」을 2스택 획득할 수 있고, 1초마다"
