id: ciaccona
title: 샤콘
aliases: ["Ciaccona"]
summary: "리나시타의 음유시인, 샤콘. 그녀는 신과 평범한 인간 모두를 위해 노래한다. 그녀는 여행을 통해 이야기를 기록하고 노래하며 이야기의 주인공, 그리고 관객과 함께 웃고 감동의 눈물을 흘린다"
attributes:
  rarity: 5
  element: aero
  weapon: pistols
  version: "2.3"
