id: qiuyuan
title: 구원
aliases: ["Qiuyuan"]
summary: "전 명정 진무사의 천호장, 두 눈을 잃은 외로운 검객. 어릴 적엔 그의 원한을 산 자들이 많았고, 장성한 후엔 사람을 쫓는 일을 업으로 삼았다. 하지만 생각지도 못하게 누명을 쓰고 옥에 갇히게 되었다. 지금 그는 지천을 떠도는 방랑의 길 위에 서 있다"
attributes:
  rarity: 5
  element: aero
  weapon: sword
  version: "2.7"
