summary: "화서연구원 안전과 연구원이자 흑석 응용 분야 전문가. 평소에 쌓인 감정을 화염으로 응집하는 어빌리티를 가지고 있다. 뜨거운 레드드래곤은 결국 모든 것을 불태워버린 불길 속에서 나타날 것이다"
