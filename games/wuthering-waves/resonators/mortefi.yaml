    name: "공명 해방 「격렬한 피날레」"
    values: {쿨타임: "20초", 공명 에너지: "125"}
  - id: chain-1
    section: chain
    name: "1체인 「고독의 연주」"
    text: "공명 해방 드래곤의 광상곡 지속 기간 동안, 파티 내 등장 캐릭터가 공명 스킬 발동 시, 모르테피는 협동 공격을 가하고, 2발의 공명 해방 강화음을 발사하여 용융 피해를 입힌다"
  - id: chain-2
    section: chain
    name: "2체인 「거짓된 찬사」"
    text: "에코 어빌리티를 사용한 후, 추가로 10pt의 공명 에너지를 회복하며, 20초마다 1회 발동된다"
  - id: chain-3
    section: chain
    name: "3체인 「예열된 조율」"
    text: "공명 해방 드래곤의 광상곡 지속 기간 동안, 공명 해방 강화음의 크리티컬 피해가 30% 증가된다"
  - id: chain-4
    section: chain
    name: "4체인 「분노의 왈츠」"
    text: "공명 해방 드래곤의 광상곡의 지속 시간이 7초 연장된다"
  - id: chain-5
    section: chain
    name: "5체인 「죽음의 사중주」"
    text: "공명 스킬 분노의 연주와 공명 스킬 분노의 후가로 목표 명중 시 협동 공격을 가하게 되며, 4발의 공명 해방 강화음을 발사하여 용융 피해를 입힌다. 이번 공명 해방 강화음의 피해가 50% 감소한다"
  - id: chain-6
    section: chain
    name: "6체인 「극노의 침묵」"
    text: "공명 해방 격렬한 피날레를 사용할 시, 파티 내 캐릭터의 공격력이 20% 상승하며, 20초간 지속된다"
