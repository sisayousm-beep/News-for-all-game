id: shorekeeper
title: 파수인
aliases: ["Shorekeeper"]
summary: "파수인, 검은 해안의 수호자. 이 정도의 설명만으로도 충분할 것 같다. 갈망, 속박, 감정... 직책 외의 모든 것은 당신과의 만남 후에 보다 가득 차게 되었다"
attributes:
  rarity: 5
  element: spectro
  weapon: rectifier
  version: "1.3"
topics:
