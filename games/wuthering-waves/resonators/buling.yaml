summary: "황룡 몽주의 도사, 검은 해안의 초청 멤버, 풍수 대가, 커뮤니티 헤비 유저. 활달하고 명랑한 성격으로, 세상을 유람하며, 사주와 점괘로 무엇이든 알아맞힌다"
