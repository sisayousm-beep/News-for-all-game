    section: skills
    name: "공명 해방 「비뢰결」"
    values: {쿨타임: "24초", 공명 에너지: "150"}
  - id: chain-1
    section: chain
    name: "1체인 「만물 법보, 힘을 빌려」"
    text: "공명 해방 · 비뢰결 · 귀일(歸一)로 피해를 입힐 시, 해당 피해의 크리티컬이 20% 증가된다"
  - id: chain-2
    section: chain
    name: "2체인 「부적 써서, 귀신 잡고」"
    text: "복링이 「음양상생(陰陽相生)」 상태에 진입 시 25pt의 공명 에너지를 회복하며, 해당 효과는 24초마다 1회만 적용된다"
  - id: chain-3
    section: chain
    name: "3체인 「신령 부려, 천기 보아」"
    text: "「오뢰 퇴마진」 지속 기간 동안, 파티 내 캐릭터의 HP가 50% 미만 시 복링 공격력의 350+150%에 해당하는 HP가 즉시 회복되며, 해당 효과는 24초마다 1회만 적용된다"
  - id: chain-4
    section: chain
    name: "4체인 「솔라리스, 기운 모아」"
    text: "복링의 치료 효과 보너스가 20% 증가된다"
  - id: chain-5
    section: chain
    name: "5체인 「차단 계정, 새로 가입」"
    text: "「오뢰 퇴마진」 생성 시 즉시 범위 내의 모든 목표에게 6스택의 「전자 효과」를 추가한다"
  - id: chain-6
    section: chain
    name: "6체인 「「천지 혼원 뇌부 도배 요정 천존」」"
    text: "「뇌법(雷法) · 천지인 합일」 상태 지속 기간 동안, 파티 내 등장 캐릭터가 획득하는 공명 스킬 피해 보너스 효과가 50%로 증가된다"
