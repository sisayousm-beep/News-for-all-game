id: gyeongyeon
title: 경연
aliases: [Jingran, 산고양이 등불]
summary: 몽주에서 태어난 유람객. 신기루와 폐허 사이를 떠돌며 문파의 법도나 신불의 규율에 얽매이지 않고 자신의 길을 걷는다.
