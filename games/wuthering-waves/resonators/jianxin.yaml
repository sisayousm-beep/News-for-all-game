    section: stats
    name: Lv.90 기본 능력치
    values: {HP: "14,112.5", 공격력: "337.5", 방어력: "1,124.4", 크리티컬: "5%", 크리티컬 피해: "150%"}
  - id: stat-bonus
    section: stats
    name: 스킬 트리 능력치 보너스 (노드 합계)
    values: {크리티컬: "+8%", 공격력: "+12%"}
  - id: skill
    section: skills
    name: "공명 스킬 「순환의 기」"
    values: {쿨타임: "12초"}
  - id: liberation
    section: skills
    name: "공명 해방 「바람장의 정화」"
    values: {쿨타임: "20초", 공명 에너지: "150"}
  - id: chain-1
    section: chain
    name: "1체인 「숲 속의 푸른 새싹」"
    text: "변주 스킬 손바닥의 요령 발동 후, 일반 공격으로 획득한 「기」가 추가로 100% 증가되며 10초간 지속된다"
  - id: chain-2
    section: chain
    name: "2체인 「득도의 수행자」"
    text: "공명 스킬 순환의 기의 사용 횟수가 추가로 1회 증가한다"
  - id: chain-3
    section: chain
    name: "3체인 「무심무위의 추구」"
    text: "공명 스킬 순환의 기가 발동하는 자세를 2.5초 유지 시 직접 공명 스킬 기의 반격 · 행을 발동한다"
  - id: chain-4
    section: chain
    name: "4체인 「물음에 대한 해답」"
    text: "공명 회로 강공격·혼원기선 발동 시, 감심은 공명 해방 바람장의 정화의 피해가 80%증가하며, 14초간 지속된다"
  - id: chain-5
    section: chain
    name: "5체인 「자신에 대한 성찰」"
    text: "공명 해방 바람장의 정화 범위가 33%만큼 증가한다"
  - id: chain-6
    section: chain
    name: "6체인 「자신을 위하여」"
    text: "공명 회로 강공격·혼원기선 기간 동안 충권을 시전하여 강화된 공명 스킬 특수 · 기의 반격 · 행을 얻을 수 있다(5초 이내에 1회 발동 가능). 특수 · 기의 반격 · 행: 감심 556.67% 공격의 기류 피해를 입히며 해당 피해는 강공격 피해로 적용된다. 동시에 대주일·외단계에 도달하는 실드(고유 스킬이 감싸는 마음 보너스 영향을 받음)를 획득한다"
