id: jianxin
title: 감심
aliases: ["Jianxin"]
summary: "평생 무술의 극치만을 추구했던 도사로 실력을 가늠할 수 없는 자신의 본분을 다하는 풍의권의 전승자다. 주변 환경의 기운을 내면에 담아 바람장의 정화를 형성하는 능력을 가지고 있다"
attributes:
  rarity: 5
  element: aero
  weapon: gauntlets
  version: "1.0"
topics:
