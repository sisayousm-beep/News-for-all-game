id: taoqi
title: 도기
aliases: ["Taoqi"]
summary: "천공의 일원으로, 변방에 관한 일을 주로 담당한다. 평소에는 느릿느릿한 그녀지만 일처리는 신속하고 완벽하다. 사람들을 수호하겠다는 작은 소원들이 모이고 모여 견고한 형성된 장벽은 현재 금주성 앞에 우뚝 서있다"
