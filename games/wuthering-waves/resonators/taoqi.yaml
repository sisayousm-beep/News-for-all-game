  - id: chain-1
    section: chain
    name: "1체인 「여유로운 마음」"
    text: "공명 회로 공방전환으로 획득한 실드량이 40% 증가된다"
  - id: chain-2
    section: chain
    name: "2체인 「숨겨진 실력」"
    text: "공명 해방 불굴의 의지의 크리티컬이 20%, 크리티컬 피해가 20% 증가한다"
  - id: chain-3
    section: chain
    name: "3체인 「만물의 통찰」"
    text: "공명 스킬 철벽의 실드의 지속 시간을 30초까지 연장한다"
  - id: chain-4
    section: chain
    name: "4체인 「막중한 책임」"
    text: "강공격 후발제인을 성공적으로 발동 시, 도기의 25% HP를 회복하는 동시에 방어력이 50% 증가한다. 5초간 지속되고 15초마다 1회 발동된다"
  - id: chain-5
    section: chain
    name: "5체인 「고민해결사」"
    text: "공명 회로 공방전환의 피해가 50% 증가하며, 공명 회로 공방전환이 목표에 명중 시 공명 에너지 20pt를 회복한다"
  - id: chain-6
    section: chain
    name: "6체인 「수호의 성벽」"
    text: "공명 스킬 철벽의 실드로 획득한 실드의 지속 기간 동안 도기의 일반 공격 및 강공격의 피해가 40% 증가한다"
