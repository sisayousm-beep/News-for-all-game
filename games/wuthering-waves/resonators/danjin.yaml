id: danjin
title: 단근
aliases: ["Danjin"]
summary: "협객 단근은 자신의 혈액을 응고시켜 붉은 빛 복수의 칼날을 만든다. 붉은 빛 칼날을 휘두르며, 옳고 그름을 분별하고, 적을 소멸하며, 세상을 유랑한다"
attributes:
  rarity: 4
  element: havoc
  weapon: sword
  version: "1.0"
