id: headhunt-first-six
updatedAt: 2026-09-27
version: "1.5"
title: 80회는 픽업 확정일까?
kind: gacha
answer: 6성 확정 ≠ 픽업 확정
method: 공식 6성 확률 p(n)=0.008(n≤65), 0.008+0.05(n−65)(66≤n≤79), p(80)=1. 첫 6성 누적 확률은 1−∏(1−p(n)).
assumptions:
  - 6성 보장 카운터 0에서 시작하는 일반 집계 대상 헤드헌팅만 계산.
  - 긴급 모집은 이 카운터·누적 횟수에서 제외. 픽업 120회 보장과 별개.
  - 기존 이월 카운터, 픽업 최초 보장, 복수 6성 획득 확률은 계산하지 않음.
results:
  - 80회 보장은 임의의 6성입니다. 특별 허가의 최초 픽업 보장은 해당 헤드헌팅 120회이며, 6성이 나왔을 때 픽업 확률은 50%입니다.
