summary: >-
  260레벨 이상 300레벨 미만 캐릭터 대상. 참여 시점의 레벨·경험치 기준 30단계 맞춤형 성장 미션을 제공하며,
  단계마다 경험치와 퍼스널 코인 1,000개를 지급한다. 명의당 1캐릭터만 참여 가능하고 지정한 효과는 취소할 수 없다.
