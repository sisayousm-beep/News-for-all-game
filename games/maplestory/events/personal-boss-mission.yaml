summary: >-
  퍼스널 버닝의 세부 미션. 퍼스널 버닝에 참여한 캐릭터가 주간 보스 목록의 보스를 처치하면 보스별 경험치를 받는다.
  300레벨 캐릭터는 경험치를 받을 수 없다.
