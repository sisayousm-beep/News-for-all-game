id: 2026-09-september-update
title: 2026년 9월 업데이트 — 퍼스널 버닝·신규 에픽 던전 '아우룸 레기스'
category: update
publishedAt: 2026-09-17
summary: >-
  9월 17일(목) 업데이트로 신규 이벤트, 퍼스널 버닝, 신규 에픽 던전이 추가됐다.
  에픽 던전 '아우룸 레기스'는 290레벨 이상 캐릭터가 도전할 수 있으며 총 5개 스테이지로 구성된다.
  퍼스널 버닝은 260레벨 이상 300레벨 미만 캐릭터가 참여하며 30단계 맞춤형 성장 미션을 제공한다.
tags: [퍼스널 버닝, 에픽 던전, 아우룸 레기스]
