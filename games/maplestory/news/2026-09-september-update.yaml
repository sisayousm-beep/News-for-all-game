id: 2026-09-september-update
title: 2026년 9월 업데이트 — 퍼스널 버닝·신규 에픽 던전 '아우룸 레기스'
category: update
publishedAt: 2026-09-17
summary: >-
  9월 17일 업데이트로 퍼스널 버닝(260~299레벨, 30단계 성장 미션)과 290레벨 에픽 던전 '아우룸 레기스'(5스테이지)가 추가됐다.
  퍼스널 버닝은 명의당 한 캐릭터만, 지정 후 취소·재참여 불가.
tags: [퍼스널 버닝, 에픽 던전, 아우룸 레기스]
