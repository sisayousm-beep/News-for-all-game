  text: >-
    이번 업데이트에서 플레이어가 가장 먼저 내려야 할 결정은 퍼스널 버닝 참여 캐릭터 선택이다.
    명의당 한 캐릭터만 참여할 수 있고, 지정한 효과는 취소할 수 없으며 캐릭터를 삭제해도 재참여가 불가능하다고 공지되어 있다.
