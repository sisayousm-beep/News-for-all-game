id: wang-evaluation
title: 왕 — 커뮤니티 종합 평가
kind: evaluation
version: '6.5'
consensus: strong
verdicts:
- label: 오퍼레이터 티어
  value: 최상위 — 해외 3스 S++, "현재 가장 강한 오퍼레이터"
- label: 뽑기 권장
  value: 최우선 (해외 Strong Pull, 한정)
- label: 역할
  value: 함정술사 — 바둑돌 설치로 광역 딜·제어
- label: 추천 스킬
  value: 3스킬(천하겁) 특화 최우선
- label: 조작 난이도
  value: 보통 — 3스는 적이 올 때 켜고 돌 위치를 잡아야 강함
- label: 잠재 의존도
  value: 낮음 — 명함으로 충분, 3잠(바둑돌 +1)은 체감
summary: 출시 시점 게임 내 최강 오퍼레이터라는 평가가 국내외 모두 압도적이다. 3스 특화를 가장 먼저 하라는 의견이 공통이고, 잠재는 명함으로 충분하다는 쪽이 많다.
positive:
- 해외 공략이 "등급 상한을 두지 않았다면 S+가 열 개는 붙었을 것"이라 할 만큼 압도적.
- '이번 이벤트 EX·챌린지 모드도 왕으로 밀었다는 후기가 국내외에 많다(해외: "왕은 어디서 써도 반칙").'
- 3스는 적이 몰릴 때 켜고 범위 안에 돌을 몰아 깔면 무지성으로 뿌려도 강하다.
negative:
- 3스는 손이 꽤 간다(껐다 켜기·배치 위치).
- 3스 이름 '천하겁'은 원문 바둑 용어(패)를 살리지 못한 번역이라는 지적.
divided:
- position: 명함으로 충분하다
  reasons:
  - 잠재 효과가 코스트 감소·바둑돌 +1 정도라 체감이 작다
- position: 3잠까지는 체감된다
  reasons:
  - 저인원 클리어에서 돌 1개 차이가 기록을 가른 경우가 많다
