id: necrass-evaluation
title: 네크라스 — 커뮤니티 종합 평가
kind: evaluation
version: '5.5'
consensus: moderate
verdicts:
- label: 오퍼레이터 티어
  value: 상위권(일반 콘텐츠) — 해외 3스 S-
- label: 뽑기 권장
  value: 비추천 (해외 Strong Skip, 천장이 낮음)
- label: 역할
  value: 캐스터 — 무료·재생성 소환수로 스토리 캐리
- label: 추천 스킬
  value: 3스킬
- label: 조작 난이도
  value: 보통 — 소환수는 적을 처치한 위치에 생겨 배치 제어가 어렵다
summary: 강한 무료 소환수와 높은 딜로 일반 콘텐츠를 혼자 밀지만, 고난도에서는 소환수가 스탯 체크에 걸리고 저항에 딜이 급감해 천장이 낮다는 해외 평가. 국내에서는 "불편하지만 강하다", "모듈을 받으면 준적폐급"이라는 반응이 많았다.
positive:
- 저지까지 해 주는 깡스탯 소환수가 무료로 계속 나온다.
- 광역기와 누킹이 있어 딜도 센 편이라는 댓글.
- 모듈을 받으면 편의성이 개선된다.
negative:
- 소환수가 적을 처치한 위치에 생겨 원하는 곳에 두기 어렵다는 불만.
- 근접 칸이 적거나 소환수가 스탯에 밀리는 고난도에서는 할 일이 적다(해외).
- 마법 저항이 높은 적에게 딜이 빠르게 떨어진다(해외).
divided:
- position: 불편하지만 강하다
  reasons:
  - 배치 문제만 빼면 딜과 소환수가 강하다
- position: 애매하다
  reasons:
  - 최근 오퍼레이터 성능 인플레 속에서 배치가 불편하다
