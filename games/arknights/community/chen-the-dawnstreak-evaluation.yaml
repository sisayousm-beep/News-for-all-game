id: chen-the-dawnstreak-evaluation
title: 첸 더 던스트릭 — 커뮤니티 종합 평가
kind: evaluation
version: '6.5'
consensus: strong
verdicts:
- label: 오퍼레이터 티어
  value: 최상위권 — 해외 3스 S++(일반)·S+(고난도)
- label: 뽑기 권장
  value: 추천 (해외 Strong Pull)
- label: 역할
  value: 마법 딜러 가드 — 용(소환)·약점 피해·대상 HP 비례 피해
- label: 추천 스킬
  value: 3스킬(적소·천위) — 3스만 해도 충분
- label: 조작 난이도
  value: 쉬움
summary: 통상 6★인데도 한정급이라는 평. 대상 현재 HP 비례 피해를 주는 3스로 대형 보스를 지운다는 반응이 많고, 3스 특화만으로 충분하다는 의견이 공통이다.
positive:
- 3스가 대형 보스를 "삭제"한다 — 대형보스 황제 소리는 특수토 대신 삼첸에게 넘어갔다는 글.
- 사거리 넓은 용, 약점 피해로 대상을 넓히는 재능, 준수한 자가 회복까지 갖췄다(해외).
- 마법·물리 적응형이라 방깎을 거는 벨로네 등과 같이 써도 이득.
negative:
- 스킬을 켜도 본체는 대공이 안 된다(용은 가능)는 댓글.
- 2스는 쓸 일이 적다는 쪽이 많다.
