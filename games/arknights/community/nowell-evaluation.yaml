summary: 나쁘진 않지만 힐 위주 5★ 메딕이라 4★보다 가치가 낮다는 해외 평가. 국내에서는 "2스 회전이 좋지만 상태이상 해제가 있는 루멘 앞에서는 범부"라는 반응.
positive:
- 2스는 SP 20에 12초 지속으로 회전이 좋아 SP 보조가 있으면 거의 무한처럼 쓴다는 후기.
negative:
- 상태이상 해제가 있는 루멘에 밀린다.
- 통합 전략에서 4★이 희망 0으로 모집되면서 5★ 메딕의 가치가 더 낮아졌다(해외).
