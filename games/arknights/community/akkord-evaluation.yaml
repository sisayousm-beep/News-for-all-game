summary: 딜 말고는 아무것도 없는 4★ 광역 캐스터라 약하지만, 기존 4★ 광역 캐스터가 더 약해서 틈새 가치는 있다는 해외 평가. 국내에서도 구매증명서로 살 오퍼로 거론되지 않았다.
