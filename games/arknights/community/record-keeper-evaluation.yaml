id: record-keeper-evaluation
title: 레코드키퍼 — 커뮤니티 종합 평가
kind: evaluation
version: '5.5'
consensus: moderate
verdicts:
- label: 오퍼레이터 티어
  value: 낮음 — 해외 2스 C·C+
- label: 뽑기 권장
  value: 목표로 뽑을 필요 없음
- label: 역할
  value: 힐러 메딕 + 상황형 유틸
- label: 추천 스킬
  value: 2스킬
summary: 기본 힐은 무난하지만 특별하지 않아 특화 재료를 쓸 대상은 아니라는 평. 국내에서는 명토체스 염국 덱에서 레코드키퍼 하나로도 힐이 부족하지 않았다는 후기가 눈에 띈다.
positive:
- 유틸이 상황에 따라 쓸모 있다(해외).
- 명토체스 염국 맹약에서 힐러 한 명으로 충분했다는 후기.
negative:
- 순수 힐 메딕은 가치가 가장 낮은 유형이라 특화 투자 비추천(해외).
- 중국풍 캐릭터에 영어식 이름('녹무관'→레코드키퍼)이 어울리지 않는다는 번역 불만.
