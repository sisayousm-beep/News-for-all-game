id: papyrus-evaluation
title: 파피루스 — 커뮤니티 종합 평가
kind: evaluation
version: '5.0'
consensus: strong
verdicts:
- label: 오퍼레이터 티어
  value: 낮음 — 해외 스킬 등급 없음
- label: 뽑기 권장
  value: 이벤트 보상(무료)
- label: 역할
  value: 체인 메딕 — 연쇄 힐 + 보호막
- label: 추천 스킬
  value: 2스킬(대상 고정·추가 연쇄), 1스는 특화 1에서 SP 감소
summary: 유틸 없는 5★ 메딕이라 퍼퓨머보다도 가치가 낮다는 해외 평가와 "평범 그 자체", "그냥 힐러"라는 국내 반응이 일치한다. 디자인 때문에 키우는 사람은 많다.
positive:
- 메딕은 대부분 쓸 만은 해서, 좋아하면 키워도 기능은 한다(해외).
- 연쇄 힐과 보호막으로 힐량이 괜찮다는 글도 있었다.
negative:
- 2스는 회전이 나쁘고, 1스는 타이밍을 맞출 수 없다(해외).
- '"프틸롭시스를 계속 써라", 첫 체인 메딕이라 기대했는데 아쉽다는 댓글.'
