id: narantuya-evaluation
title: 나란투야 — 커뮤니티 종합 평가
kind: evaluation
version: '5.0'
consensus: strong
verdicts:
- label: 오퍼레이터 티어
  value: 상위권 — 해외 3스 S+(일반·고난도·통합 전략)
- label: 뽑기 권장
  value: 추천
- label: 역할
  value: 루프슈터 스나이퍼 — 원·근거리 딜 + 높은 생존력
- label: 추천 스킬
  value: 3스킬 / 세 스킬 모두 쓸 만함
- label: 조작 난이도
  value: 쉬움
summary: 스나이퍼 경쟁이 치열한데도 원거리 딜과 드문 생존력을 갖춰 확실한 자리를 잡았다는 평. 국내에서도 "그냥 존나 좋다", 엑시아보다 먼저 키우라는 조언이 나왔다.
positive:
- 원·근거리 모두 범용 딜이 강하고 재능 덕에 생존력이 원거리 유닛 중 드물게 높다(해외).
- 3스 쿨이 빨라 통합 전략 12승천에서 로봇 라인을 완벽히 막았다는 후기.
- '"체급이 엑시아와 비교할 수준이 아니다", 언덕 오퍼가 부족하면 먼저 키우라는 댓글.'
negative:
- 세 스킬의 역할이 겹쳐 여러 개 특화하면 투자가 중복된다(해외).
- 1스는 사거리 감소 체감이 커서 3스를 주로 쓴다는 의견.
