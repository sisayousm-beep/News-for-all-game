id: kichisei-evaluation
title: 키치세이 — 커뮤니티 종합 평가
kind: evaluation
version: '6.0'
consensus: strong
verdicts:
- label: 오퍼레이터 티어
  value: 최하위권 — 해외 스킬 등급 없음
- label: 뽑기 권장
  value: 목표로 뽑을 필요 없음
- label: 역할
  value: 저격(수확자) 스나이퍼 + 불안정한 제어
- label: 추천 스킬
  value: 특화 비추천
summary: 디자인은 예쁘다는 반응이 많지만 성능은 "5★ 최악 수준"이라는 해외 평가와 "큰 기대 말라"는 국내 반응이 일치한다.
positive:
- 디자인이 예뻐서 애정으로 키우는 사람이 있다.
negative:
- 높은 코스트와 낮은 딜, 가동률 낮은 제어가 전부라 틈새 가치도 거의 없다(해외).
- 딜 일부가 맵 기믹에 묶여 있다.
- 범위가 좁다는 불만, 다음 달 콜라보를 위해 재화를 아끼라는 댓글.
