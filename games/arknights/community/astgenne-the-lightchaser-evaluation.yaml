id: astgenne-the-lightchaser-evaluation
title: 아스트젠 더 라이트체이서 — 커뮤니티 종합 평가
kind: evaluation
version: '6.0'
consensus: weak
verdicts:
- label: 오퍼레이터 티어
  value: 중간 — 해외 3스 B-·B
- label: 뽑기 권장
  value: 이벤트 보상(무료 6★)
- label: 역할
  value: 감속 서포터 — 연쇄 공격·불규칙한 제어
- label: 추천 스킬
  value: 3스킬 / 2스킬은 특화 1까지
summary: 참신하고 재미있는 구성이지만 딜이 인상적이지 않고 제어가 불규칙해 대부분은 키울 필요가 없다는 해외 평가. 국내 갤러리에서는 성능 논의가 거의 없었고 "약하다"는 댓글 정도다.
positive:
- 재미있는 구성이고 몇몇 틈새에서는 쓸모가 있다(해외).
- 틈새용으로 키운다면 특화 가치는 꽤 높다.
negative:
- 딜이 약하고 제어의 가동률·예측성이 낮다(해외).
- '"아스트젠(이 명토체스에서) 약한 이유가 있었네"라는 국내 댓글.'
