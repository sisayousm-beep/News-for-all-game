summary: 백부장 특유의 "높은 바닥, 낮은 천장" 유닛이라 무난하지만 최적의 선택이 되기는 어렵다는 평. 국내에서는 재화가 남는 고인물의 장난감용이라는 댓글이 많다.
positive:
- 라인 유지·준수한 딜·자가 회복으로 기본 성능은 괜찮다(해외).
- 디자인이 잘 뽑혔다는 반응.
negative:
- 장기적 가치가 낮고, 부족한 계정도 기존 4성 등으로 더 나은 결과를 낸다(해외).
- '"5★에게 너무 많은 걸 바라지 말라"는 댓글.'
