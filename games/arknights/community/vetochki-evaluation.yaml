id: vetochki-evaluation
title: 베토치키 — 커뮤니티 종합 평가
kind: evaluation
version: '6.0'
consensus: moderate
verdicts:
- label: 오퍼레이터 티어
  value: 낮음 — 해외 2스 C+·C
- label: 뽑기 권장
  value: 애정 픽
- label: 역할
  value: 저거너트 디펜더 — 치료 불가, 자체 회복으로 라인 유지
- label: 추천 스킬
  value: 2스킬
summary: 등급 대비 맷집과 자체 회복이 좋지만 라인 유지 역할 자체의 수요가 낮고 코스트가 높아 투자 우선순위가 낮다는 평이 국내외 공통이다. 명토체스에서는 "사기 기물"로 재발견됐다.
positive:
- 5★치고 맷집·지속력이 좋고 라인을 맡을 딜도 있다(해외).
- 명토체스에서 시너지 없이도 중반부터 스택이 쌓여 이상할 만큼 단단해진다는 후기.
- 디자인이 귀여워 뽑았다는 글이 많다.
negative:
- 치료를 받을 수 없고 배치 코스트가 매우 높다(해외).
- 정예2·특화·모듈·레벨을 다 올려야 제 성능이 나온다.
- '"저거너트·5성은 안 쓴다"는 국내 댓글.'
