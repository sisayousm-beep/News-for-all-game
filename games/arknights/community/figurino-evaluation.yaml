- label: 추천 스킬
  value: 특화 비추천
summary: 50% 가동률의 광역 속박이 있지만 코스트·재료·운용 부담이 너무 커서 대부분에게는 가치가 없다는 해외 평가. 국내에서는 "아무도 안 써서 평가조차 없다"는 글이 나올 정도.
positive:
- 8초 속박은 나쁘지 않다는 댓글.
negative:
- 상인 특성상 코스트를 많이 먹는데 스킬도 코스트 25를 소모한다.
- 에단이 상인 부담 없이 기능적으로 더 낫다(해외).
