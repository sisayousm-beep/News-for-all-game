id: leizi-the-thunderbringer-evaluation
title: 레이즈 더 썬더브링어 — 커뮤니티 종합 평가
kind: evaluation
version: '5.5'
consensus: moderate
verdicts:
- label: 오퍼레이터 티어
  value: 상위권 — 해외 1스 S·S+, 2스 S-
- label: 뽑기 권장
  value: 좋지만 필수는 아님 (해외 Lean Skip)
- label: 역할
  value: 해방자 가드 — 공격 위치를 가리지 않는 딜·제어
- label: 추천 스킬
  value: 2스킬 범용, 1스킬 고점(겹친 적 폭딜)
- label: 조작 난이도
  value: 보통 — 1·3스는 각을 봐야 함
summary: 스킬 세 개가 모두 쓸 만하고 딜·제어가 좋지만 필수는 아니라는 평. 국내에서는 범용은 2스, 고점은 1스·3스라는 의견이 많다.
positive:
- 배치 위치를 공격적으로 잡을 수 있는 고유 유틸에 딜과 제어가 강하다(해외).
- 공버프를 빨리 채울 지상 타일만 있으면 몰려오는 잡몹 상대로 무에나보다 강하다는 후기.
- 1스는 같은 칸에 모인 적에게 폭딜이 들어간다.
negative:
- 1스는 호불호가 크고, 2·3스는 기존 해방자 무에나와 역할이 겹친다(해외).
- 3스는 지형·보스를 타서 각이 잘 안 나온다.
- '"성능은 좋은데 필수냐 하면 아니다", 통상은 선택권으로 받는 게 낫다는 댓글.'
