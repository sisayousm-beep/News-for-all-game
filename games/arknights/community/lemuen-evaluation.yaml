id: lemuen-evaluation
title: 르무엔 — 커뮤니티 종합 평가
kind: evaluation
version: '5.5'
consensus: strong
verdicts:
- label: 오퍼레이터 티어
  value: 최상위권 — 해외 3스 S+, 2스 A+
- label: 뽑기 권장
  value: 추천 (해외 Lean Pull, 통상)
- label: 역할
  value: 저격 스나이퍼 — 준전역 사거리 물리 보스 딜
- label: 추천 스킬
  value: 3스킬 또는 2스킬 (하나만 특화해도 됨)
- label: 조작 난이도
  value: 보통 — 2재능(총에 불이 들어올 때)을 켠 뒤 스킬을 쓰면 이득
summary: 어떤 단단한 적에게도 의미 있는 피해를 주는 몇 안 되는 물리 딜러라는 해외 평가. 국내에서도 "보스를 세 방에 끝낸다", "신시아와 둘 다 미친 성능"이라는 반응이 많았다.
positive:
- 2스로 보스를 세 방에 정리했다는 후기.
- 신시아(엑시아 더 뉴 커버넌트)와 대충 조합해도 알아서 갈아먹는다.
- 정예 적에게 표식을 찍어 먼저 때린다.
negative:
- 특화 재료가 많이 들어 스작권을 쓰는 게 낫다는 조언.
- 저격수 특성상 방어력 0인 목표 등을 우선 쏘는 경우가 있다.
- 두 스킬의 역할이 많이 겹친다(해외).
