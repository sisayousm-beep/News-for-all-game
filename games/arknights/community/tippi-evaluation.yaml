summary: 두 번째 스카이레인저지만 4★ 콘트레일보다 기본 역할을 못해 애정용이라는 해외 평가. 국내에서도 "4성 콘트레일이 더 좋다", "5성스러운 딜"이라는 반응이 대부분이었다.
positive:
- 스카이레인저 직군 자체는 공중에서 맞지 않고 시야를 밝혀 저스펙 공략에 좋다는 후기.
- 두 스킬 모두 쓸 곳은 있다(해외).
negative:
- 같은 직군 4★ 콘트레일에게도 밀린다.
- 딜이 평범한 5★ 수준이다.
