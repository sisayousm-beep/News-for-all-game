  - id: s1
    section: skills
    name: 1스킬 「'짐승 퇴치 전용'」 (특화 3)
    text: "패시브 효과: 준비 완료된 광석 '킬러' 기폭 가능, 범위 내 모든 적에게 공격력의 250%에 해당하는 물리 대미지를 입히고, 상대를 3초간 기절시킴 액티브 효과: 즉시 광석 '킬러' 1개 획득"
    values:
      SP 소모: "20"
      초기 SP: "0"
      SP: 자동 회복
      발동: 자동
  - id: s2
    section: skills
    name: 2스킬 「'견석 전용'」 (특화 3)
    text: "준비된 광석 '킬러'를 동시 기폭해 범위 내 적에게 공격력 250%의 물리 피해를 2회 주고, 방어력 -25%(중첩 불가)를 5초 부여합니다. 발동 시 광석 1개 획득."
    values:
      SP 소모: "20"
      초기 SP: "0"
      SP: 자동 회복
      발동: 자동
  - id: talent-1
    section: talents
    name: 1재능 「탐험가의 주머니」
    text: 광석 '킬러' 3개 사용 가능(최대 4개 보유), 광석 '킬러'는 배치 일정 시간 후 기폭 가능
  - id: module-1
    section: modules
    name: 모듈 TRP-Y 「광석 전시대」 (Lv.3)
    text: 20% 확률로 2배 대미지의 함정 설치 / 광석 '킬러'가 폭발할 시, 범위 내 적이 2명 이상이면 대미지가 12% 증가 / 광석 '킬러'가 폭발할 시, 범위 내 적이 2명 이상이면 대미지가
      12% 증가
    values:
      공격력: "+50"
      방어력: "+25"
