  section: stats
  name: 잠재 보너스 (2~6잠)
  text: 2잠 배치 코스트 -1 · 3잠 제2재능 강화 · 4잠 공격력 +25 · 5잠 배치 코스트 -1 · 6잠 제1재능 강화
- id: s1
  section: skills
  name: 1스킬 「나태한 자의 비명」 (특화 3)
  text: '패시브 효과: 공중 유닛 +1 초기 상태와 다음 상태 간 전환 가능: 공격력 +35%, 공중 유닛을 사용하여 전장 내 이동 중이지 않은 적을 무작위로 지정해 공격, 목표가 이동하거나 쓰러지면 다시 지정'
  values:
    SP 소모: '6'
    초기 SP: '0'
    SP: 자동 회복
    발동: 수동
- id: s2
  section: skills
  name: 2스킬 「사냥의 질주」 (특화 3)
  text: 공중 유닛 +3, 공격 범위 확대, 공격력 +120%, 공중 유닛을 사용하여 무작위로 적을 지정해 공격, 공중 유닛이 공격 시 10% 확률로 목표에 1초간 공포 효과 부여 공중 유닛은 목표 지정 후 목표가 쓰러지면 다시 지정, 스킬이 종료되면 오퍼레이터에게 복귀
  values:
    SP 소모: '28'
    초기 SP: '18'
    지속: 22초
    SP: 자동 회복
    발동: 수동
- id: s3
  section: skills
  name: 3스킬 「종막 - 재난」 (특화 3)
  text: 공중 유닛 +2, 공격력 +80%, 특별한 형태의 공중 유닛을 사용하여 산개시키고, 전장 전체에 있는 비교적 가까운 적을 각자 추격, 추격 후 목표에게 3초간 공포 효과 부여, 공중 유닛 주변 적의 이동 속도 -50%, 초당 공격력의 120%에 해당하는 마법 대미지를 입힘(중첩 불가) 공중 유닛은 목표 지정 후 목표가 쓰러지면 다시 지정, 스킬이 종료되면 오퍼레이터에게 복귀
  values:
    SP 소모: '54'
    초기 SP: '38'
    지속: 40초
    SP: 자동 회복
    발동: 수동
- id: talent-1
  section: talents
  name: 1재능 「우두머리 늑대」
  text: '전장에 배치 후 공중 유닛이 20초마다 다음 효과를 차례대로 획득: 최대 대미지 +10% / 대미지를 입힐 시 2초간 목표의 특수 능력 무효화 / 수량 +1'
- id: talent-2
  section: talents
  name: 2재능 「시라쿠사의 영광」
  text: 편성 시 모든 [시라쿠사] 오퍼레이터의 초기 SP +5
- id: module-1
  section: modules
  name: 모듈 FUN-X 「늑대의 시간」 (Lv.3)
  text: 편성 시 모든 [시라쿠사] 오퍼레이터의 초기 SP +5, 최초로 스킬 발동 후 공격 속도 +10
  values:
