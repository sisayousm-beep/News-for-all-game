  name: 특성 (메카 캐스터)
  text: 공중 유닛을 조종해 적에게 마법 대미지를 입힘 같은 적을 연속으로 공격 시 대미지 증가 (최대로 오퍼레이터 공격력의 110%에 해당하는 대미지)
