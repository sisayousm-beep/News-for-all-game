    text: 아군 치료, 치료 효과가 3명의 아군 사이에서 튕기며, 튕길 때마다 치유량 25% 감소
  - id: stats-max
    section: stats
    name: 정예2 Lv.80 능력치 (신뢰도·잠재 제외)
    values:
