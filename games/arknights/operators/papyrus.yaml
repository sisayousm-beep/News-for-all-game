  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      HP: "+150"
      공격력: "+60"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -10초 · 4잠 배치 코스트 -1 · 5잠 재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「번뜩이는 생각」 (특화 3)
    text: 다음 치료 시 치유량이 공격력의 200%까지 증가, 재능의 보호막 효과가 200%까지 증가 2회 충전 가능
    values:
      SP 소모: "8"
      초기 SP: "0"
      SP: 자동 회복
      발동: 자동
  - id: s2
    section: skills
    name: 2스킬 「벼락치기」 (특화 3)
    text: 공격 범위 내 자신을 제외한 최대 HP가 가장 높은 오퍼레이터 지정, 스킬 지속 시간 동안 파피루스는 해당 오퍼레이터만 치료의 주요 목표로 할 수 있으며, 공격 딜레이 감소, 공격력 +50%,
      치료 시 튕김 횟수 +1
    values:
      SP 소모: "30"
      초기 SP: "15"
      지속: 15초
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「고서 박람」
    text: 치료 시 목표 오퍼레이터에게 자신 공격력의 20%에 해당하는 보호막 부여, 8초간 지속
  - id: module-1
    section: modules
    name: 모듈 XAH-X 「작은 씨앗」 (Lv.3)
    text: 치료 시 목표 오퍼레이터에게 자신 공격력의 27%에 해당하는 보호막 부여, 10초간 지속
    values:
      공격력: "+60"
      방어력: "+33"
