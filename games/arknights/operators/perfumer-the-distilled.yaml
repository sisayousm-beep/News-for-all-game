  - id: s1
    section: skills
    name: "1스킬 「'산속의 기쁨'」 (특화 3)"
    text: "즉시 1회 치료, 치유량은 퍼퓨머 더 디스틸트 공격력의 500%, 동시에 목표의 방어력 +25%, 10초간 지속 (중첩 불가) / 2회 충전 가능"
    values: {"SP 소모": "9", "초기 SP": "9", "SP": "자동 회복", "발동": "자동"}
  - id: s2
    section: skills
    name: "2스킬 「'신전의 잔불'」 (특화 3)"
    text: "공격 속도 +50, 재능의 가호 효과가 2배로 증가, 치료할 때마다 목표가 3초간 공격력 +30%, 초당 최대 HP 1%만큼 감소 (중첩 불가)"
    values: {"지속": "30초", "발동": "패시브"}
  - id: talent-1
    section: talents
    name: "1재능 「백리향」 (정예2)"
    text: "공격 범위 내 자신을 제외하고 HP 비율이 자신 이하인 아군이 14%의 가호 효과 획득"
  - id: module-blsy
    section: modules
    name: "모듈 BLS-Y 「'두 달의 호흡'」 (Lv.3)"
    text: "특성: 공격 시 2명의 목표에게 마법 대미지를 입히며, 스킬 발동 후 아군 2명 치료로 변경 (치유량은 공격력의 75%에 해당) / 재능(백리향): 공격 범위 내 자신을 제외하고 HP 비율이 자신 이하인 아군이 20%의 가호 효과 획득"
    values: {"HP": "+150", "공격력": "+50"}
