id: wang
title: "왕"
aliases: ["Wang"]
summary: "6★ 스페셜리스트 · 함정술사. 염국의 바둑 국수 왕. 천 년을 이어온 대국을 마치고, 로도스 아일랜드에서 잠시 쉬고 있습니다."
attributes:
  rarity: 6
  class: specialist
  branch: "함정술사"
  obtain: limited
  version: "6.5"
