    section: stats
    name: "특성 (함정술사)"
    text: "함정을 사용해 작전 지원, 적이 있는 칸에 함정 배치 불가"
  - id: stats-max
    section: stats
    name: "정예2 Lv.90 능력치 (신뢰도·잠재 제외)"
    values: {"HP": "1,480", "공격력": "589", "방어력": "174", "마법 저항": "0", "배치 코스트": "12", "저지": "1", "공격 간격": "0.85초", "재배치": "70초"}
  - id: trust
    section: stats
    name: "신뢰도 100% 보너스"
    values: {"공격력": "+80"}
  - id: potential
    section: stats
    name: "잠재 보너스 (2~6잠)"
    text: "2잠 배치 코스트 -1 · 3잠 제1재능 강화 · 4잠 공격력 +27 · 5잠 제2재능 강화 · 6잠 배치 코스트 -1"
  - id: s1
    section: skills
    name: "1스킬 「기세」 (특화 3)"
    text: "패시브 효과: 바둑돌 효과 발동 시 목표를 정지시키고, 초당 왕 공격력 135% 마법 대미지. 6.5초간 지속 / 액티브 효과: 바둑돌 2개 즉시 획득"
    values: {"SP 소모": "16", "초기 SP": "0", "SP": "자동 회복", "발동": "자동"}
  - id: s2
    section: skills
    name: "2스킬 「삼연성」 (특화 3)"
    text: "패시브 효과: 바둑돌 효과 발동 시 연결된 방향에 따라 바둑돌 양측 3칸 범위 내 적에게 공격력 580% 마법 대미지를 입히고, 6초간 대상의 이동 속도 50% 감소 / 액티브 효과: 바둑돌 2개 즉시 획득"
    values: {"SP 소모": "15", "초기 SP": "0", "SP": "자동 회복", "발동": "자동"}
  - id: s3
    section: skills
    name: "3스킬 「천하겁」 (특화 3)"
    text: "패시브 효과: 바둑돌의 발동 및 대미지 범위 확대, 공격력 380% 마법 대미지 / 액티브 효과: 공격 중지, 공격 범위 확대, 바둑돌 8개 즉시 획득, 최대치를 초과한 바둑돌을 공격 범위 내 적이 있는 칸에 우선적으로 배치. 공격 범위 내에 바둑돌 수동 배치 시 적이 있는 칸에 배치 가능, 제1재능이 추가로 바둑돌 3개 배치, 동시에 같은 수량의 탄약 소모 / 스킬 발동 시 20발의 탄약이 장전되며, 수동 종료 또는 바둑돌 소진 시 종료, 남은 탄약은 바둑돌로 반환"
    values: {"SP 소모": "50", "초기 SP": "38", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「착수」 (정예2)"
    text: "바둑돌 6개 사용 가능(최대 7개 보유), 바둑돌이 서로 연결되면 활성화, 적이 활성화된 바둑돌이 있는 칸에 진입 시 효과 발동. 바둑돌 수동 배치 시 왕이 옆에 추가로 바둑돌 1개 배치 (최대 9개, 적이 있는 배치 불가능한 칸 우선 선택)"
  - id: talent-2
    section: talents
    name: "2재능 「수읽기」 (정예2)"
    text: "바둑돌 활성화 시 바둑돌이 위치한 직선상의 바둑돌 1개당, 직선상의 모든 바둑돌이 입히는 대미지 10% 증가 및 적의 마법 저항 9 무시 (최대 3회 중첩)"
  - id: module-trpx
    section: modules
    name: "모듈 TRP-X 「비스트 모양의 바둑통」 (Lv.3)"
    text: "특성: 배치 코스트가 더 저렴한 함정을 사용해 작전 지원, 적이 있는 칸에 함정 배치 불가, 동시 배치 가능한 함정 수량 증가 / 재능(수읽기): 바둑돌 활성화 시 바둑돌이 위치한 직선상의 바둑돌 1개당, 직선상의 모든 바둑돌이 입히는 대미지 13% 증가 및 적의 마법 저항 12 무시 (최대 3회 중첩)"
    values: {"HP": "+150", "공격력": "+60"}
