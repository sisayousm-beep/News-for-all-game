id: leizi-the-thunderbringer
title: "레이즈 더 썬더브링어"
aliases: ["Leizi the Thunderbringer"]
summary: "6★ 가드 · 해방자. 염국 천사 레이즈. 로도스 아일랜드의 '도'를 일부 인정하여, 당신과 계속 동행하기로 했습니다."
attributes:
  rarity: 6
  class: guard
  branch: "해방자"
  obtain: standard
  version: "5.5"
topics:
  - id: trait
    section: stats
    name: "특성 (해방자)"
    text: "저지 가능 수 0, 공격을 진행하지 않으며, 40초간 공격력이 최대 +200%까지 증가, 스킬 종료 후 공격력 초기화"
  - id: stats-max
    section: stats
    name: "정예2 Lv.90 능력치 (신뢰도·잠재 제외)"
    values: {"HP": "3,863", "공격력": "360", "방어력": "491", "마법 저항": "15", "배치 코스트": "12", "저지": "3", "공격 간격": "1.2초", "재배치": "70초"}
  - id: trust
    section: stats
    name: "신뢰도 100% 보너스"
    values: {"HP": "+360", "공격력": "+30"}
  - id: potential
    section: stats
    name: "잠재 보너스 (2~6잠)"
    text: "2잠 배치 코스트 -1 · 3잠 제2재능 강화 · 4잠 공격력 +29 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1"
  - id: s1
    section: skills
    name: "1스킬 「호기장존」 (특화 3)"
    text: "공격 범위가 전방과 양측으로 확대, 3개 방향의 지상 적에게 공격력 355% 물리 대미지 / 3회 충전 가능, 충전 소진 전에는 특성이 초기화되지 않음"
    values: {"SP 소모": "11", "초기 SP": "17", "SP": "자동 회복", "발동": "수동"}
  - id: s2
    section: skills
    name: "2스킬 「천뢰지위」 (특화 3)"
    text: "공격 범위가 지면을 따라 최대 3칸까지 확대, 공격 시 목표 4명에게 공격력 150% 물리 대미지를 입히며, 스킬 지속 시간 동안 번개가 떨어질 때마다 공격력 +10% (최대 25회 중첩)"
    values: {"SP 소모": "43", "초기 SP": "22", "지속": "36초", "SP": "자동 회복", "발동": "수동"}
  - id: s3
    section: skills
    name: "3스킬 「천지통명」 (특화 3)"
    text: "공격 범위 확대, 공격 딜레이 대폭 증가, 공격 시 공격력 300% 광역 물리 대미지를 입히고, 주변으로 3칸 흐르는 전류 생성. 전류가 자신 또는 고지대에 부딪히면 반사되며, 전류가 흐르는 칸 위의 모든 적은 0.6초마다 레이즈 더 썬더브링어 공격력 70% 마법 대미지를 받고, 15% 확률로 3초간 전율 효과를 받음"
    values: {"SP 소모": "36", "초기 SP": "21", "지속": "24초", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「명확한 판단」 (정예2)"
    text: "공격 범위 내의 모든 칸에 10% 확률로 번개를 떨어뜨려 모든 적에게 공격력 100% 마법 대미지, 스킬 미발동 시 이륙 상태 유지, 스킬 지속 시간 동안 공격력이 107%로 증가"
  - id: talent-2
    section: talents
    name: "2재능 「추궁」 (정예2)"
    text: "스킬 발동 시 공격 범위 내 모든 지상에 번개를 떨어뜨려 모든 적에게 공격력 100% 마법 대미지를 입히고, 2초간 전율 효과 부여"
  - id: module-libx
    section: modules
    name: "모듈 LIB-X 「'일념'」 (Lv.3)"
    text: "특성: 배치 후 +100% 효과 적용 / 재능(명확한 판단): 공격 범위 내의 모든 칸에 10% 확률로 번개를 떨어뜨려 모든 적에게 공격력 100% 마법 대미지, 스킬 미발동 시 이륙 상태 유지, 스킬 지속 시간 동안 공격력이 113%로 증가"
    values: {"HP": "+360", "공격력": "+42", "방어력": "+36"}
