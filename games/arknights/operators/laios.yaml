  section: talents
  name: 1재능 「미궁 마물 전문가」
  text: 적 처치 후, 라이오스가 같은 이름의 적 공격 시 방어력 40% 무시
- id: module-1
  section: modules
  name: 모듈 DRE-Y 「가지고 돌아가고 싶은 짐」 (Lv.3)
  text: 쓰러져도 퇴각하지 않으며, HP를 전부 회복하는 대신 최대 HP -60%, 공격 속도 +30 (배치당 1회만 발동) / 주변 4칸의 적이 쓰러진 후, 라이오스가 같은 이름의 적 공격 시 방어력 50% 무시 / 주변 4칸의 적이 쓰러진 후, 라이오스가 같은 이름의 적 공격 시 방어력 50% 무시
