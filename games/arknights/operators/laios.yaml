  section: skills
  name: 2스킬 「위협 전법」 (특화 3)
  text: 공격 중지, 스킬 지속 시간 동안 저지한 적에게 전율 효과 부여, 스킬 종료 후 저지한 적에게 공격력의 450%에 해당하는 물리 대미지를 입힘
  values:
    SP 소모: '16'
