    name: "2스킬 「타기 어려운 날개」 (특화 3)"
    text: "공격력 +100%, 추가로 목표 1명 공격, 스킬 지속 시간 동안 공격 범위 내 HP가 50% 미만인 적에게 추가로 공격력 100% 물리 대미지를 1회 입힘 (해당 대미지에는 짧은 딜레이 존재) / 모든 적은 추가 물리 대미지를 1회만 받음"
    values: {"SP 소모": "40", "초기 SP": "25", "지속": "30초", "SP": "자동 회복", "발동": "수동"}
