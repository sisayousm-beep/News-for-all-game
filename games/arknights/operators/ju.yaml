    text: "특성: 무게 등급이 3 이상인 적 공격 시 공격력이 115%까지 증가 / 재능(묵수): HP가 50% 미만인 적에게 입히는 대미지 +12%, 치명상을 입히면 적은 HP 1만 남기고 중상 상태가 되며(처치한 유닛이 SP +2), 쥐는 중상 상태의 적을 공격하지 않음"
