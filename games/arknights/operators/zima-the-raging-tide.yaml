    section: talents
    name: "1재능 「소용돌이 치는 분노」 (정예2)"
    text: "특성으로 입히는 스플래시 물리 대미지 +24%, 스플래시가 닿은 고지대는 주변 4칸의 모든 지상 적에게 공격력 24% 물리 대미지를 입히고, 적을 0.5초간 정지시킴"
  - id: talent-2
    section: talents
    name: "2재능 「만인의 해일」 (정예2)"
    text: "스킬 지속 시간 동안 전장에 배치된 모든 오퍼레이터의 공격력과 방어력 +14%, [우르수스 학생자치단] 오퍼레이터는 2배 효과 적용"
  - id: module-hamx
    section: modules
    name: "모듈 HAM-X 「언이슈드 메달」 (Lv.3)"
    text: "특성: 스플래시 범위 내 적이 3명 이상 있을 시 해당 회차의 공격력이 115%로 증가 / 재능(소용돌이 치는 분노): 특성으로 입히는 스플래시 물리 대미지 +40%, 스플래시가 닿은 고지대는 주변 4칸의 모든 지상 적에게 공격력 24% 물리 대미지를 입히고, 적을 0.5초간 정지시킴"
