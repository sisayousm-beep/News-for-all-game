    section: skills
    name: "3스킬 「거침없는 기세」 (특화 3)"
    text: "공격력 +100%, 전방 1칸을 향해 스플래시 범위가 확대된 공격을 5회 진행, 회당 공격력 240% 물리 대미지를 입히며, 공격력이 추가로 +30%. 스킬 지속 시간 동안 제1재능이 발동한 고지대는 주변 4칸의 고지대로 해당 효과를 확산(확산 횟수는 공격 횟수에 따라 증가), 대미지 효과가 3.5배로 증가, 상태 이상 효과가 2초간의 속박 효과로 변경"
    values: {"SP 소모": "27", "초기 SP": "20", "SP": "자동 회복", "발동": "수동"}
