id: exusiai-the-new-covenant
title: 엑시아 더 뉴 커버넌트
aliases:
  - Exusiai the New Covenant
summary: 6★ 스페셜리스트 · 기인. 펭귄 로지스틱스의 베테랑 직원이자 애플파이 로지스틱스의 사장 엑시아. 방금 막 라테라노에서 로도스 아일랜드로 복귀했습니다.
attributes:
  rarity: 6
  class: specialist
  branch: 기인
  obtain: limited
  version: "5.5"
topics:
  - id: trait
    section: stats
    name: 특성 (기인)
    text: 자신의 HP가 지속해서 감소
  - id: stats-max
    section: stats
    name: 정예2 Lv.90 능력치 (신뢰도·잠재 제외)
    values:
      HP: 2,150
      공격력: "708"
      방어력: "150"
      마법 저항: "10"
      배치 코스트: "13"
      저지: "1"
      공격 간격: 1.3초
      재배치: 70초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      HP: "+200"
      공격력: "+70"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 제2재능 강화 · 4잠 공격력 +30 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「하늘 대청소」 (특화 3)
    text: 공격할 때마다 공격력의 250%에 해당하는 물리 대미지를 입히며, 공중 유닛 우선 공격, 스킬 수동 종료 시 나머지 탄약을 모두 발사하여 공격 범위 내 적을 무작위로 공격 스킬 발동 시 8발의
      탄약이 장전되며, 탄약 소진 시 스킬 종료(수동 종료 가능)
    values:
      SP 소모: "12"
      초기 SP: "8"
      SP: 자동 회복
      발동: 자동
  - id: s2
    section: skills
    name: 2스킬 「발포 중독증」 (특화 3)
    text: 공격 범위 내 아군 오퍼레이터 1명의 공격 속도 70 탈취(스킬 종료 또는 엑시아 더 뉴 커버넌트가 퇴각할 때까지 지속), 자신과 해당 오퍼레이터는 최대 HP의 250%에 해당하는 보호막
      획득(보호막은 지속적으로 감소), 공격 딜레이 감소, 공격할 때마다 공격력의 300%에 해당하는 물리 대미지를 입힘 스킬 발동 시 35발의 탄약이 장전되며, 탄약 소진 시 스킬 종료(수동 종료
      가능), 공격 속도 탈취 성공 시 추가로 탄약 5발 장전
    values:
      SP 소모: "30"
      초기 SP: "25"
      SP: 자동 회복
      발동: 수동
  - id: s3
    section: skills
    name: 3스킬 「신속배달!」 (특화 3)
    text: 공격력 +30%, 공격할 때마다 공격력 160%의 5연 공격으로 변경, 배달 좌표를 배치한 경우 즉시 해당 위치에 공격력의 250%에 해당하는 스플래시 물리 대미지를 입히고, 재배치 시간이 가장
      긴 지상 오퍼레이터 1명을 해당 위치로 배치, 상대는 SP 6 획득 배치 후 배달 좌표 획득, 스킬 발동 시 50발의 탄약이 장전되며, 공격할 때마다 탄약 5발 소모(수동 종료 가능)
    values:
      SP 소모: "35"
      초기 SP: "30"
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「화력 무전」
    text: 배치되어 있을 때, 아군 오퍼레이터의 탄약이 소모될 때마다 자신의 HP 6% 회복, 동시에 25% 확률로 해당 오퍼레이터의 공격 범위 내 적을 폭격해 공격력의 150%에 해당하는 스플래시 물리
      대미지를 입힘
  - id: talent-2
    section: talents
    name: 2재능 「총탄 협약」
    text: 배치되어 있을 때, 탄약류 스킬을 보유한 오퍼레이터의 공격력 +9%, [라테라노] 오퍼레이터의 경우 2배 효과 적용
  - id: module-1
    section: modules
    name: 모듈 GEE-X 「새 친구를 위한 웰컴 키트」 (Lv.3)
    text: HP가 80%보다 높을 경우, SP 자연 회복 속도 +0.25/초 / 배치되어 있을 때, 아군 오퍼레이터의 탄약이 소모될 때마다 자신의 HP 6% 회복, 동시에 35% 확률로 해당 오퍼레이터의
      공격 범위 내 적을 폭격해 공격력의 185%에 해당하는 스플래시 물리 대미지를 입힘
    values:
      HP: "+210"
      공격력: "+65"
