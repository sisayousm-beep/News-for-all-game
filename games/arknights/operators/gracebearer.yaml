id: gracebearer
title: 그레이스베어러
aliases:
  - Gracebearer
summary: 5★ 가드 · 프라이멀 가드. 가드 오퍼레이터 그레이스베어러, 묵묵히 당신을 위해 기도합니다.
attributes:
  rarity: 5
  class: guard
  branch: 프라이멀 가드
  obtain: standard
  version: "5.5"
