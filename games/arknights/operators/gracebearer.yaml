    section: stats
    name: 특성 (프라이멀 가드)
    text: 적 2명 저지 가능, 공격 시 원소 대미지를 입힐 수 있음
  - id: stats-max
    section: stats
    name: 정예2 Lv.80 능력치 (신뢰도·잠재 제외)
    values:
      HP: 2,600
      공격력: "820"
      방어력: "350"
      마법 저항: "10"
      배치 코스트: "22"
      저지: "2"
      공격 간격: 1.2초
      재배치: 70초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      공격력: "+80"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -4초 · 4잠 공격력 +30 · 5잠 재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「두개골 파열 엘레지」 (특화 3)
    text: 공격이 2연 공격으로 변경, 공격할 때마다 공격력의 150%에 해당하는 물리 대미지를 입히고, 대미지의 10%에 해당하는 신경 손상을 입힘
    values:
      SP 소모: "30"
      초기 SP: "15"
      지속: 30초
      SP: 자동 회복
      발동: 수동
  - id: s2
    section: skills
    name: 2스킬 「가슴을 가르는 미사」 (특화 3)
    text: 즉시 주변 지상 적 최대 6명에게 공격력의 250%에 해당하는 물리 대미지를 3회 입힘, 목표가 신경 손상 폭발 상태인 경우 원소 대미지로 변경 2회 충전 가능
    values:
      SP 소모: "15"
      초기 SP: "0"
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「기세에 깃든 연민」
    text: 공격력 +10%, 신경 손상 폭발 상태인 적을 처치하면 공격력 +15%로 변경
