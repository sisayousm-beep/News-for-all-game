id: entelechia
title: 엔텔레키아
aliases:
  - Entelechia
summary: 6★ 가드 · 리퍼. 로즈 리버사이드의 배 엔텔레키아. 피의 강에서 기꺼이 당신을 인도해 줄 것입니다.
attributes:
  rarity: 6
  class: guard
  branch: 리퍼
  obtain: standard
  version: "5.5"
topics:
  - id: trait
    section: stats
    name: 특성 (리퍼)
    text: 아군의 치료를 받을 수 없으며, 공격 시 광역 대미지를 입힘, 적을 공격할 때마다 HP 50 회복, 최대 적용 수는 저지 가능 수와 동일
  - id: stats-max
    section: stats
    name: 정예2 Lv.90 능력치 (신뢰도·잠재 제외)
    values:
      HP: 2,580
      공격력: "700"
      방어력: "452"
      마법 저항: "0"
      배치 코스트: "23"
      저지: "2"
      공격 간격: 1.3초
      재배치: 70초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      공격력: "+50"
      방어력: "+50"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 제2재능 강화 · 4잠 공격력 +30 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「장미의 흔적」 (특화 3)
    text: 다음 공격의 공격력이 175%로 증가, 연속으로 2회 공격
    values:
      SP 소모: "2"
      초기 SP: "0"
      SP: 공격 회복
      발동: 자동
  - id: s2
    section: skills
    name: 2스킬 「진홍빛 장벽」 (특화 3)
    text: 공격 중지, 자신과 지상의 아군 유닛 1명에게 피의 낫을 소환해 주변의 모든 적에게 0.5초당 공격력의 195%에 해당하는 물리 대미지를 입힘
    values:
      SP 소모: "20"
      초기 SP: "15"
      지속: 12초
      SP: 자동 회복
      발동: 수동
  - id: s3
    section: skills
    name: 3스킬 「영혼과 욕망의 이별」 (특화 3)
    text: 공격 범위 확대, 공격력 +135%, 공격 속도 +100, 공격 범위 내 HP가 가장 높은 지상 적 3명에게 마음의 양초 소환, 공격할 때마다 마음의 양초에 최소 엔텔레키아 공격력의 35%에
      해당하는 대미지를 입힘, 마음의 양초는 대응하는 적 현재 HP의 60%만큼 계승, 피격될 시 적 본체도 같은 수치의 HP 감소 마음의 양초는 엔텔레키아의 공격에만 영향을 받음
    values:
      SP 소모: "30"
      초기 SP: "22"
      지속: 20초
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「흡혈」
    text: 적을 공격할 때마다 상대의 최대 HP 75 탈취(최대 1350), 5초간 초당 200의 마법 대미지를 입힘
  - id: talent-2
    section: talents
    name: 2재능 「충만」
    text: HP가 25% 미만일 시, 1회에 한해 즉시 최대 HP의 50% 회복, 이후 자신이 받는 물리 대미지 -10%
  - id: module-1
    section: modules
    name: 모듈 REA-X 「시들어버린 배」 (Lv.3)
    text: HP가 25% 미만일 시, 1회에 한해 즉시 최대 HP의 85% 회복, 이후 자신이 받는 물리 대미지 -20%
    values:
      공격력: "+70"
      방어력: "+50"
  - id: module-2
    section: modules
    name: 모듈 REA-Y 「장밋빛 이야기집」 (Lv.3)
    text: 공격 범위 내에 2명 이상의 적 존재 시 공격 속도 +12 / 적을 공격할 때마다 상대의 최대 HP 120 탈취(최대 2160), 6초간 초당 450의 마법 대미지를 입히며, 해당 마법 대미지
      효과가 존재하는 동안 자신은 초당 최대 HP의 3.5% 회복
    values:
      HP: "+300"
      공격력: "+75"
      attack_speed: "+7"
