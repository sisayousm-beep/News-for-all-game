    text: "2잠 배치 코스트 -1 · 3잠 재배치 시간 -10초 · 4잠 배치 코스트 -1 · 5잠 재능 강화 · 6잠 배치 코스트 -1"
  - id: s1
    section: skills
    name: "1스킬 「입장 배치」 (특화 3)"
    text: "배치 코스트 10 즉시 획득, 배치 구역의 가장 오른쪽에 있는 오퍼레이터 1명의 배치 코스트 -4"
    values: {"SP 소모": "30", "초기 SP": "20", "SP": "자동 회복", "발동": "자동"}
  - id: s2
    section: skills
    name: "2스킬 「만수성국」 (특화 3)"
    text: "총 15의 배치 코스트를 점진적으로 회복하며, 공격력 +70%, 초당 최대 HP의 10%만큼 HP 회복. 스킬 발동 시 배치 구역의 모든 디펜더 및 서포터 오퍼레이터의 배치 코스트 -1, 최대 HP +15% (HP 증가 버프는 최대 2회 중첩, 다음 퇴각까지 지속)"
    values: {"SP 소모": "25", "초기 SP": "15", "지속": "15초", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「만수유책」 (정예2)"
    text: "배치 30초 후, 1회에 한해 전장과 배치 구역의 모든 디펜더 및 서포터 오퍼레이터의 공격력 +10%"
