id: mon3tr
title: Mon3tr
aliases:
  - Mon3tr
summary: 6★ 메딕 · 체인 메딕. 특별 고문 Mon3tr. 로도스 아일랜드와 함께하기로 했습니다.
attributes:
  rarity: 6
  class: medic
  branch: 체인 메딕
  obtain: standard
  version: "5.5"
topics:
  - id: trait
    section: stats
    name: 특성 (체인 메딕)
    text: 아군 치료, 치료 효과가 3명의 아군 사이에서 튕기며, 튕길 때마다 치유량 25% 감소
  - id: stats-max
    section: stats
    name: 정예2 Lv.90 능력치 (신뢰도·잠재 제외)
    values:
      HP: 1,735
      공격력: "528"
      방어력: "221"
      마법 저항: "0"
      배치 코스트: "18"
      저지: "1"
      공격 간격: 2.85초
      재배치: 70초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      HP: "+500"
      공격력: "+30"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 제1재능 강화 · 4잠 공격력 +25 · 5잠 배치 코스트 -1 · 6잠 제2재능 강화
  - id: s1
    section: skills
    name: "1스킬 「책략: 초연결」 (특화 3)"
    text: 다음 치료 시 공격력의 200%에 해당하는 HP 회복, 치료의 튕김 횟수 +1
    values:
      SP 소모: "2"
      초기 SP: "0"
      SP: 공격 회복
      발동: 자동
  - id: s2
    section: skills
    name: "2스킬 「책략: 과부하」 (특화 3)"
    text: 스킬 지속 시간 동안 재구성체를 우선 치료, 재구성체가 Mon3tr의 치료를 받을 때마다 치료가 추가로 1회 튕기며, 제2재능의 효과가 2.8배로 증가
    values:
      SP 소모: "15"
      초기 SP: "13"
      지속: 30초
      SP: 공격 회복
      발동: 수동
  - id: s3
    section: skills
    name: "3스킬 「책략: 용해」 (특화 3)"
    text: 공격 범위 변경, 스킬 발동 시 재구성체의 위치로 이동, 공격력 +330%, 공격 딜레이 감소, 저지 가능 수 +2, 최대 HP +5000, 초당 HP 80 감소, 저지하고 있는 모든 적 동시에
      공격, 대미지 유형이 트루 대미지로 변경, 공격 시 자신은 공격력의 50%에 해당하는 HP 회복 스킬 종료 또는 치명상을 입을 시 초기 위치로 복귀
    values:
      SP 소모: "15"
      초기 SP: "11"
      지속: 25초
      SP: 공격 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「자가 복구」
    text: 공격 범위 내 지상에 자신만 치료할 수 있는 재구성체 1개 배치 가능, 재구성체 주변 아군 유닛의 공격력 +15%, 재구성체가 자신 또는 Mon3tr의 치료를 받을 시 치유량이 감소하지 않고
      치료가 1회 더 튕김
  - id: talent-2
    section: talents
    name: 2재능 「전술 협동」
    text: 자신 또는 재구성체가 치료할 시, 목표 및 자신의 공격 속도 +20, 10초간 지속 (중첩 불가)
  - id: module-1
    section: modules
    name: 모듈 XAH-X 「기억 파일」 (Lv.3)
    text: 공격 범위 내 지상에 자신만 치료할 수 있는 재구성체 1개 배치 가능, 재구성체 주변 아군 유닛의 공격력 +25%, 재구성체가 자신 또는 Mon3tr의 치료를 받을 시 치유량이 감소하지 않고
      치료가 1회 더 튕김, 다음 튕길 때도 치유량이 감소하지 않음
    values:
      공격력: "+65"
      방어력: "+40"
