    text: "특성: 아군 치료, 치료 효과가 3명의 아군 사이에서 튕기며, 튕길 때마다 치유량 15% 감소 / 재능(구병성의): 자신의 치료를 받을 시 치유량이 130%로 증가, 추가로 치유량이 감소하지 않고 치료가 1회 더 튕김"
