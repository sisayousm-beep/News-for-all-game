    name: "2스킬 「'까꿍!'」 (특화 3)"
    text: "현재 HP의 15% 소모, 즉시 목표를 1회 치료하고, 목표를 초당 공격력의 35%만큼 치료하는 버프 부여, 치료한 모든 목표는 12초간 위장 효과 획득"
    values: {"SP 소모": "35", "초기 SP": "30", "SP": "자동 회복", "발동": "수동"}
