id: blaze-the-igniting-spark
title: 블레이즈 디 이그나이팅 스파크
aliases:
  - Blaze the Igniting Spark
summary: 6★ 캐스터 · 프라이멀 캐스터. 로도스 아일랜드 정예 오퍼레이터 블레이즈. 모두의 공동 이상을 위해서라면 기꺼이 자신의 생명을 불사를 것입니다.
attributes:
  rarity: 6
  class: caster
  branch: 프라이멀 캐스터
  obtain: standard
  version: "5.5"
topics:
  - id: trait
    section: stats
    name: 특성 (프라이멀 캐스터)
    text: 공격 시 마법 대미지를 입히며, 원소 대미지를 입힐 수 있음
  - id: stats-max
    section: stats
    name: 정예2 Lv.90 능력치 (신뢰도·잠재 제외)
    values:
      HP: 1,608
      공격력: "662"
      방어력: "131"
      마법 저항: "15"
      배치 코스트: "21"
      저지: "1"
      공격 간격: 1.6초
      재배치: 70초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      공격력: "+90"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 제2재능 강화 · 4잠 공격력 +31 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「화끈한 지원」 (특화 3)
    text: 즉시 공격 범위 내 최대 HP가 가장 높은 오퍼레이터를 1명 지정해, 20초간 목표 주변의 모든 적에게 초당 공격력의 70%에 해당하는 마법 대미지 및 마법 대미지의 30%에 해당하는 소각 손상을
      입힘
    values:
      SP 소모: "16"
      초기 SP: "8"
      SP: 자동 회복
      발동: 자동
  - id: s2
    section: skills
    name: 2스킬 「끓어오르는 피의 불꽃」 (특화 3)
    text: "공격 범위 변경, 공격 딜레이 증가, 공격력 +150%, 동시에 목표 3개 공격, 공격 시 자신의 HP 5% 감소, 목표 위치에 연소 구역 생성. 연소 구역: 적의 이동 속도 -50%, 초당
      블레이즈 디 이그나이팅 스파크 공격력의 35%에 해당하는 마법 대미지 및 마법 대미지의 30%에 해당하는 소각 손상을 입힘"
    values:
      SP 소모: "36"
      초기 SP: "23"
      지속: 35초
      SP: 자동 회복
      발동: 수동
  - id: s3
    section: skills
    name: 3스킬 「만악의 소각장」 (특화 3)
    text: 공격 범위 변경, 공격력 +115%, 공격 딜레이 대폭 감소, 공격이 광역 공격으로 변경, 목표가 소각 손상 폭발 상태인 경우 추가로 공격력의 80%에 해당하는 원소 대미지를 입힘 자신의 HP가
      초당 3% 감소, 스킬 발동 시 탄약 25발이 장전되고, 전장에 소각 손상 폭발 상태인 적 존재 시 2발 추가 장전, 탄약 소진 시 스킬 종료(수동 종료 가능)
    values:
      SP 소모: "30"
      초기 SP: "20"
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「융해점 기폭」
    text: 전장에 소각 손상 폭발 상태인 적이 존재할 시 즉시 상대에게 공격력의 350%에 해당하는 원소 대미지를 입히고, 최대 HP의 12% 회복
  - id: talent-2
    section: talents
    name: 2재능 「절망 속 재점화」
    text: 쓰러지면 6000의 보호막 획득, 쓰러져 있는 동안 공격할 수 없고 치료받을 수 없으며, 초당 최대 HP의 3% 회복, HP 전부 회복 후 부활하고 주변 적을 5초간 기절시킴
  - id: module-1
    section: modules
    name: 모듈 PRI-X 「간절한 희망」 (Lv.3)
    text: 원소 폭발 상태인 적에게 입히는 대미지가 110%로 증가 / 전장에 소각 손상 폭발 상태인 적이 존재할 시 즉시 상대에게 공격력의 420%에 해당하는 원소 대미지를 입히고, 최대 HP의 15%
      회복 및 10초간 공격력 +10%
    values:
      공격력: "+82"
      방어력: "+25"
