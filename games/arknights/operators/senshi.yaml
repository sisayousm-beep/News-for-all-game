  text: '요리를 시작하고 3초간 공격 중지, 요리 완료 후 주변 아군 오퍼레이터 1명을 치료해 공격력의 280%에 해당하는 HP 회복, 동시에 다음 효과 중 무작위로 1종 획득: 공격력 +20% / 공격 속도 +20 / 최대 HP +25%, 8초간 지속'
  values:
