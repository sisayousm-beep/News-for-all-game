    발동: 자동
- id: s2
  section: skills
  name: 2스킬 「연회용 마물 요리」 (특화 3)
  text: 요리를 시작하고 10초간 공격 중지, 요리하는 동안 주변 오퍼레이터가 초당 센시 공격력의 45%에 해당하는 HP 회복, 이후 일정 범위 내 모든 아군 오퍼레이터가 공격력의 180%에 해당하는 HP 회복, 마력 10 회복
