id: lemuen
title: 르무엔
aliases:
  - Lemuen
summary: 6★ 스나이퍼 · 저격수. 라테라노인 르무엔이 당신에게 인사를 건넵니다.
attributes:
  rarity: 6
  class: sniper
  branch: 저격수
  obtain: standard
  version: "5.5"
topics:
  - id: trait
    section: stats
    name: 특성 (저격수)
    text: 공격 범위 내 방어력이 가장 낮은 적을 우선 공격
  - id: stats-max
    section: stats
    name: 정예2 Lv.90 능력치 (신뢰도·잠재 제외)
    values:
      HP: 1,448
      공격력: 1,201
      방어력: "175"
      마법 저항: "0"
      배치 코스트: "22"
      저지: "1"
      공격 간격: 2.7초
      재배치: 70초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      공격력: "+100"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -4초 · 4잠 공격력 +46 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「재회 인사」 (특화 3)
    text: 공격 시 공격력이 210%로 증가, 추가로 적 1명 공격 스킬 발동 시 6발의 탄약이 장전되며, 탄약 소진 시 스킬 종료(수동 종료 가능)
    values:
      SP 소모: "8"
      초기 SP: "0"
      SP: 공격 회복
      발동: 자동
  - id: s2
    section: skills
    name: 2스킬 「귀향의 약속」 (특화 3)
    text: 공격 속도 +80, 공격력 +70%, 전장에 수배 상태의 적이 존재 시 최대 3.5초간 조준한 후 탄약을 소모하여 회피를 무시하는 저격을 진행 (조준 시간 동안 공격력이 180%에서 425%로
      점차 증가, 공격력이 적의 남은 HP와 방어력을 합산한 수치보다 높을 경우 조준을 멈추고 즉시 사격) 스킬 발동 시 7발의 탄약이 장전되며, 탄약 소진 시 스킬 종료(수동 종료 가능)
    values:
      SP 소모: "30"
      초기 SP: "15"
      SP: 자동 회복
      발동: 수동
  - id: s3
    section: skills
    name: 3스킬 「예포 - 강제적인 추모」 (특화 3)
    text: 공격 중지, 0.5초마다 탄약 1발을 소모하여 차례대로 적을 지정, 스킬 종료 시 지정된 적을 향해 폭격하여 공격력의 300%에 해당하는 광역 물리 대미지를 입힘 (중심 대미지는 공격력의
      450%로 증가) 스킬 발동 시 5발의 탄약이 장전되며, 탄약 소진 시 스킬 종료(수동 종료 가능)
    values:
      SP 소모: "38"
      초기 SP: "32"
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「국경 간 추격 허가」
    text: 정예 또는 리더 적이 라테라노 오퍼레이터의 공격 범위 내에서 8초 이상 머무르면 수배 상태가 되며, 라테라노 오퍼레이터로부터 받는 대미지 +15%, 르무엔은 수배 상태인 모든 목표 공격 가능
  - id: talent-2
    section: talents
    name: 2재능 「탈주범 인도 절차」
    text: 배치 20초 후 공격력 +10%, 탄약류 스킬의 최대 탄약 +1
  - id: module-1
    section: modules
    name: 모듈 DEA-Y 「'탄창과 색유리 창'」 (Lv.3)
    text: 공격한 적이 쓰러지지 않으면 자신은 추가로 SP 1 획득 / 배치 15초 후 공격력 +18%, 탄약류 스킬의 최대 탄약 +2, 다른 라테라노 오퍼레이터의 탄약류 스킬의 최대 탄약 +1
    values:
      HP: "+120"
      공격력: "+120"
