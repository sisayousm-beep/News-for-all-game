id: misumi-uika
title: "미스미 우이카"
aliases: ["Misumi Uika"]
summary: "5★ 서포터 · 음유시인. Ave Mujica의 보컬 겸 기타리스트 미스미 우이카. 현재 가장 인기 있는 아이돌입니다."
attributes:
  rarity: 5
  class: supporter
  branch: "음유시인"
  obtain: collab
  version: "6.0"
topics:
  - id: trait
    section: stats
    name: "특성 (음유시인)"
    text: "공격을 진행하지 않으며, 범위 내 모든 아군의 HP를 초당 자신 공격력의 10%만큼 회복, 자신은 격려의 영향을 받지 않음"
  - id: stats-max
    section: stats
    name: "정예2 Lv.80 능력치 (신뢰도·잠재 제외)"
    values: {"HP": "1,410", "공격력": "309", "방어력": "253", "마법 저항": "0", "배치 코스트": "7", "저지": "1", "공격 간격": "1.3초", "재배치": "70초"}
  - id: trust
    section: stats
    name: "신뢰도 100% 보너스"
    values: {"공격력": "+70"}
  - id: potential
    section: stats
    name: "잠재 보너스 (2~6잠)"
    text: "2잠 배치 코스트 -1 · 3잠 재배치 시간 -4초 · 4잠 공격력 +20 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1"
  - id: s1
    section: skills
    name: "1스킬 「내가 그리워하는 것」 (특화 3)"
    text: "공격 범위 확대, 공격 범위 내 모든 아군 유닛이 미스미 우이카 공격력 및 방어력 55% 격려 효과 획득, 목표가 대미지를 받을 시 미스미 우이카가 목표의 HP 100 치료"
    values: {"SP 소모": "35", "초기 SP": "25", "지속": "30초", "SP": "자동 회복", "발동": "수동"}
  - id: s2
    section: skills
    name: "2스킬 「내가 슬퍼하는 것」 (특화 3)"
    text: "스킬 지속 시간 동안 특성의 HP 회복 효과 일시 중단, 0.3초마다 공격 범위 내 랜덤 1명의 적에게 공격력 100% 마법 대미지를 입히고, 오퍼레이터 1명을 공격력 25% HP만큼 치료, 공격 범위 내 모든 아군 유닛이 미스미 우이카 공격력 100% 격려 효과 획득"
    values: {"SP 소모": "30", "초기 SP": "20", "지속": "12초", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「거짓의 가면」 (정예2)"
    text: "스킬 미발동 시 4초마다 공격 범위 내 HP가 가장 낮은 아군 유닛을 공격력 30% HP만큼 치료, 스킬 지속 시간 동안 '토가와 사키코'를 우선 치료"
  - id: talent-2
    section: talents
    name: "2재능 「슬픔이 두렵지 않으리」 (정예2)"
    text: "Ave Mujica 멤버 치료 시 Fever +5, 공격 범위 내 Ave Mujica 멤버가 공격 시 미스미 우이카 공격력 30% 마법 대미지를 추가로 입힘"
  - id: module-barx
    section: modules
    name: "모듈 BAR-X 「점괘의 의미」 (Lv.3)"
    text: "특성: 공격 범위 내에 다른 오퍼레이터가 2명 이상 존재 시 공격력 +8% (스킬 영향을 받지 않음) / 재능(거짓의 가면): 스킬 미발동 시 3초마다 공격 범위 내 HP가 가장 낮은 아군 유닛을 공격력 30% HP만큼 치료, 스킬 지속 시간 동안 '토가와 사키코'를 우선 치료"
    values: {"HP": "+200", "공격력": "+22"}
