  section: talents
  name: 1재능 「고난 감수」
  text: 스킬 지속 시간 동안 자신 주변에 연막 생성, 범위 내 적의 물리 및 마법 명중률 -20%
- id: talent-2
  section: talents
  name: 2재능 「크라운슬레이어의 명성」
  text: 자신에게 대미지를 입히지 않은 지상 적에게 입히는 물리 대미지 +20%
