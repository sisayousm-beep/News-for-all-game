  section: skills
  name: 3스킬 「봉화 처형장」 (최대 레벨)
  text: 배치 후 제1재능의 효과 범위 확대, 크라운슬레이어는 연막 속에서 은신 효과를 획득하고 저지 가능 수가 0으로 변경, 2초마다 나타나 연막 내의 지상 적 1명에게 공격력의 250%에 해당하는 물리 대미지를 2회 입히고, 목표를 4초간 기절시킴 (동일한 목표에게 6초에 1회만 발동)
  values:
    SP 소모: '0'
    초기 SP: '0'
    지속: 16초
    SP: 8
    발동: 패시브
