  name: 2스킬 「포연과 진폭」 (최대 레벨)
  text: 배치 후 8초간 공격 중지, 쉽게 적의 공격 목표가 되지 않으며, 제1재능의 효과가 2.5배로 증가, 스킬 종료 시 연막 내의 모든 지상 적에게 공격력의 500%에 해당하는 물리 대미지를 입힘
  values:
