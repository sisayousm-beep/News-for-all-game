id: thorns-the-lodestar
title: 쏜즈 더 로드스타
aliases:
  - Thorns the Lodestar
summary: 6★ 스페셜리스트 · 연금술사. '네네의 요람'호 선장 쏜즈. 돛대 위에서 뒤를 돌아보며 함께하자고 당신에게 손을 내밉니다.
attributes:
  rarity: 6
  class: specialist
  branch: 연금술사
  obtain: standard
  version: "5.0"
topics:
  - id: trait
    section: stats
    name: 특성 (연금술사)
    text: 연금 유닛을 투척해 작전 지원
  - id: stats-max
    section: stats
    name: 정예2 Lv.90 능력치 (신뢰도·잠재 제외)
    values:
      HP: 1,173
      공격력: "501"
      방어력: "106"
      마법 저항: "30"
      배치 코스트: "18"
      저지: "1"
      공격 간격: 1.5초
      재배치: 70초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      HP: "+200"
      공격력: "+40"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -4초 · 4잠 마법 저항 +12 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「파도 측정」 (특화 3)
    text: 아군 유닛에게 연금 유닛을 1개 투척해 8초간 연금 유닛과 주변 8칸 내 아군 유닛의 방어력 +100, 초당 공격력의 20%해당하는 HP 회복
    values:
      SP 소모: "5"
      초기 SP: "5"
      SP: 자동 회복
      발동: 자동
  - id: s2
    section: skills
    name: 2스킬 「해일 분해」 (특화 3)
    text: 연금 유닛을 1개 투척, 15초간 연금 유닛 주변 지상 적이 받는 치료 및 회복 효과를 50% 감소시키고, 초당 공격력의 180%에 해당하는 마법 대미지를 입히며, 아군 유닛은 초당 공격력의
      18%에 해당하는 HP 회복. 연금 유닛은 투척된 방향으로 15초간 서서히 이동하고, 효과 범위가 지속적으로 확대 2회 충전 가능
    values:
      SP 소모: "20"
      초기 SP: "14"
      SP: 자동 회복
      발동: 수동
  - id: s3
    section: skills
    name: 3스킬 「'나의 바다'」 (특화 3)
    text: "연금 유닛을 최대 4명에게 투척합니다. 23초간 적 공격력 -15%·방어력 -35%·마법 저항 -35% 및 매초 공격력 210% 마법 피해. 15초 후 감소 효과는 -30%·-50%·-50%, 매초 피해는 390%까지 증가합니다."
    values:
      SP 소모: "60"
      초기 SP: "48"
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「심상」
    text: 공격력 +10%, 공격 범위 내에 다른 오퍼레이터 존재 시 자신이 투척한 연금 유닛의 지속 시간 +3초
  - id: talent-2
    section: talents
    name: 2재능 「시야」
    text: 배치되어 있을 때, 모든 아군 유닛의 공격 속도 +5, 모든 적 유닛의 공격 속도 -5, 지상의 6칸 이상 이어진 직선 경로에 위치한 아군 및 적은 2배 효과 적용
  - id: module-1
    section: modules
    name: 모듈 ALC-X 「삼면의 금화」 (Lv.3)
    text: 전장에 연금 유닛이 존재할 시 SP 자연 회복 속도 +0.1/초 / 공격력 +15%, 공격 범위 내에 다른 오퍼레이터 존재 시 자신이 투척한 연금 유닛의 지속 시간 +4초
    values:
      HP: "+120"
      공격력: "+50"
