    section: stats
    name: "잠재 보너스 (2~6잠)"
    text: "2잠 배치 코스트 -1 · 3잠 재배치 시간 -6초 · 4잠 공격력 +25 · 5잠 제2재능 강화 · 6잠 배치 코스트 -1"
  - id: s1
    section: skills
    name: "1스킬 「'호위'」 (특화 3)"
    text: "해당 스킬 선택 시 장치가 전방 오퍼레이터의 방어력 증가 / 공격력 +80%, 방어력 +80%, 저지하고 있는 모든 적 동시에 공격, 장치 효과가 전방 오퍼레이터의 저지 가능 수 +1, 방어력 +55%로 변경, 장치는 초당 최대 HP의 2%씩 감소 / 스킬 발동 시 장치 1개 획득"
    values: {"SP 소모": "40", "초기 SP": "28", "지속": "40초", "SP": "자동 회복", "발동": "수동"}
  - id: s2
    section: skills
    name: "2스킬 「'집행'」 (특화 3)"
    text: "해당 스킬 선택 시 장치가 서서히 HP 회복, 장치 활성화 시 0.5초마다 장치의 HP -1, 장치 전방의 오퍼레이터는 SP +1 및 내스티 최대 HP 5%의 보호막획득 / 공격 중지, 즉시 배치된 장치 활성화, 0.5초마다 최대 HP 10%의 보호막 획득 (최대 80%) / 스킬 종료 시 장치 1개 획득"
    values: {"SP 소모": "28", "초기 SP": "23", "지속": "4초", "SP": "자동 회복", "발동": "수동"}
  - id: s3
    section: skills
    name: "3스킬 「보금자리」 (특화 3)"
    text: "해당 스킬 선택 시 원거리 오퍼레이터를 배치 가능하고 버프 효과를 제공하는 특별한 고지대 제작 및 업그레이드 가능 / 공격력 +160%, 방어력 +160%, 엔지니어 장치가 고지대 장치에 주는 HP 및 SP 회복 효과가 2배로 증가 / 스킬 발동 시 장치 1개 획득"
    values: {"SP 소모": "25", "초기 SP": "17", "지속": "15초", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「전방 시공」 (정예2)"
    text: "「지원 장치」 3개 보유(최대 2개 배치), 효과는 스킬 선택에 따라 변경"
  - id: talent-2
    section: talents
    name: "2재능 「안전주의」 (정예2)"
    text: "10%의 가호 효과 획득, 원거리 공격을 하는 적 등장 시 자신과 고지대 오퍼레이터가 15%의 가호 효과 획득 및 6초당 SP +1"
  - id: module-crax
    section: modules
    name: "모듈 CRA-X 「엔지니어들」 (Lv.3)"
    text: "특성: 「지원 장치」의 최대 보유 수량 +1, 배치 코스트 감소 / 재능(전방 시공): 「지원 장치」 3대 보유(최대 2대 배치), 효과는 스킬 선택에 따라 변경, 최초로 배치하는 장치의 배치 코스트 감소, 장치는 공격 범위 내 다른 장치와 함께 효과 제공"
    values: {"HP": "+145", "공격력": "+40", "방어력": "+45"}
