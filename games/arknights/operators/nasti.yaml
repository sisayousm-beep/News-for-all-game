    section: stats
    name: "정예2 Lv.90 능력치 (신뢰도·잠재 제외)"
    values: {"HP": "2,585", "공격력": "614", "방어력": "446", "마법 저항": "0", "배치 코스트": "19", "저지": "2", "공격 간격": "1.5초", "재배치": "70초"}
