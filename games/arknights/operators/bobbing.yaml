id: bobbing
title: 보빙
aliases:
  - Bobbing
summary: 5★ 서포터 · 의식술사. 적심 의료의 보빙, 언제든지 당신의 고민을 들어 줄 준비가 되어 있습니다.
attributes:
  rarity: 5
  class: supporter
  branch: 의식술사
  obtain: standard
  version: "5.0"
topics:
  - id: trait
    section: stats
    name: 특성 (의식술사)
    text: 공격 시 마법 대미지를 입히며, 원소 손상을 입힐 수 있음
  - id: stats-max
    section: stats
    name: 정예2 Lv.80 능력치 (신뢰도·잠재 제외)
    values:
      HP: 1,305
      공격력: "446"
      방어력: "68"
      마법 저항: "15"
      배치 코스트: "15"
      저지: "1"
      공격 간격: 1.6초
      재배치: 70초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      공격력: "+40"
      방어력: "+40"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -4초 · 4잠 공격력 +21 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「비평화적 설득」 (특화 3)
    text: 다음 공격이 공격력의 200%에 해당하는 마법 대미지를 입히고, 추가로 공격력의 120%에 해당하는 소각 손상을 입히며, 원소 손상 미폭발 상태인 적 우선 공격
    values:
      SP 소모: "10"
      초기 SP: "0"
      SP: 자동 회복
      발동: 자동
  - id: s2
    section: skills
    name: 2스킬 「'통행금지'」 (특화 3)
    text: 공격 중지, 적이 위치한 곳에 연소 구역 생성, 구역 안에 있는 모든 지상 적에게 초당 공격력의 140%에 해당하는 마법 대미지를 입히고, 추가로 공격력의 20%에 해당하는 소각 손상을 입힘
    values:
      SP 소모: "24"
      초기 SP: "10"
      지속: 11초
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「초점 유도」
    text: 적을 최초로 공격할 때마다 5초간 목표에게 초당 공격력의 16%에 해당하는 소각 손상을 입힘
  - id: module-1
    section: modules
    name: 모듈 RIT-X 「사회복지학 중고 교재」 (Lv.3)
    text: 정예 및 리더 적에 입히는 원소 손상 +18% / 적을 최초로 공격할 때마다, 5초간 목표에게 초당 공격력의 18%에 해당하는 소각 손상을 입힘
    values:
      공격력: "+35"
      방어력: "+30"
