    section: stats
    name: "특성 (매복자)"
    text: "공격 범위 내 모든 적 동시 공격 / 50%의 물리 및 마법 회피 보유, 적의 공격을 쉽게 받지 않음"
  - id: stats-max
    section: stats
    name: "정예2 Lv.80 능력치 (신뢰도·잠재 제외)"
    values: {"HP": "1,729", "공격력": "809", "방어력": "331", "마법 저항": "30", "배치 코스트": "22", "저지": "0", "공격 간격": "3.5초", "재배치": "80초"}
  - id: trust
    section: stats
    name: "신뢰도 100% 보너스"
    values: {"HP": "+200", "공격력": "+30", "방어력": "+30"}
  - id: potential
    section: stats
    name: "잠재 보너스 (2~6잠)"
    text: "2잠 배치 코스트 -1 · 3잠 재배치 시간 -10초 · 4잠 배치 코스트 -1 · 5잠 제2재능 강화 · 6잠 배치 코스트 -1"
  - id: s1
    section: skills
    name: "1스킬 「전율의 현」 (특화 3)"
    text: "5연 공격을 시전하여, 공격 범위 내 지상의 적에게 회당 공격력 70% 마법 대미지 / 다른 Ave Mujica 멤버가 스킬 발동 시 추가로 1회 발동 / 2회 충전 가능"
    values: {"SP 소모": "4", "초기 SP": "0", "지속": "2.1초", "SP": "공격 회복", "발동": "수동"}
  - id: s2
    section: skills
    name: "2스킬 「머물 곳 없는 자」 (특화 3)"
    text: "즉시 공격 범위 내 적에게 1.5초간 공포 효과 부여, 공격 범위 내 적에게 초당 공격력 100% 마법 대미지를 입히고, 제1재능의 정지 효과 확률이 2.2배로 증가"
    values: {"SP 소모": "40", "초기 SP": "25", "지속": "15초", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「직업인」 (정예2)"
    text: "야하타 우미리의 대미지를 받은 적이 21% 확률로 3초간 정지, 스킬 지속 시간 동안 야하타 우미리의 공격 범위 확대"
  - id: talent-2
    section: talents
    name: "2재능 「공포가 두렵지 않으리」 (정예2)"
    text: "적에게 정지, 공포 효과 부여 시 Fever +2 / 배치되어 있을 때 Ave Mujica 멤버가 정지, 공포 상태인 적에게 입히는 대미지 +10%"
  - id: module-amby
    section: modules
    name: "모듈 AMB-Y 「오버트레이닝」 (Lv.3)"
    text: "특성: 공격 범위 내 모든 적 동시 공격 / 65%의 물리 및 마법 회피 보유, 쉽게 적의 목표가 되지 않음 / 재능(직업인): 야하타 우미리의 대미지를 받은 적이 30% 확률로 3초간 정지, 스킬 지속 시간 동안 야하타 우미리의 공격 범위 확대"
    values: {"HP": "+145", "공격력": "+70", "공격 속도": "+7"}
