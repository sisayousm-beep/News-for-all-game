id: yahata-umiri
title: "야하타 우미리"
aliases: ["Yahata Umiri"]
summary: "5★ 스페셜리스트 · 매복자. Ave Mujica의 베이시스트 야하타 우미리. 냉정하고 사려 깊으며, 약 30개 밴드의 베이시스트를 겸임하고 있습니다."
attributes:
  rarity: 5
  class: specialist
  branch: "매복자"
  obtain: event
  version: "6.0"
