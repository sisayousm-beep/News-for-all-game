    section: skills
    name: "1스킬 「적소·분야」 (특화 3)"
    text: "공격력 +120%, 공격이 2연 공격으로 변경, 공격이 적의 특수 능력 무효화, 스킬이 종료할 때까지 지속"
    values: {"SP 소모": "20", "초기 SP": "10", "지속": "18초", "SP": "자동 회복", "발동": "수동"}
  - id: s2
    section: skills
    name: "2스킬 「적소·절영-치」 (특화 3)"
    text: "주변의 가장 가까운 적 1명에게 10회 참격 발동, 참격당 공격력 480% 마법 대미지, 적 처치 시 참격은 목표 주변의 가장 가까운 다른 적에게 전이되며, 남은 공격 횟수 +1. 참격 종료 시 목표를 처치하지 못했고 상대의 위치에 배치 가능하면, 해당 위치로 이동, 그렇지 않으면 원래 위치로 복귀. 이후 공격력 +300%, 물리 및 마법 회피 +60%"
    values: {"SP 소모": "20", "초기 SP": "15", "지속": "6초", "SP": "자동 회복", "발동": "수동"}
  - id: s3
    section: skills
    name: "3스킬 「적소·천위」 (특화 3)"
    text: "스킬 발동 시 전방으로 방향 전환이 가능한 검기 발사, 관통한 적에게 대상 현재 HP 6% 마법 대미지(최소 공격력 580% 마법 대미지). 공격 범위 확대, 공격할 때마다 지상 적 최대 4명에게 공격력 210% 마법 대미지를 3회 입힘"
    values: {"SP 소모": "25", "초기 SP": "18", "지속": "20초", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「형의통찰」 (정예2)"
    text: "공격력 +13%, 공격 속도 +13, 대미지 유형이 약점 대미지로 변경"
  - id: talent-2
    section: talents
    name: "2재능 「한서각지」 (정예2)"
    text: "대미지를 받지 않을 시 7초마다 일정량(공격력의 30%~160%)의 HP 회복하고, 다음 물리 및 마법 공격 회피"
  - id: module-aftx
    section: modules
    name: "모듈 AFT-X 「기억의 잔편」 (Lv.3)"
    text: "특성: 적을 저지하고 있지 않을 때 공격 속도 +8 / 재능(한서각지): 대미지를 받지 않을 시 6초마다 일정량(공격력의 50%~200%)의 HP 회복하고, 다음 물리 및 마법 공격 회피"
    values: {"HP": "+420", "공격력": "+60"}
