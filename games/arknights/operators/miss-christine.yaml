id: miss-christine
title: 미스 크리스틴
aliases:
- Miss.Christine
summary: 5★ 캐스터 · 프라이멀 캐스터. 우아하고 신비로운 미스 크리스틴, 로도스 아일랜드에 잠시 더 머물기로 했습니다.
attributes:
  rarity: 5
  class: caster
  branch: 프라이멀 캐스터
  obtain: event
  version: '5.5'
topics:
- id: trait
  section: stats
  name: 특성 (프라이멀 캐스터)
  text: 공격 시 마법 대미지를 입히며, 원소 대미지를 입힐 수 있음
- id: stats-max
  section: stats
  name: 정예2 Lv.80 능력치 (신뢰도·잠재 제외)
  values:
    HP: 1,324
    공격력: '575'
    방어력: '117'
    마법 저항: '15'
    배치 코스트: '22'
    저지: '1'
    공격 간격: 1.6초
    재배치: 80초
- id: trust
  section: stats
  name: 신뢰도 100% 보너스
  values:
    공격력: '+65'
- id: potential
  section: stats
  name: 잠재 보너스 (2~6잠)
  text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -10초 · 4잠 배치 코스트 -1 · 5잠 재능 강화 · 6잠 배치 코스트 -1
- id: s1
  section: skills
  name: 1스킬 「식사 에티켓」 (특화 3)
  text: 공격력 +50%, 동시에 목표 2개 공격, 공격 시 마법 대미지의 15%에 해당하는 신경 손상을 입힘
  values:
    SP 소모: '30'
    초기 SP: '15'
    지속: 25초
    SP: 자동 회복
    발동: 수동
- id: s2
  section: skills
  name: 2스킬 「과음의 연회」 (특화 3)
  text: 공격 중지, 목표의 위치에 감지의 영체 발동, 감지의 영체는 초당 주변의 모든 적에게 공격력의 115%에 해당하는 마법 대미지를 입히고, 신경 손상 폭발 상태인 목표에게 추가로 공격력의 115%에 해당하는 원소 대미지를 입힘
  values:
    SP 소모: '35'
    초기 SP: '15'
    지속: 20초
    SP: 자동 회복
    발동: 수동
- id: talent-1
  section: talents
  name: 1재능 「진수성찬」
  text: 공격 범위 내 마비 상태인 적에게 즉시 공격력의 120%에 해당하는 원소 대미지를 입힘
- id: module-1
  section: modules
  name: 모듈 PRI-X 「'검은색' 자판기」 (Lv.3)
  text: 원소 폭발 상태인 적에게 입히는 대미지가 110%로 증가 / 마비 상태인 목표를 공격할 시 공격력이 120%로 증가, 공격 범위 내 마비 상태인 적에게 즉시 공격력의 140%에 해당하는 원소 대미지를 입힘
  values:
    HP: '+80'
    공격력: '+65'
