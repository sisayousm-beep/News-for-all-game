    text: "2잠 배치 코스트 -1 · 3잠 재배치 시간 -4초 · 4잠 공격력 +24 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1"
  - id: s1
    section: skills
    name: "1스킬 「가주의 여유」 (특화 3)"
    text: "다음 공격이 공격력 250% 물리 대미지를 2회 입힘"
    values: {"SP 소모": "3", "초기 SP": "0", "SP": "공격 회복", "발동": "자동"}
  - id: s2
    section: skills
    name: "2스킬 「참모의 수단」 (특화 3)"
    text: "공격 범위 확대, 공격 속도 +80, 공격할 때마다 목표 3명에게 공격력 200% 물리 대미지, 스킬 지속시간 동안 제1재능의 방어력 감소 효과가 최대 8회 중첩으로 변경, 중첩 수 최대 달성 시 목표에게 지속적인 정지 효과 부여"
    values: {"SP 소모": "22", "초기 SP": "14", "지속": "22초", "SP": "자동 회복", "발동": "수동"}
  - id: s3
    section: skills
    name: "3스킬 「청산」 (특화 3)"
    text: "공격력 +170%, 공격 속도 +50, 공격 시 50% 확률로 공격력 185% 물리 대미지. 스킬 발동 후 즉시 자신 주변의 일정 범위 내 지상 목표를 1명 선택, 만약 목표 위치에 배치 가능한 경우 즉시 해당 위치로 이동하여 목표를 공격. 자신이 공격한 정예, 리더 적이 쓰러지거나 자신이 1초간 공격하지 않을 경우 목표를 다시 선택 / 치명상을 입어도 퇴각하지 않으며, 스킬 종료 시 원래 위치로 복귀"
    values: {"SP 소모": "35", "초기 SP": "27", "지속": "30초", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「패밀리의 수법」 (정예2)"
    text: "공격 시 10초간 목표의 방어력 -7%(최대 5회 중첩), 목표의 HP 비율이 낮을수록 목표에게 입히는 대미지 증가, HP 비율이 20% 이하일 시 대미지가 최대 128%까지 증가"
  - id: talent-2
    section: talents
    name: "2재능 「거리의 직감」 (정예2)"
    text: "물리 및 마법 회피 +40%, 배치 후 80%로 증가, 이후 20초간 점차 감소"
  - id: module-fgty
    section: modules
    name: "모듈 FGT-Y 「실용적인 도구」 (Lv.3)"
    text: "특성: 적 1명 저지 가능, HP가 50%보다 높을 때 공격 속도 +10 / 재능(패밀리의 수법): 공격 시 10초간 목표의 방어력 -8%(최대 5회 중첩), 목표의 HP 비율이 낮을수록 목표에게 입히는 대미지 증가, HP 비율이 20% 이하일 시 대미지가 최대 142%까지 증가"
    values: {"HP": "+230", "공격력": "+80"}
