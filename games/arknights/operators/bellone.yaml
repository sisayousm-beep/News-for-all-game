id: bellone
title: "벨로네"
aliases: ["Bellone"]
summary: "6★ 가드 · 파이터. 과거 벨로네 패밀리의 도련님 레온투초를 보좌하던 참모 드미트리. 지금은 벨로네 패밀리의 가주가 되었습니다."
