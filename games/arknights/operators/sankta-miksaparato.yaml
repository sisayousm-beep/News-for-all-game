id: sankta-miksaparato
title: 산크타 믹사파라토
aliases:
  - Sankta Miksaparato
summary: 6★ 디펜더 · 센트리 프로텍터. 총기사 산크타 믹사파라토, 항상 떠들썩한 곳을 찾아다닙니다.
attributes:
  rarity: 6
  class: defender
  branch: 센트리 프로텍터
