  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      공격력: "+60"
      방어력: "+60"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -10초 · 4잠 배치 코스트 -1 · 5잠 제2재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「총기사 시험관」 (특화 3)
    text: 다음 공격이 3연 공격으로 변경, 공격할 때마다 공격력의 190%에 해당하는 물리 대미지를 입히며, 주변의 탄약류 스킬을 발동한 [라테라노] 오퍼레이터 1명에게 탄약 1발 재장전
    values:
      SP 소모: "4"
      초기 SP: "3"
      SP: 피격 회복
      발동: 자동
  - id: s2
    section: skills
    name: 2스킬 「여덟팔 전기톱맨」 (특화 3)
    text: 공격력 +150%, 방어력 +130%, 스킬 지속 시간 동안 치명상을 입을 경우 즉시 탄약 20발을 소모해 해당 대미지 무효화 스킬 발동 시 50발의 탄약이 장전되며, 탄약 소진 시 스킬
      종료(수동 종료 가능)
    values:
      SP 소모: "50"
      초기 SP: "35"
      SP: 자동 회복
      발동: 수동
  - id: s3
    section: skills
    name: 3스킬 「은퇴 전 포교」 (특화 3)
    text: 스킬 발동 시 다른 모든 [라테라노] 오퍼레이터에게 탄약 4발 재장전, 공격 범위 확대, 최대 HP +80%, 공격력 +220%, 방어력 +80%, 공격 중지, 공격을 받을 시 공격 범위 내 적
      최대 3명에게 1회 반격, 반격의 최소 딜레이는 실제 공격 딜레이의 10% 스킬 발동 시 30발의 탄약이 장전되며, 탄약 소진 시 스킬 종료(수동 종료 가능)
    values:
      SP 소모: "35"
      초기 SP: "25"
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「소탕 환영식」
    text: 대미지를 입힐 때마다 10초간 방어력 +30 및 공격 속도 +3, 최대 3회 중첩
  - id: talent-2
    section: talents
    name: 2재능 「방패 환송식」
    text: 8초간 공격하지 않으면 최대 HP의 15%에 해당하는 보호막 획득, 보호막이 사라지면 카운트 재시작
  - id: module-1
    section: modules
    name: 모듈 SPT-X 「갑옷 청소용 브러시 세트」 (Lv.3)
    text: 공격 범위 내 적의 은신 효과 무효화 / 대미지를 입힐 때마다 10초간 방어력 +50 및 공격 속도 +5, 최대 3회 중첩. 최대 중첩 시 전장 내 모든 [라테라노] 오퍼레이터의 공격 속도가 전투
      시작 시의 공격 속도보다 낮아지지 않음
    values:
      HP: "+280"
      공격력: "+54"
      방어력: "+43"
