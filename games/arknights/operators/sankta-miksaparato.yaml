    section: stats
    name: 특성 (센트리 프로텍터)
    text: 적 3명 저지 가능, 원거리 공격 가능
  - id: stats-max
    section: stats
    name: 정예2 Lv.90 능력치 (신뢰도·잠재 제외)
    values:
      HP: 3,677
      공격력: "504"
      방어력: "703"
