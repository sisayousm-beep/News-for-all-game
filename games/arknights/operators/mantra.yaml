id: mantra
title: "만트라"
aliases: ["Mantra"]
summary: "6★ 캐스터 · 프라이멀 캐스터. 과묵한 정예 오퍼레이터 만트라. 필요할 때면 언제든지 당신의 곁을 '함께' 지켜줄 것입니다."
attributes:
  rarity: 6
  class: caster
  branch: "프라이멀 캐스터"
  obtain: standard
  version: "6.0"
