id: narantuya
title: 나란투야
aliases:
- Narantuya
summary: 6★ 스나이퍼 · 루프슈터. 붉은 나이츠모라 나란투야. 자신만의 '천도'를 걷고 있습니다.
attributes:
  rarity: 6
  class: sniper
  branch: 루프슈터
  obtain: standard
  version: '5.0'
topics:
- id: trait
  section: stats
  name: 특성 (루프슈터)
  text: 부메랑 투사체를 보유한 경우에만 공격 가능 (투사체 회수 필요)
- id: stats-max
  section: stats
  name: 정예2 Lv.90 능력치 (신뢰도·잠재 제외)
  values:
    HP: 2,500
    공격력: '675'
    방어력: '170'
    마법 저항: '0'
    배치 코스트: '16'
    저지: '1'
    공격 간격: 1초
    재배치: 70초
- id: trust
  section: stats
  name: 신뢰도 100% 보너스
  values:
    공격력: '+90'
- id: potential
  section: stats
  name: 잠재 보너스 (2~6잠)
  text: 2잠 배치 코스트 -1 · 3잠 제2재능 강화 · 4잠 공격력 +27 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1
- id: s1
  section: skills
  name: 1스킬 「회전 칼날」 (특화 3)
  text: '초기 상태와 다음 상태 간 전환 가능: 공격 거리 -1, 부메랑 투사체가 공격력의 190%에 해당하는 물리 대미지를 입히고, 적 사이를 튕김 (최대 3회 튕김)'
  values:
    SP 소모: '5'
    초기 SP: '0'
    SP: 자동 회복
    발동: 수동
- id: s2
  section: skills
  name: 2스킬 「악몽」 (특화 3)
  text: 공격할 때마다 공격력의 250%에 해당하는 물리 대미지를 입히고, 목표를 1초간 정지시킴. 투사체는 목표 명중 시 잠깐 전진했다가 다시 회수되며, 회수하는 동안 관통한 적에게 공격력의 200%에 해당하는 물리 대미지를 입힘
  values:
    SP 소모: '15'
    초기 SP: '8'
    지속: 30초
    SP: 공격 회복
    발동: 수동
- id: s3
  section: skills
  name: 3스킬 「탄일」 (특화 3)
  text: 투사체 3개로 각각 공격력 175%의 물리 피해를 줍니다. 모두 회수하면 주변 8칸 내 적 최대 3명에게 공격력 160%의 물리 피해와 1초 정지를 줍니다.
  values:
    SP 소모: '30'
    초기 SP: '20'
    지속: 20초
    SP: 자동 회복
    발동: 수동
- id: talent-1
  section: talents
  name: 1재능 「'본 것, 얻은 것'」
  text: 배치되어 있을 때, 공격이 적에게 명중할 때마다 공격력 25(최대 250), 방어력 20(최대 200) 탈취
- id: talent-2
  section: talents
  name: 2재능 「아리따운 허상」
  text: 물리 및 마법 회피 +35%, 주변 8칸 내 적의 물리 및 마법 명중률 -20%
- id: module-1
  section: modules
  name: 모듈 LPS-X 「'모래에 묻힌 것'」 (Lv.3)
  text: 주변 8칸의 적 공격 시 공격력이 110%로 증가 / 배치되어 있을 때, 공격이 적에게 명중할 때마다 공격력 25(최대 300), 방어력 20(최대 240) 탈취, 주변 8칸의 적 공격 시 2회 탈취
  values:
    공격력: '+45'
    방어력: '+45'
