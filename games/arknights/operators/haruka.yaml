id: haruka
title: "하루카"
aliases: ["Haruka"]
summary: "6★ 서포터 · 비호자. 극동에서 온 하루카. 로도스 아일랜드에서 자신만의 시간을 보내기를 희망하고 있습니다."
attributes:
  rarity: 6
  class: supporter
  branch: "비호자"
  obtain: standard
  version: "6.0"
