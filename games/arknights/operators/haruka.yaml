    section: stats
    name: "특성 (비호자)"
    text: "공격 시 마법 대미지를 입히며, 스킬 발동 후 아군 치료로 변경 (치유량은 공격력의 75%에 해당)"
  - id: stats-max
    section: stats
    name: "정예2 Lv.90 능력치 (신뢰도·잠재 제외)"
    values: {"HP": "1,887", "공격력": "480", "방어력": "178", "마법 저항": "25", "배치 코스트": "13", "저지": "1", "공격 간격": "1.6초", "재배치": "70초"}
  - id: trust
    section: stats
    name: "신뢰도 100% 보너스"
    values: {"HP": "+350", "공격력": "+55"}
  - id: potential
    section: stats
    name: "잠재 보너스 (2~6잠)"
    text: "2잠 배치 코스트 -1 · 3잠 재배치 시간 -6초 · 4잠 공격력 +25 · 5잠 제2재능 강화 · 6잠 배치 코스트 -1"
  - id: s1
    section: skills
    name: "1스킬 「밤의 파울비스트」 (특화 3)"
    text: "공격 속도 +60, 스킬 지속 시간 동안 비눗방울이 파괴될 시 즉시 주변 8칸 내 비눗방울이 없는 아군 유닛 1명에게 비눗방울 부여"
    values: {"SP 소모": "25", "초기 SP": "15", "지속": "20초", "SP": "자동 회복", "발동": "수동"}
  - id: s2
    section: skills
    name: "2스킬 「틈새의 반딧불」 (특화 3)"
    text: "치료 목표 수 +1, 제1재능의 목표 수 +1, 아군 유닛이 하루카에게 치료받을 시 주변의 적 3명에게 치유량 200%에 해당하는 마법 대미지 / 2회차부터 공격력 +40%, 무한 지속"
    values: {"SP 소모": "17", "초기 SP": "0", "지속": "26초", "SP": "자동 회복", "발동": "수동"}
  - id: s3
    section: skills
    name: "3스킬 「늦여름의 린수」 (특화 3)"
    text: "공격력 +55%, 공격 범위 확대, 공격 딜레이 감소, 스킬 지속 시간 동안 비눗방울이 제공하는 가호 효과가 2배로 증가. 아군 비눗방울을 공격한 적을 4초간 공중 부양시키고, 공중 부양 상태인 적에게 초당 하루카의 공격력 80%에 해당하는 마법 대미지"
    values: {"SP 소모": "60", "초기 SP": "53", "지속": "40초", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「빛나는 비눗방울」 (정예2)"
    text: "공격 딜레이마다 범위 내 아군 유닛 1명에게 30%의 가호 효과를 보유한 비눗방울 부여, 비눗방울은 적에게 대미지를 받으면 잠시 후 파괴됨"
  - id: talent-2
    section: talents
    name: "2재능 「솟구치는 불꽃」 (정예2)"
    text: "비눗방울이 파괴될 시 비눗방울을 보유하고 있던 유닛의 HP를 하루카의 공격력 25%만큼 회복"
  - id: module-blsy
    section: modules
    name: "모듈 BLS-Y 「뒤늦은 기념」 (Lv.3)"
    text: "특성: 공격 시 2명의 목표에게 마법 대미지를 입히며, 스킬 발동 후 아군 2명 치료로 변경 (치유량은 공격력의 75%에 해당) / 재능(솟구치는 불꽃): 비눗방울이 파괴될 시 비눗방울을 보유하고 있던 유닛의 HP를 하루카의 공격력 25%만큼 회복, 20% 확률로 SP +1"
    values: {"HP": "+210", "공격력": "+52"}
