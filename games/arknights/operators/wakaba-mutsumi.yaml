  - id: s1
    section: skills
    name: "1스킬 「다두의 괴수」 (특화 3)"
    text: "방어력 +120%, 저지 가능 수 +2, 더 쉽게 적의 공격 목표가 되며, 스킬 지속 시간 동안 쓰러질 경우 「대역」으로 교체해 퇴각할 때까지 적을 저지하며 본체의 스킬 효과 획득"
    values: {"SP 소모": "20", "초기 SP": "15", "지속": "15초", "SP": "자동 회복", "발동": "수동"}
  - id: s2
    section: skills
    name: "2스킬 「파괴와 재생」 (특화 3)"
    text: "공격 범위 확대, 공격 딜레이 약간 감소, 공격이 공격력 120% 마법 대미지를 입히는 3연 공격으로 변경, 공격 범위 내 목표를 랜덤으로 공격, 적을 공격할 때마다 자신은 20의 마법 대미지를 받음"
    values: {"SP 소모": "25", "초기 SP": "11", "지속": "15초", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「또 다른 '그녀'」 (정예2)"
    text: "와카바 무츠미와 「대역」이 받는 물리 및 마법 대미지의 30%가 절반의 쇠약 손상으로 전환, 「대역」은 공격하지 않으며, 방어력 +20%, Ave Mujica 멤버가 공격 시 20% 확률로 「대역」의 지속 시간 -1초"
  - id: talent-2
    section: talents
    name: "2재능 「죽음이 두렵지 않으리」 (정예2)"
    text: "자신이 대미지 또는 손상을 받으면 Fever +3, 배치되어 있을 때 Ave Mujica 멤버의 최대 HP +10%"
  - id: module-pumy
    section: modules
    name: "모듈 PUM-Y 「새로운 친구들」 (Lv.3)"
    text: "특성: 치명상을 입어도 퇴각하지 않고 「대역」을 교체 투입하며(저지 가능 수 0, HP 상승), 20초 후 다시 본체로 교체 / 재능(또 다른 '그녀'): 와카바 무츠미와 「대역」이 받는 물리 및 마법 대미지의 30%가 절반의 쇠약 손상으로 전환, 「대역」은 공격하지 않으며, 방어력 +26%, Ave Mujica 멤버가 공격 시 20% 확률로 「대역」의 지속 시간 -1초"
    values: {"HP": "+280", "방어력": "+55"}
