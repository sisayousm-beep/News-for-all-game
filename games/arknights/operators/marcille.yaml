id: marcille
title: 마르실
aliases:
  - Marcille
summary: 6★ 캐스터 · 스플래시 캐스터. 마법사 마르실. 마술학교 창립 이래 최고의 수재.
attributes:
  rarity: 6
  class: caster
  branch: 스플래시 캐스터
  obtain: collab
  version: "5.0"
topics:
  - id: trait
    section: stats
    name: 특성 (스플래시 캐스터)
    text: 공격 시 광역 마법 대미지를 입힘
  - id: stats-max
    section: stats
    name: 정예2 Lv.90 능력치 (신뢰도·잠재 제외)
    values:
      HP: 1,805
      공격력: "914"
      방어력: "130"
      마법 저항: "20"
      배치 코스트: "34"
      저지: "1"
      공격 간격: 2.9초
      재배치: 70초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      공격력: "+110"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 제1재능 강화 · 4잠 공격력 +34 · 5잠 재배치 시간 -6초 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「수재의 실력」 (특화 3)
    text: 짧은 영창 후 스킬 발동, 공격할 때마다 마력 2 소모, 공격력 +140%, 공격 목표가 없을 시 아군 오퍼레이터 치료 수동 종료 가능
    values:
      SP 소모: "80"
      초기 SP: "25"
      SP: 자동 회복
      발동: 수동
  - id: s2
    section: skills
    name: 2스킬 「사역마 소환」 (특화 3)
    text: 11초간 영창 후, 마력을 35 소모해 사역마를 소환하고 사역마로 공격. 공격력 +100%, 공격 시 모든 적을 0.5초간 정지시킴 2번째로 스킬 발동 시 더 강력한 사역마 소환, 공격 거리
      +1, 공격 속도 +60, 공격이 주요 목표를 0.5초간 기절시킴 무한 지속, 첫 번째 발동은 수동 종료 가능
    values:
      SP 소모: "80"
      초기 SP: "10"
      SP: 자동 회복
      발동: 자동
  - id: s3
    section: skills
    name: 3스킬 「폭파 마법」 (특화 3)
    text: 5초간 영창 후, 마력을 8 소모해 정면에 폭발을 일으켜 주변 적에게 공격력의 390%에 해당하는 마법 대미지를 입힘. 고지대가 폭발 범위에 있을 경우 주변 적을 4초간 기절시킴 10초간 추가로
      영창 가능, 영창 완료 후 남은 모든마력 소모, 추가로 소모한 마력 8당 폭발 횟수가 1회 증가 수동으로 추가 영창 종료 가능
    values:
      SP 소모: "80"
      초기 SP: "40"
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「학교 창립 이래 최고의 수재」
    text: 스킬이 마력을 소모하는 대신 상시 발동 가능, 마력은 자연 회복되지 않으며, 퇴각 시 초당 1 회복, 마력 보유 시 공격력 +20%, 스플래시 공격의 범위 확대
  - id: talent-2
    section: talents
    name: 2재능 「믿음직한 동료」
    text: 초기 마력 +25, 편성에 [라이오스 파티] 오퍼레이터가 4명 존재 시 모든 [라이오스 파티] 오퍼레이터의 공격 속도 +25, 방어력 +35%
  - id: module-1
    section: modules
    name: 모듈 SPC-Y 「수재의 장서」 (Lv.3)
    text: 배치 코스트 감소 / 초기 마력 +40, 편성에 [라이오스 파티] 오퍼레이터가 4명 존재 시 모든 [라이오스 파티] 오퍼레이터의 공격 속도 +25, 방어력 +35%
    values:
      cost: +-8
      공격력: "+82"
      attack_speed: "+7"
