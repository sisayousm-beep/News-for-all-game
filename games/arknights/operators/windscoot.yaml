id: windscoot
title: 윈드스쿠트
aliases:
  - Windscoot
summary: 4★ 가드 · 해방자. 강호를 주유하는 호송원 윈드스쿠트. 허리춤의 두 칼은 거의 뽑지 않습니다. 부득이한 경우가 아니라면.
attributes:
  rarity: 4
  class: guard
  branch: 해방자
  obtain: standard
  version: "5.5"
topics:
  - id: trait
    section: stats
    name: 특성 (해방자)
    text: 저지 가능 수 0, 평소 공격하지 않음. 40초에 걸쳐 공격력이 최대 +200%까지 증가하며 스킬 종료 후 초기화됩니다.
  - id: stats-max
    section: stats
    name: 정예2 Lv.70 능력치 (신뢰도·잠재 제외)
    values:
      HP: 3,355
      공격력: "290"
      방어력: "486"
      마법 저항: "15"
      배치 코스트: "10"
      저지: "3"
      공격 간격: 1.2초
      재배치: 70초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      HP: "+300"
      공격력: "+30"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -4초 · 4잠 공격력 +25 · 5잠 재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「공격으로 방어」 (특화 3)
    text: 공격 속도 +50, 방어력 +55%
    values:
      SP 소모: "18"
      초기 SP: "10"
      지속: 15초
      SP: 자동 회복
      발동: 수동
  - id: s2
    section: skills
    name: 2스킬 「무허발」 (특화 3)
    text: 공격 범위 확대, 동시에 목표 2개 공격, 공격할 때마다 공격력의 200%에 해당하는 물리 대미지를 입히며, 해당 공격은 회피 불가
    values:
      SP 소모: "40"
      초기 SP: "15"
      지속: 25초
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「숨겨진 날카로움」
    text: 특성의 공격력이 최대치로 증가했을 경우, 공격할 때마다 공격력의 40%에 해당하는 추가 대미지를 입힘
  - id: module-1
    section: modules
    name: 모듈 LIB-X 「'의'」 (Lv.3)
    text: 배치 후 +100% 효과 적용 / 특성의 공격력이 최대치로 증가했을 경우, 공격할 때마다 공격력의 52%에 해당하는 추가 대미지를 입힘
    values:
      HP: "+230"
      공격력: "+22"
      방어력: "+25"
