id: silverash-the-reignfrost
title: "실버애쉬 더 레인프로스트"
aliases: ["SilverAsh the Reignfrost"]
summary: "6★ 뱅가드 · 책사. 평범한 쉐라그 공민. 로도스 아일랜드와 재계약을 맺고 다시금 전장으로 뛰어듭니다."
attributes:
  rarity: 6
  class: vanguard
  branch: "책사"
  obtain: limited
  version: "6.0"
topics:
  - id: trait
    section: stats
    name: "특성 (책사)"
    text: "적 2명 저지 가능, 배치 구역의 아군 유닛 지원 가능"
  - id: stats-max
    section: stats
    name: "정예2 Lv.90 능력치 (신뢰도·잠재 제외)"
    values: {"HP": "2,218", "공격력": "618", "방어력": "397", "마법 저항": "15", "배치 코스트": "13", "저지": "2", "공격 간격": "1.2초", "재배치": "70초"}
  - id: trust
    section: stats
    name: "신뢰도 100% 보너스"
    values: {"HP": "+100", "공격력": "+35", "방어력": "+40"}
  - id: potential
    section: stats
    name: "잠재 보너스 (2~6잠)"
    text: "2잠 배치 코스트 -1 · 3잠 방어력 +25 · 4잠 최대 HP +180 · 5잠 제2재능 강화 · 6잠 배치 코스트 -1"
  - id: s1
    section: skills
    name: "1스킬 「대응 계책」 (특화 3)"
    text: "배치 코스트 10 즉시 획득, 배치 구역 내 '눈보라의 눈'과 가장 가까운 오퍼레이터의 배치 코스트 -5 (오른쪽의 가드/캐스터/스나이퍼 우선). 배치 후 실버애쉬 더 레인프로스트 최대 HP 50% 보호막 획득"
    values: {"SP 소모": "29", "초기 SP": "19", "SP": "자동 회복", "발동": "자동"}
  - id: s2
    section: skills
    name: "2스킬 「적을 막는 예봉」 (특화 3)"
    text: "전방 6명의 적에게 공격력 380% 물리 대미지를 입히고, 6초간 냉기 효과 부여 및 은신 효과 무효화. 배치 구역 내 '눈보라의 눈'과 가장 가까운 오퍼레이터의 배치 코스트 -11 (오른쪽의 가드/캐스터/스나이퍼 우선). '눈보라의 눈' 왼쪽에 있는 모든 오퍼레이터를 배치할 시 자신의 공격력에 해당하는 범위 공격 1회 발동 (최대 2회 중첩) / 2회 충전 가능"
    values: {"SP 소모": "17", "초기 SP": "9", "SP": "자동 회복", "발동": "수동"}
  - id: s3
    section: skills
    name: "3스킬 「변혁의 도래」 (특화 3)"
    text: "공격 범위 확대, 적의 은신 효과 무효화, 공격 시 직선 범위 내 적에게 공격력 200% 물리 대미지를 입히고 30%의 취약 효과 부여. 배치 코스트 9 즉시 획득, 이후 지속해서 24 획득 / 최초 발동 시 배치 구역 내 배치 코스트가 가장 높은 오퍼레이터와 가장 낮은 오퍼레이터의 초기 배치 코스트 교환 (가드/캐스터/스나이퍼 우선) / 스킬 지속 시간 동안 '눈보라의 눈'이 배치 가능으로 변경"
    values: {"SP 소모": "55", "초기 SP": "46", "지속": "48초", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「오픈 게임」 (정예2)"
    text: "배치되어 있을 때 배치 구역에 '눈보라의 눈' 생성, 배치 코스트 순으로 배치 구역 재정렬. '눈보라의 눈' 왼쪽에 위치한 오퍼레이터와 자신의 초기 SP +4, 다음 재배치 시간 -20%"
  - id: talent-2
    section: talents
    name: "2재능 「히라의 선구자」 (정예2)"
    text: "배치되어 있을 때 [쉐라그] 오퍼레이터가 빙결 상태 면역, 방어력 +60 및 초당 최대 HP의 1.5% 회복. 배치 15초 후 방어력과 HP 회복 효과가 2배로 증가"
