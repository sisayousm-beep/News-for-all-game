id: philae
title: 필라에
aliases:
  - Philae
summary: 5★ 디펜더 · 프라이멀 프로텍터. 사르곤에서 온 독실한 수행자 필라에, 그녀는 수행 여정을 통해 생명의 답을 찾으려 합니다.
attributes:
  rarity: 5
  class: defender
  branch: 프라이멀 프로텍터
  obtain: shop
  version: "5.0"
