    section: stats
    name: 특성 (프라이멀 프로텍터)
    text: 적 3명 저지 가능, 공격 시 원소 손상을 입힐 수 있음
  - id: stats-max
    section: stats
    name: 정예2 Lv.80 능력치 (신뢰도·잠재 제외)
    values:
      HP: 3,227
      공격력: "603"
      방어력: "544"
      마법 저항: "10"
      배치 코스트: "25"
      저지: "3"
      공격 간격: 1.6초
      재배치: 70초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      공격력: "+40"
      방어력: "+40"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -4초 · 4잠 공격력 +25 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「영혼의 강의 보호」 (특화 3)
    text: 최대 HP +90%, 즉시 자신이 받은 원소 손상을 제거하고 1800의 원소 손상 보호막 획득
    values:
      SP 소모: "18"
      초기 SP: "10"
      지속: 15초
      SP: 자동 회복
      발동: 수동
  - id: s2
    section: skills
    name: 2스킬 「죽음의 강의 저주」 (특화 3)
    text: 공격 중지, 최대 HP +50%, 공격을 받을 시 주변의 지상 적에게 공격력의 200%에 해당하는 마법 대미지를 입히고, 추가로 공격력의 25%에 해당하는 쇠약 손상을 입힘(2초마다 1회 발동),
      스킬 지속 시간 동안 원소 손상을 받을 경우, 스킬이 종료할 때까지 공격력 +100%
    values:
      SP 소모: "45"
      초기 SP: "20"
      지속: 40초
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「신성한 강의 전언자」
    text: 자신이 받는 원소 손상 -10%, 쇠약 손상을 받을 때마다 SP 2 회복
  - id: module-1
    section: modules
    name: 모듈 PRP-X 「침묵 속에 닳아버린 날들」 (Lv.3)
    text: 적을 저지하고 있을 때, 자신이 입히는 원소 손상 +15% / 자신이 받는 원소 손상 -20%, 쇠약 손상을 받을 때마다 SP 2 회복
    values:
      HP: "+300"
      공격력: "+70"
