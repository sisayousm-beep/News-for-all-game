  - id: trait
    section: stats
    name: 특성 (비호자)
    text: 공격 시 마법 대미지를 입히며, 스킬 발동 후 아군 치료로 변경 (치유량은 공격력의 76%에 해당)
  - id: stats-max
    section: stats
    name: 정예2 Lv.80 능력치 (신뢰도·잠재 제외)
    values:
      HP: 1,746
      공격력: "423"
      방어력: "181"
      마법 저항: "25"
      배치 코스트: "13"
      저지: "1"
      공격 간격: 1.6초
      재배치: 80초
  - id: trust
    section: stats
    name: 신뢰도 100% 보너스
    values:
      공격력: "+50"
      방어력: "+50"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -10초 · 4잠 배치 코스트 -1 · 5잠 재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「수많은 저서」 (특화 3)
    text: 즉시 공격 범위 내 모든 목표를 1회 치료, 싱주 공격력의 330%에 해당하는 HP 회복
    values:
      SP 소모: "10"
      초기 SP: "8"
      SP: 자동 회복
      발동: 수동
  - id: s2
    section: skills
    name: 2스킬 「정성이 담긴 음식」 (특화 3)
    text: 공격 속도 +50, 목표 1명 추가 치료, 재능 효과가 적용된 목표의 경우 초당 싱주 공격력의 20%에 해당하는 HP 회복
    values:
      SP 소모: "75"
      초기 SP: "60"
      지속: 30초
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「동반자의 우정」
    text: 공격 범위 내 자신을 제외한 2명의 아군이 10%의 가호 효과 획득
  - id: module-1
    section: modules
    name: 모듈 BLS-X 「과거와의 작별」 (Lv.3)
    text: 공격 범위 내 자신을 제외한 2명의 아군이 15%의 가호 효과 획득
    values:
      HP: "+175"
      공격력: "+40"
