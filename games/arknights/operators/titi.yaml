id: titi
title: "티티"
aliases: ["Titi"]
summary: "6★ 메딕 · 주술 메딕. '명예 미노스인'이자 사르곤 바르야반다바드 박물관의 현임 관장 티티. 앞으론 그녀의 직함이 더 많아질지도 모릅니다."
attributes:
  rarity: 6
  class: medic
  branch: "주술 메딕"
  obtain: standard
  version: "6.0"
topics:
  - id: trait
    section: stats
    name: "특성 (주술 메딕)"
    text: "공격 시 마법 대미지를 입히며, 적을 공격할 때마다 공격 범위 내 아군 1명의 HP를 대미지의 50%만큼 회복"
  - id: stats-max
    section: stats
    name: "정예2 Lv.90 능력치 (신뢰도·잠재 제외)"
    values: {"HP": "1,405", "공격력": "548", "방어력": "117", "마법 저항": "20", "배치 코스트": "17", "저지": "1", "공격 간격": "1.6초", "재배치": "70초"}
  - id: trust
    section: stats
    name: "신뢰도 100% 보너스"
    values: {"HP": "+200", "공격력": "+50"}
  - id: potential
    section: stats
    name: "잠재 보너스 (2~6잠)"
    text: "2잠 배치 코스트 -1 · 3잠 제1재능 강화 · 4잠 공격력 +26 · 5잠 배치 코스트 -1 · 6잠 제2재능 강화"
  - id: s1
    section: skills
    name: "1스킬 「부식 지연」 (특화 3)"
    text: "공격력 +100%, 공격할 때마다 50% 확률로 목표에게 3초간 수면 효과 부여"
    values: {"SP 소모": "40", "초기 SP": "18", "지속": "17초", "SP": "자동 회복", "발동": "수동"}
  - id: s2
    section: skills
    name: "2스킬 「밀봉 보호」 (특화 3)"
    text: "공격 중지, 공격력 +180%, 스킬 발동 시 자신과 공격 범위 내 HP 비율이 가장 낮은 오퍼레이터에게 수면 효과 부여, 스킬이 종료할 때까지 지속. 스킬 지속 시간 동안 자신과 목표 주변의 적에게 지속적으로 수면 효과 부여, 제1재능의 효과가 3.3배로 증가 / 수동 종료 가능"
    values: {"SP 소모": "20", "초기 SP": "15", "지속": "15초", "SP": "자동 회복", "발동": "수동"}
  - id: s3
    section: skills
    name: "3스킬 「지난날의 만개」 (특화 3)"
    text: "공격력 +180%, 동시에 목표 2개 공격, 수면 상태가 아닌 적을 공격할 시 상대에게 5초간 수면 효과 부여. 스킬 지속 시간 동안, 전장에 있는 적 중 수면 상태에서 깨어나거나 수면 상태 도중 쓰러진 적에게 마법 대미지를 입히고(수면 시간에 따라 공격력의 460%까지 증가), 주변의 다른 적 1명에게 5초간 수면 효과 부여. 공격 범위 내 다른 아군 오퍼레이터가 치명상을 입을 시 수면 효과 부여, HP가 완전히 회복되거나 스킬이 종료될 때까지 지속"
    values: {"SP 소모": "37", "초기 SP": "28", "지속": "25초", "SP": "자동 회복", "발동": "수동"}
  - id: talent-1
    section: talents
    name: "1재능 「얼어붙은 시간」 (정예2)"
    text: "수면 상태의 적 공격 가능, 이동 중이 아닌 적을 공격할 시 상대에게 추가로 공격력 15% 마법 대미지, 배치되어 있을 때 수면 상태의 적은 초당 티티 공격력 30% 마법 대미지를 받음"
  - id: talent-2
    section: talents
    name: "2재능 「용기의 보상」 (정예2)"
    text: "전장에 배치된 [미노스], [사르곤] 오퍼레이터의 HP가 50%보다 높을 시, 공격 속도 +20의 기운 충만 효과 획득"
  - id: module-incx
    section: modules
    name: "모듈 INC-X 「먼 곳의 선물」 (Lv.3)"
    text: "특성: 공격 시 마법 대미지를 입히고, 적을 공격할 때마다 공격 범위 내 아군 1명의 HP를 대미지의 60%만큼 회복 / 재능(얼어붙은 시간): 수면 상태의 적 공격 가능, 이동 중이 아닌 적을 공격할 시 상대에게 추가로 공격력 30% 마법 대미지, 배치되어 있을 때 수면 상태의 적은 초당 티티 공격력 40% 마법 대미지를 받음"
    values: {"HP": "+150", "공격력": "+53"}
