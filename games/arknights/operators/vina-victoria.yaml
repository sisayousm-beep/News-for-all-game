    초기 SP: '0'
    SP: 자동 회복
    발동: 자동
- id: s2
  section: skills
  name: 2스킬 「고향을 향해」 (특화 3)
  text: '패시브 효과: 제1재능의 효과 범위 내에 아군 유닛이 2명 이상 존재할 경우, 비나의 SP 회복 속도 +0.5/초 액티브 효과: 공격 거리 +1, 공격력 +180%, 공격 목표 수 +1 무한 지속'
  values:
    SP 소모: '70'
    초기 SP: '0'
    SP: 자동 회복
    발동: 자동
- id: s3
  section: skills
  name: 3스킬 「모두 내 이름으로」 (특화 3)
  text: 즉시 제1재능의 효과 범위 내 배치 가능한 지상에 '황금의 맹세' 소환, 스킬 지속 시간 동안 제1재능의 효과 범위 내 아군 유닛이 저지한 적 공격 가능, 공격력 +190%, 공격 목표 수 +3, 공격 딜레이 감소, 공격 시 대미지 유형이 트루 대미지로 변경
  values:
    SP 소모: '50'
    초기 SP: '35'
    지속: 25초
    SP: 자동 회복
    발동: 수동
- id: talent-1
  section: talents
  name: 1재능 「왕들의 탄식」
  text: 자신과 주변 8칸의 아군 유닛이 받는 물리 대미지 -20%, 주변 8칸에 배치된 아군 유닛 1명당 비나 빅토리아의 공격력 +5%
- id: talent-2
  section: talents
  name: 2재능 「거침없는 날카로움」
  text: 적에게 최초로 대미지를 입힐 때마다 목표에게 4초간 전율 효과 부여
- id: module-1
  section: modules
  name: 모듈 AFT-X 「성주의 모험」 (Lv.3)
  text: 적을 저지하고 있지 않을 때 공격 속도 +8 / 자신과 주변 8칸의 아군 유닛이 받는 물리 대미지 -26%, 주변 8칸에 배치된 아군 유닛 1명당 비나 빅토리아의 공격력 +7%
  values:
    HP: '+440'
    공격력: '+56'
- id: module-2
  section: modules
  name: 모듈 AFT-Y 「질서의 성'구'」 (Lv.3)
  text: 자신과 자신의 소환물이 저지한 적에게 10%의 취약 효과 부여 / 적에게 최초로 대미지를 입힐 때마다 목표에게 6초간 전율 효과 부여, 정예 및 리더 적인 경우 12초간 전율 효과 부여, 비나 빅토리아와 소환물이 전율 상태인 목표에게 입히는 대미지 +15%
  values:
    공격력: '+75'
    방어력: '+43'
