  name: 잠재 보너스 (2~6잠)
  text: 2잠 배치 코스트 -1 · 3잠 제2재능 강화 · 4잠 공격력 +28 · 5잠 제1재능 강화 · 6잠 배치 코스트 -1
- id: s1
  section: skills
  name: 1스킬 「영광을 되찾아」 (특화 3)
  text: 다음 공격이 주변 4칸의 모든 지상 적에게 추가로 공격력의 180%에 해당하는 트루 대미지를 입힘
  values:
