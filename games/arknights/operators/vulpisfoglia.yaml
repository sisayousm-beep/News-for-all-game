    values:
      HP: "+150"
      공격력: "+60"
  - id: potential
    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -4초 · 4잠 공격력 +25 · 5잠 제2재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「가벼운 징계」 (특화 3)
    text: 다음 공격이 추가로 공격력의 290%에 해당하는 마법 대미지를 입히고, 배치 코스트 1 획득 3회 충전 가능
    values:
      SP 소모: "4"
      초기 SP: "8"
      SP: 자동 회복
      발동: 자동
  - id: s2
    section: skills
    name: 2스킬 「칼날 낙하 고문」 (특화 3)
    text: 즉시 배치 코스트 7 획득, 주변 최대 6명의 적에게 공격력의 300%에 해당하는 마법 대미지를 입히고, 목표를 5초간 정지시킴, 적이 정지 상태인 경우, 추가로 적을 5초간 기절시킴 2회 충전
      가능
    values:
      SP 소모: "20"
      초기 SP: "20"
      SP: 자동 회복
      발동: 수동
  - id: s3
    section: skills
    name: 3스킬 「은밀한 여우의 예술」 (특화 3)
    text: 스킬 발동 즉시 배치 코스트 9 획득, 공격 거리 +1, 공격력 +110%, 공격 속도가 +180에서 +0까지 점차 감소, 저지하고 있는 모든 적 동시에 공격, 공격할 때마다 적을 0.2초간
      기절시킴 스킬 지속 시간 동안 적을 처치할 경우, 스킬 종료 후 다음 스킬 발동 전까지 위장 효과 획득
    values:
      SP 소모: "18"
      초기 SP: "10"
      지속: 10초
      SP: 자동 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「범인 추적」
    text: 적에게 최초로 대미지를 입힌 후, 10초간 해당 적에게 대미지를 입힐 때마다 추가로 공격력의 30%에 해당하는 마법 대미지를 입힘
  - id: talent-2
    section: talents
    name: 2재능 「힘 비축」
    text: 배치되어 있을 때, 배치 코스트의 자연 회복 속도 +10%, 4초간 대미지를 받지 않으면 초당 최대 HP의 4% 회복
  - id: module-1
    section: modules
    name: 모듈 SOL-X 「킬러의 휴일」 (Lv.3)
    text: 적에게 최초로 대미지를 입힌 후, 10초간 해당 적에게 대미지를 입힐 때마다 추가로 공격력의 40%에 해당하는 마법 대미지를 입힘
    values:
      HP: "+300"
      공격력: "+45"
