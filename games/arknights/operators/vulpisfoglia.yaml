id: vulpisfoglia
title: 불피스폴리아
aliases:
  - Vulpisfoglia
summary: 6★ 뱅가드 · 척후병. 과거 패밀리의 킬러였던 불피스폴리아, 방금 그녀밖에 할 수 없는 임무를 완수했습니다.
