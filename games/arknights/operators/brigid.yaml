    section: stats
    name: 잠재 보너스 (2~6잠)
    text: 2잠 배치 코스트 -1 · 3잠 재배치 시간 -10초 · 4잠 배치 코스트 -1 · 5잠 재능 강화 · 6잠 배치 코스트 -1
  - id: s1
    section: skills
    name: 1스킬 「익숙한 것」 (특화 3)
    text: 다음 공격이 공격력의 130%에 해당하는 물리 대미지를 입히고, 부메랑 투사체가 적 사이를 튕김 (최대 3회 튕김)
    values:
      SP 소모: "2"
      초기 SP: "0"
      SP: 공격 회복
      발동: 자동
  - id: s2
    section: skills
    name: 2스킬 「조련 가능한 것」 (특화 3)
    text: 공격력 +50%, 부메랑 투사체가 명중 후 목표에 계속 부착되어, 목표를 1초간 정지시키고 추가로 4회 타격
    values:
      SP 소모: "25"
      초기 SP: "15"
      지속: 25초
      SP: 공격 회복
      발동: 수동
  - id: talent-1
    section: talents
    name: 1재능 「매듭 고수」
    text: 대미지를 20회 입힌 후 물리 회피 +35%
  - id: module-1
    section: modules
    name: 모듈 LPS-X 「바람의 색깔」 (Lv.3)
    text: 주변 8칸의 적 공격 시 공격력이 110%로 증가 / 대미지를 16회 입힌 후 공격력 +10%, 물리 회피 45% 획득
    values:
      HP: "+210"
      공격력: "+40"
