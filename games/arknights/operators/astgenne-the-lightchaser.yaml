id: astgenne-the-lightchaser
title: "아스트젠 더 라이트체이서"
aliases: ["Astgenne the Lightchaser"]
summary: "6★ 서포터 · 감속자. 서포터 오퍼레이터 아스트젠, 탐구의 길에서 다시 한번 새로운 여정을 시작합니다."
