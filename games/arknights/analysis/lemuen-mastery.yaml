id: lemuen-mastery
title: 르무엔 — 스킬 특화(3특) 효과
kind: stat
version: '5.5'
answer: 1스킬 +17% (최대)
results:
- '특화 3으로 가장 크게 좋아지는 건 1스킬 「재회 인사」: 공격력 배율 180%→210%, SP 10→8 — 종합 약 +17%.'
- '3스킬 「예포 - 강제적인 추모」: 공격력 배율 390%→450%, SP 42→38 — 약 +15%.'
- '2스킬 「귀향의 약속」: 공격력 배율 390%→425%, SP 34→30 — 약 +9%.'
- '스킬 1개 특화 1→3 재료: 스킬개론 제3권 ×35, 결정 회로 ×4 등 (특화 3 기준 1스킬).'
chart:
  title: 7레벨 → 특화 3 스킬 성능 상승 (핵심 수치 × 가동률)
