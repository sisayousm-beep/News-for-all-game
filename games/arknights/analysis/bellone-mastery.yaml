id: bellone-mastery
title: 벨로네 — 스킬 특화(3특) 효과
kind: stat
version: '6.5'
answer: 1스킬 +59% (최대)
results:
- '특화 3으로 가장 크게 좋아지는 건 1스킬 「가주의 여유」: 공격력 배율 210%→250%, SP 4→3 — 종합 약 +59%.'
- '2스킬 「참모의 수단」: 공격력 배율 170%→200%, SP 26→22, 지속 18→22초 — 약 +44%.'
- '3스킬 「청산」: 공격력 배율 150%→185%, SP 39→35 — 약 +31%.'
- '스킬 1개 특화 1→3 재료: 스킬개론 제3권 ×35, 중합젤 ×4 등 (특화 3 기준 1스킬).'
chart:
  title: 7레벨 → 특화 3 스킬 성능 상승 (핵심 수치 × 가동률)
  unit: '%'
  points:
  - label: 1스킬
    value: 58.7
  - label: 2스킬
    value: 43.8
  - label: 3스킬
    value: 30.9
table:
  columns:
  - 스킬
  - 핵심 수치 7→특화3
