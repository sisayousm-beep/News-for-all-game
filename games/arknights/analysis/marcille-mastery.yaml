id: marcille-mastery
title: 마르실 — 스킬 특화(3특) 효과
kind: stat
version: '5.0'
answer: 1스킬 +30% (최대)
results:
- '특화 3으로 가장 크게 좋아지는 건 1스킬 「수재의 실력」: 공격력 +85%→+140% — 종합 약 +30%.'
- '2스킬 「사역마 소환」: 공격력 +70%→+100% — 약 +18%.'
- '3스킬 「폭파 마법」: 공격력 배율 340%→390% — 약 +15%.'
- '스킬 1개 특화 1→3 재료: 스킬개론 제3권 ×35, 정제된 용제 ×4 등 (특화 3 기준 1스킬).'
chart:
  title: 7레벨 → 특화 3 스킬 성능 상승 (핵심 수치 × 가동률)
  unit: '%'
  points:
  - label: 1스킬
    value: 29.7
  - label: 2스킬
    value: 17.6
  - label: 3스킬
    value: 14.7
table:
  columns:
  - 스킬
  - 핵심 수치 7→특화3
  - SP
  - 지속
  - 종합
  rows:
  - - 1스킬 「수재의 실력」
    - 공격력 +85%→+140% (+30%)
    - 80→80
    - '-'
    - +30%
  - - 2스킬 「사역마 소환」
    - 공격력 +70%→+100% (+18%)
    - 80→80
    - '-'
    - +18%
  - - 3스킬 「폭파 마법」
    - 공격력 배율 340%→390% (+15%)
    - 80→80
    - '-'
    - +15%
  note: 종합 = (1+핵심 수치 상승) × 가동률 변화 − 1. 지속형은 가동률 = 지속/(지속+SP), 즉발형은 1/SP로 계산(SP 초당 1 회복 가정). 무한 지속·탄약형은 SP 변화를 반영하지 않음. 딜 계산이 아니라 수치 변화 비교.
method: 한국 서버 게임 데이터 skill_table의 7레벨과 특화 3 수치를 비교했다. 핵심 수치는 공격력 배율→피해 배율→치유 배율→공격력… 순으로 1개를 고르고, 공격력·방어력 +% 버프는 기본치 포함 최종값(1+버프) 기준으로 상승률을 냈다(Game Hub 계산).
assumptions:
- 정예2·스킬 7레벨 대비 특화 3
- 핵심 수치 1개와 SP·지속만 반영 — 적 방어력, 공격 횟수, 재능·모듈 상호작용은 제외
- SP 감소·지속 증가는 스킬 가동률(지속형) 또는 사용 빈도(즉발형) 변화로 환산, SP는 초당 1(또는 공격당 1) 회복
