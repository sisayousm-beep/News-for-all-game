id: necrass-mastery
title: 네크라스 — 스킬 특화(3특) 효과
kind: stat
version: '5.5'
answer: 2스킬 +31% (최대)
results:
- '특화 3으로 가장 크게 좋아지는 건 2스킬 「무너지는 부패」: 공격력 배율 130%→160%, SP 22→20 — 종합 약 +31%.'
- '3스킬 「왕관으로 빛나는 죽음」: 공격력 배율 650%→800%, SP 21→16 — 약 +23%.'
- '1스킬 「저주받은 염원」: 공격력 배율 370%→450%, SP 17→13 — 약 +22%.'
- '스킬 1개 특화 1→3 재료: 스킬개론 제3권 ×35, RMA70-24 ×4 등 (특화 3 기준 2스킬).'
chart:
  title: 7레벨 → 특화 3 스킬 성능 상승 (핵심 수치 × 가동률)
