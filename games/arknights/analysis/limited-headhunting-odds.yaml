id: limited-headhunting-odds
title: 한정 vs 표준 헤드헌팅 — 원하는 6★를 얻기까지 몇 번?
kind: gacha
version: '6.5'
answer: 한정 평균 약 96회
results:
- 한정 헤드헌팅에서 특정 한정 6★는 평균 약 96회(중앙값 70회)가 들고, 10명 중 1명은 210회를 넘긴다. 300회를 채우면 교환으로 확정.
- 표준(이벤트) 헤드헌팅의 확률 UP 6★는 평균 약 66회(중앙값 57회). 150회 확정 규칙 덕분에 200회 안에 약 99.6%가 얻는다.
- 겁진고금 무료분(매일 1회 14번 + 10회 허가증)만으로 왕을 얻을 확률은 약 16%. 용문 복권방 합성옥(2,800~11,200)을 더해도 약 5~19회가 늘 뿐이다.
- 평균 96회는 합성옥 약 57,600개, 300회 천장은 180,000개(무료 24회를 빼면 276회 = 165,600개)다.
