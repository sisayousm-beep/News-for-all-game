method: 공식 확률(6★ 2%, 한국 공식 홈페이지 확률 안내)과 50회 이후 회당 +2%p 보정(Arknights Terra Wiki), 공식 공지의 한정 300회 교환·표준 150회 확정 규칙으로 20만 회 몬테카를로 시뮬레이션(Game Hub 계산).
assumptions:
- '한정 배너: 확률 UP 6★ 2명이 6★ 중 70%를 나눠 가져 원하는 1명은 35%'
- '표준(이벤트) 배너: 확률 UP 6★ 1명 50%, 150회 동안 못 얻으면 다음 6★ 확정'
- 천장 카운트(50회 이후 보정)는 0에서 시작 — 다른 표준 배너에서 이어온 카운트는 반영하지 않음
- 한정 배너의 300회 추가 지급(왕 1회)과 데이터 계약 교환은 같은 300회에 겹치므로 교환 확정으로 처리
