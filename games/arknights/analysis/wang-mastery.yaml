id: wang-mastery
title: 왕 — 스킬 특화(3특) 효과
kind: stat
version: '6.5'
answer: 1스킬 +41% (최대)
results:
- '특화 3으로 가장 크게 좋아지는 건 1스킬 「기세」: 공격력 배율 120%→135%, SP 20→16 — 종합 약 +41%.'
- '2스킬 「삼연성」: 공격력 배율 480%→580%, SP 16→15 — 약 +29%.'
- '3스킬 「천하겁」: 공격력 배율 320%→380%, SP 54→50 — 약 +28%.'
- '스킬 1개 특화 1→3 재료: 스킬개론 제3권 ×35, 절삭유 원액 ×4 등 (특화 3 기준 1스킬).'
chart:
  title: 7레벨 → 특화 3 스킬 성능 상승 (핵심 수치 × 가동률)
  unit: '%'
  points:
  - label: 1스킬
    value: 40.6
