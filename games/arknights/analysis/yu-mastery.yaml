id: yu-mastery
title: 위 — 스킬 특화(3특) 효과
kind: stat
version: '5.5'
answer: 2스킬 +38% (최대)
results:
- '특화 3으로 가장 크게 좋아지는 건 2스킬 「귀빈 대접」: 공격력 +200%→+290%, SP 29→26 — 종합 약 +38%.'
- '1스킬 「오늘의 주인공」: 최대 HP +40%→+70%, SP 19→16 — 약 +29%.'
- '3스킬 「부엌 속 세상」: 공격력 +80%→+110%, 지속 42→45초 — 약 +21%.'
- '스킬 1개 특화 1→3 재료: 스킬개론 제3권 ×35, 절삭유 원액 ×4 등 (특화 3 기준 2스킬).'
chart:
  title: 7레벨 → 특화 3 스킬 성능 상승 (핵심 수치 × 가동률)
  unit: '%'
  points:
